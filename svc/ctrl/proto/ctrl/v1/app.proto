syntax = "proto3";
package ctrl.v1;

import "ctrl/v1/actor.proto";

option go_package = "github.com/unkeyed/unkey/gen/proto/ctrl/v1;ctrlv1";

service AppService {
  // Create a new app within a project
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {}

  // Change the default image reference for an OCI-sourced app.
  rpc UpdateOciImageSource(UpdateOciImageSourceRequest) returns (UpdateOciImageSourceResponse) {}

  // Delete an app and all associated resources
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse) {}
}

message CreateAppRequest {
  string workspace_id = 1;
  string project_id = 2;
  string name = 3;
  string slug = 4;
  ActorInfo actor = 5;

  oneof source {
    GitSource git = 6;
    OciSource oci = 7;
  }
}

message CreateAppResponse {
  string id = 1;
}

// GitSource has no fields because repository connections have a separate lifecycle.
message GitSource {}

message OciSource {
  string image_reference = 1;
}

message UpdateOciImageSourceRequest {
  string workspace_id = 1;
  string app_id = 2;
  string image_reference = 3;
  ActorInfo actor = 4;
}

message UpdateOciImageSourceResponse {
  string image_reference = 1;
}

message DeleteAppRequest {
  string app_id = 1;
  ActorInfo actor = 2;
}

message DeleteAppResponse {}

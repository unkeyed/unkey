version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../../../gen/proto
    opt:
      - paths=import
      - module=github.com/unkeyed/unkey/gen/proto

  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: ../../../gen/proto
    opt:
      - paths=import
      - module=github.com/unkeyed/unkey/gen/proto

  # TypeScript for ctrl protos is generated separately via buf.gen.ts.yaml

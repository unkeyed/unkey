syntax = "proto3";
package hydra.v1;

import "ctrl/v1/actor.proto";
import "ctrl/v1/deployment.proto";
import "dev/restate/sdk/go.proto";

option go_package = "github.com/unkeyed/unkey/gen/proto/hydra/v1;hydrav1";

// DeployService orchestrates the lifecycle of application deployments as
// durable Restate workflows. Each RPC is idempotent and can safely resume from
// any step after a crash.
//
// Deploy, Rollback, and Promote are keyed by {app_id}:{environment_id} so
// that lifecycle operations within a single environment are serialized
// (preventing e.g. a rollback from racing with an in-flight deploy) while
// different environments of the same app — e.g. production vs preview — can
// deploy in parallel. This means a production push never waits behind a
// preview build. Workspace-wide concurrency is separately enforced by
// BuildSlotService.
//
// Deploy handles the full pipeline from building container images through
// provisioning containers and configuring domain routing. Rollback and Promote
// manage traffic switching between deployments by reassigning sticky frontline
// routes atomically through the routing service.
service DeployService {
  option (dev.restate.sdk.go.service_type) = VIRTUAL_OBJECT;

  // Create is the only writer of deployment rows in this service. It resolves
  // the build source, runs the entitlement gates, writes the row with its
  // queued step and audit log in one transaction, and starts Deploy.
  //
  // The object key is the deployment id, so a caller that derives the same id
  // from an idempotency key lands on the same object and an existing row
  // answers REPLAYED.
  rpc Create(DeployCreateRequest) returns (DeployCreateResponse) {}

  // Deploy executes the full deployment workflow: build (if git source), provision
  // containers across regions, wait for health, configure domain routing, and
  // update the project's live deployment pointer for production environments.
  // Sets deployment status to failed on any error.
  rpc Deploy(DeployRequest) returns (DeployResponse) {}

  // Rollback switches sticky frontline routes (environment and live) from the
  // current live deployment back to a previous one. Marks the project as rolled
  // back so future deploys don't automatically reclaim live routes.
  // Source must be the current live deployment; both must share the same project
  // and environment.
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {}

  // Promote reassigns sticky frontline routes to a target deployment and clears
  // the rolled-back flag, restoring normal deployment flow.
  // Target must be in ready status and not already the live deployment.
  rpc Promote(PromoteRequest) returns (PromoteResponse) {}

  // StopDeployment schedules desired_state=stopped for a running deployment.
  rpc StopDeployment(StopDeploymentRequest) returns (StopDeploymentResponse) {}

  // WakeDeployment schedules desired_state=running for a stopped deployment
  // and waits until enough instances are running again.
  rpc WakeDeployment(WakeDeploymentRequest) returns (WakeDeploymentResponse) {}

  // NotifyInstancesReady is called by the control plane when enough instances
  // have become healthy across the required regions. It resolves the awakeable
  // stored by a suspended deploy or wake workflow so it can continue.
  rpc NotifyInstancesReady(NotifyInstancesReadyRequest) returns (NotifyInstancesReadyResponse) {
    option (dev.restate.sdk.go.handler_type) = SHARED;
  }
}

message StopDeploymentRequest {
  string deployment_id = 1;
  ctrl.v1.ActorInfo actor = 2;
  string correlation_id = 3;
}

message StopDeploymentResponse {}

message WakeDeploymentRequest {
  string deployment_id = 1;
  ctrl.v1.ActorInfo actor = 2;
  string correlation_id = 3;
}

message WakeDeploymentResponse {}

message NotifyInstancesReadyRequest {
  string deployment_id = 1;
}

message NotifyInstancesReadyResponse {
  bool resolved = 1;
}

// OciImage references a pre-built OCI image to deploy directly,
// skipping the build step.
message OciImage {
  string image = 1;
}

// GitSource specifies a repository and commit to build a container image from.
message GitSource {
  // GitHub App installation ID used to clone the repository.
  int64 installation_id = 1;

  // Full repository identifier (e.g., "owner/repo").
  string repository = 2;

  // Commit SHA to build.
  string commit_sha = 3;

  // Subdirectory within the repository to use as the Docker build context.
  string context_path = 4;

  // Path to the Dockerfile, relative to context_path. Empty means no
  // Dockerfile is configured and the image is built with Railpack instead.
  string dockerfile_path = 5;

  // Branch name used to resolve commit_sha when it is empty. The deploy worker
  // calls GitHub to look up the HEAD commit of this branch.
  string branch = 6;

  // PR number for fork PRs. When set, BuildKit fetches refs/pull/<number>/head
  // from the base repo instead of using commit_sha directly.
  int64 pr_number = 7;

  // Full fork repository identifier (e.g., "contributor/repo"). When set, the
  // deploy worker uses the public GitHub API and clones from the fork repo.
  string fork_repository = 8;

  // Custom build command for Railpack builds (RAILPACK_BUILD_CMD). Empty means
  // Railpack auto-detects the command. Lets monorepos scope the build to a
  // single app. Ignored when dockerfile_path is set.
  string build_command = 9;
}

// CreateDecision is what the caller decided should happen to this deployment.
// Every value writes a row; they differ in what happens to it next.
//
// It carries the verdict and not the evidence, because two of the inputs behind
// it are push-only: the files a commit touched and whether the push came from a
// fork. Create can see neither, so unlike the entitlement gate this is the sole
// enforcement point and Create does not re-check it.
enum CreateDecision {
  CREATE_DECISION_UNSPECIFIED = 0;

  // DEPLOY writes the row and builds it.
  CREATE_DECISION_DEPLOY = 1;

  // SKIP writes the row and stops there, recording that the commit was seen
  // and deliberately not built.
  CREATE_DECISION_SKIP = 2;

  // AWAIT_APPROVAL writes the row and waits for a project member. Only
  // AuthorizeDeployment can start it building.
  CREATE_DECISION_AWAIT_APPROVAL = 3;
}

// CreateOutcome is what a create did. A refused create comes back as BLOCKED
// instead of as a terminal error, so a caller that can never become eligible
// does not leave Restate retrying it.
enum CreateOutcome {
  CREATE_OUTCOME_UNSPECIFIED = 0;

  // CREATED wrote a new row.
  CREATE_OUTCOME_CREATED = 1;

  // REPLAYED found the row already there and changed nothing.
  CREATE_OUTCOME_REPLAYED = 2;

  // BLOCKED wrote nothing. See blocked_reason.
  CREATE_OUTCOME_BLOCKED = 3;
}

// CreateBlockedReason is why a create was refused, as a value a caller can
// branch on instead of a message it would have to parse.
enum CreateBlockedReason {
  CREATE_BLOCKED_REASON_UNSPECIFIED = 0;

  // NO_COMPUTE_PLAN: the workspace holds no Deploy entitlement and the gate is
  // enforcing.
  CREATE_BLOCKED_REASON_NO_COMPUTE_PLAN = 1;

  // SPEND_SUSPENDED: the workspace is over its Compute spend cap.
  CREATE_BLOCKED_REASON_SPEND_SUSPENDED = 2;

  // TARGET_NOT_FOUND: the project, app, or environment does not exist, or they
  // do not belong together. Reachable when a target is deleted between the
  // caller's own lookup and this create.
  CREATE_BLOCKED_REASON_TARGET_NOT_FOUND = 3;

  // NO_REPO_CONNECTION: a git source was requested for an app with no connected
  // repository. Refused instead of falling back to the current image, which
  // would ship a different artifact than the one asked for.
  CREATE_BLOCKED_REASON_NO_REPO_CONNECTION = 4;

  // COMMIT_NOT_RESOLVED: GitHub could not resolve the requested branch or
  // commit.
  CREATE_BLOCKED_REASON_COMMIT_NOT_RESOLVED = 5;

  // NO_SOURCE_IMAGE: the deployment being redeployed has neither a commit with
  // a repository connection nor an image, so there is nothing to build from.
  CREATE_BLOCKED_REASON_NO_SOURCE_IMAGE = 6;

  // NEWER_DEPLOYMENT_EXISTS: a rebuild found a newer active deployment on the
  // same app, environment, and branch. Clear require_no_newer to override.
  CREATE_BLOCKED_REASON_NEWER_DEPLOYMENT_EXISTS = 7;
}

// CreateGitSource builds from a repository commit. The worker resolves the
// repository connection from the app, so a caller names only the commit it
// wants.
message CreateGitSource {
  // Commit metadata as far as the caller knows it. Empty fields are filled from
  // GitHub. A request with neither a sha nor a branch gets the app's default
  // branch. A sha without a branch keeps its empty branch, because that sha can
  // live off the default branch and a wrong branch beside a right sha is worse
  // than no branch.
  ctrl.v1.GitCommitInfo commit = 1;

  // PR number for fork PRs. BuildKit fetches refs/pull/<number>/head from the
  // base repository instead of cloning the commit directly.
  int64 pr_number = 2;
}

// CreateImageSource deploys a pre-built container image as it is, with no
// build step and no git metadata synthesized onto the row.
message CreateImageSource {
  string image = 1;
}

// CreateExistingDeploymentSource rebuilds what another deployment ran: its
// commit when the app still has a repository connection, otherwise its image.
// The new row takes the app's current runtime settings and environment
// variables, so any configuration change since the source applies. That is what
// makes it usable for a hotfix, a settings rollout, or recovery from a lost
// image.
message CreateExistingDeploymentSource {
  string deployment_id = 1;

  // RequireNoNewer refuses the rebuild when a newer active deployment exists on
  // the same app, environment, and branch. Leave it unset to rebuild the named
  // deployment whatever else has shipped since.
  bool require_no_newer = 2;
}

message DeployCreateRequest {
  // Target. The request carries ids only. The worker loads the project, app,
  // environment, and their settings itself, so the row records the settings
  // current when the create runs and not when it was requested.
  string project_id = 1;
  string app_id = 2;

  // Environment named by id or slug.
  string environment = 3;

  oneof source {
    CreateGitSource git = 4;
    CreateImageSource image = 5;
    CreateExistingDeploymentSource existing_deployment = 6;
  }

  // Container command override. Empty uses the app's stored default.
  repeated string command = 7;

  // Decision the caller already reached. See CreateDecision.
  CreateDecision decision = 8;

  // PushReceivedAt is when the webhook received the push, in unix milliseconds,
  // and it becomes the row's created_at. Every Create from one push carries the
  // same value, so sibling dedup and the supersede check keep push order even
  // when the per-app sends land out of order. Zero means no push is behind the
  // request, and the worker stamps created_at from its own clock.
  int64 push_received_at = 9;

  // Attribution persisted on the deployment row.
  ctrl.v1.DeploymentTrigger trigger = 10;
  string triggered_by = 11;
  string trigger_reason = 12;

  // Actor attributed on the audit log. Unset falls back to the system actor.
  ctrl.v1.ActorInfo actor = 13;
}

// DeployCreateResponse says what a create did. It carries no deployment id: the
// id is the object key, so a caller knows it before calling. Callers that send
// Create one-way, such as the public API and the GitHub webhook, never see it.
message DeployCreateResponse {
  CreateOutcome outcome = 1;

  // BlockedReason is set only when outcome is BLOCKED. The text explaining it
  // stays in the worker's logs, because it names repositories and deployments
  // the caller may have no right to read.
  CreateBlockedReason blocked_reason = 2;
}

message DeployRequest {
  string deployment_id = 1;

  reserved 2;
  reserved "key_auth_id";

  oneof source {
    GitSource git = 3;
    OciImage oci_image = 4;
  }

  // Container command override (e.g., ["./app", "serve"])
  repeated string command = 5;
}

message DeployResponse {}

// RollbackRequest identifies the deployment to roll back from and the
// deployment to restore. Both must belong to the same project and environment.
message RollbackRequest {
  // The current live deployment to roll back from.
  string source_deployment_id = 1;

  // A previous deployment to restore traffic to.
  string target_deployment_id = 2;

  ctrl.v1.ActorInfo actor = 3;
  string correlation_id = 4;
}

message RollbackResponse {}

// PromoteRequest identifies a ready deployment to promote to live.
message PromoteRequest {
  string target_deployment_id = 1;
  ctrl.v1.ActorInfo actor = 2;
  string correlation_id = 3;
}

message PromoteResponse {}

// DeployTeardownService stops a workspace's running Deploy compute and waits
// for it to drain, keyed by workspace id so teardowns serialize per workspace.
service DeployTeardownService {
  option (dev.restate.sdk.go.service_type) = VIRTUAL_OBJECT;

  // Teardown stops every running deployment in the workspace and polls until
  // they drain, forcing completion after a grace timeout so a stuck pod can't
  // block the caller forever. Clears apps.current_deployment_id for any app
  // whose current deployment it stops, so the DeploymentService guard permits
  // the state change. Idempotent.
  rpc Teardown(TeardownRequest) returns (TeardownResponse) {}

  // Resume reverses a SUSPEND: it brings the workspace's suspended deployments
  // back to running and restores each app's current deployment from the record
  // Teardown(SUSPEND) saved. Idempotent: a no-op when the workspace was not
  // suspended (no record).
  rpc Resume(ResumeRequest) returns (ResumeResponse) {}
}

// TeardownMode selects whether the stopped deployments are permanently archived
// (cancel) or left resumable (spend cap). It does not affect the desired state
// they land in, both stop and drain identically; it selects resumability:
// SUSPEND records what was stopped so Resume can restore it, ARCHIVE does not.
enum TeardownMode {
  TEARDOWN_MODE_UNSPECIFIED = 0;

  // ARCHIVE permanently decommissions the deployments (cancel). The cleared
  // current_deployment_id stays cleared.
  TEARDOWN_MODE_ARCHIVE = 1;

  // SUSPEND stops the deployments but records what it stopped so Resume can
  // bring them back (spend cap).
  TEARDOWN_MODE_SUSPEND = 2;
}

message TeardownRequest {
  // Mode selects archive (cancel) vs suspend (spend cap). See TeardownMode.
  TeardownMode mode = 1;
}

message TeardownResponse {
  // DeploymentsStopped is how many running deployments this teardown scheduled
  // a stop for.
  int32 deployments_stopped = 1;

  // Drained is true when every stopped deployment reached a terminal state
  // before the grace timeout. False means the grace timeout forced completion
  // with compute still draining (an alert was logged).
  bool drained = 2;
}

message ResumeRequest {}

message ResumeResponse {
  // DeploymentsResumed is how many deployments were returned to running.
  int32 deployments_resumed = 1;
}

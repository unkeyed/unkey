syntax = "proto3";

package hydra.v1;

import "buf/validate/validate.proto";
import "dev/restate/sdk/go.proto";

option go_package = "github.com/unkeyed/unkey/gen/proto/hydra/v1;hydrav1";

service KeyLeakService {
  option (dev.restate.sdk.go.service_type) = SERVICE;

  rpc NotifyBatch(KeyLeakBatchRequest) returns (KeyLeakResponse) {}
  rpc Notify(KeyLeakNotification) returns (KeyLeakResponse) {}
  rpc NotifyEmail(KeyLeakEmailRequest) returns (KeyLeakResponse) {}
  rpc NotifySlack(KeyLeakNotification) returns (KeyLeakResponse) {}
}

message KeyLeakBatchRequest {
  string report_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated KeyLeakMatch keys = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

message KeyLeakMatch {
  string hash = 1 [(buf.validate.field).string.len = 44];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  KeyLeakNotification notification = 3 [(buf.validate.field).required = true];
  bool root_key = 4;
}

message KeyLeakNotification {
  string key_id = 1;
  string org_id = 2 [(buf.validate.field).string.min_len = 1];
  string workspace_name = 3;
  string source = 4;
  string url = 5;
  string type = 6;
  string date = 7;
}

message KeyLeakEmailRequest {
  KeyLeakNotification leak = 1 [(buf.validate.field).required = true];
  string email = 2;
}

message KeyLeakResponse {}

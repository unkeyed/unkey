syntax = "proto3";

package hydra.v1;

import "buf/validate/validate.proto";
import "dev/restate/sdk/go.proto";

option go_package = "github.com/unkeyed/unkey/gen/proto/hydra/v1;hydrav1";

service KeyLeakService {
  option (dev.restate.sdk.go.service_type) = SERVICE;

  rpc Notify(KeyLeakNotification) returns (KeyLeakResponse) {}
  rpc NotifyEmail(KeyLeakEmailRequest) returns (KeyLeakResponse) {}
  rpc NotifySlack(KeyLeakNotification) returns (KeyLeakResponse) {}
}

message KeyLeakNotification {
  string key_id = 1;
  string org_id = 2 [(buf.validate.field).string.min_len = 1];
  string workspace_name = 3;
  string source = 4;
  string url = 5;
  string type = 6;
  string date = 7;
  KeyLeakReporter reporter = 8;
  string workspace_id = 9;
  KeyLeakKeyStore key_store = 10;
  bool revoke = 11;
  string key_hash = 12;
  KeyLeakKeyKind key_kind = 13;
}

enum KeyLeakReporter {
  KEY_LEAK_REPORTER_UNSPECIFIED = 0;
  KEY_LEAK_REPORTER_GITHUB = 1;
  KEY_LEAK_REPORTER_TRUFFLEHOG = 2;
}

enum KeyLeakKeyStore {
  KEY_LEAK_KEY_STORE_UNSPECIFIED = 0;
  KEY_LEAK_KEY_STORE_ROOT_KEYS = 1;
  KEY_LEAK_KEY_STORE_KEYS = 2;
}

enum KeyLeakKeyKind {
  KEY_LEAK_KEY_KIND_UNSPECIFIED = 0;
  KEY_LEAK_KEY_KIND_ROOT = 1;
  KEY_LEAK_KEY_KIND_API = 2;
}

message KeyLeakEmailRequest {
  KeyLeakNotification leak = 1 [(buf.validate.field).required = true];
  string email = 2;
}

message KeyLeakResponse {}

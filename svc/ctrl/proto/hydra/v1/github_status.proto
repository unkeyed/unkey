syntax = "proto3";
package hydra.v1;

import "dev/restate/sdk/go.proto";

option go_package = "github.com/unkeyed/unkey/gen/proto/hydra/v1;hydrav1";

// GitHubStatusService tracks one deployment's GitHub deployment status and
// dispatches its PR comment updates. Any service can send status updates
// without carrying GitHub credentials or deployment state.
service GitHubStatusService {
  option (dev.restate.sdk.go.service_type) = VIRTUAL_OBJECT;

  // Init sets up the virtual object, GitHub deployment, and initial PR row.
  // The deploy workflow calls it once after the build step completes.
  rpc Init(GitHubStatusInitRequest) returns (GitHubStatusInitResponse) {}

  // ReportStatus updates the GitHub deployment and queues its PR row update.
  // Errors are logged and never propagated.
  rpc ReportStatus(GitHubStatusReportRequest) returns (GitHubStatusReportResponse) {}
}

// GitHubPullRequestCommentService serializes updates to the shared deployment
// comment for one installation, repository, and pull request.
service GitHubPullRequestCommentService {
  option (dev.restate.sdk.go.service_type) = VIRTUAL_OBJECT;

  rpc UpsertPullRequestComment(GitHubPullRequestCommentRequest) returns (GitHubPullRequestCommentResponse) {}
}

// GitHubDeploymentState maps to the GitHub Deployments API status values.
// See: https://docs.github.com/en/rest/deployments/statuses#create-a-deployment-status
enum GitHubDeploymentState {
  GITHUB_DEPLOYMENT_STATE_UNSPECIFIED = 0;
  GITHUB_DEPLOYMENT_STATE_PENDING = 1;
  GITHUB_DEPLOYMENT_STATE_IN_PROGRESS = 2;
  GITHUB_DEPLOYMENT_STATE_SUCCESS = 3;
  GITHUB_DEPLOYMENT_STATE_FAILURE = 4;
  GITHUB_DEPLOYMENT_STATE_ERROR = 5;
  GITHUB_DEPLOYMENT_STATE_INACTIVE = 6;
  GITHUB_DEPLOYMENT_STATE_QUEUED = 7;
}

// GitHubStatusInitRequest carries the context needed to create the GitHub
// deployment and PR row. The deploy workflow populates it after the build step
// so the commit SHA is resolved.
message GitHubStatusInitRequest {
  int64 installation_id = 1;
  string repo = 2;
  string commit_sha = 3;
  string branch = 4;

  string environment_label = 5;
  string environment_url = 6;
  string log_url = 7;
  bool is_production = 8;

  string project_slug = 9;
  string app_slug = 10;
  string env_slug = 11;

  // PR number if known; 0 triggers a branch-based lookup.
  int32 pr_number = 12;

  // Reuse an existing GitHub deployment (e.g. created during approval flow).
  // If > 0, Init skips CreateDeployment and uses this ID directly.
  int64 existing_github_deployment_id = 13;

  // Stable workspace/project/app/environment identity for the shared PR
  // comment row. Display slugs are not unique across workspaces.
  string comment_row_key = 14;

  // GitHub's stable repository ID keeps comment updates serialized across
  // repository renames.
  int64 repository_id = 15;
}

message GitHubStatusInitResponse {}

message GitHubStatusReportRequest {
  GitHubDeploymentState state = 1;
  string description = 2;
}

message GitHubStatusReportResponse {}

message GitHubPullRequestCommentRequest {
  GitHubStatusInitRequest config = 1;
  int32 pr_number = 2;
  string status = 3;
}

message GitHubPullRequestCommentResponse {}

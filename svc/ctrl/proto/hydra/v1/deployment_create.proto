syntax = "proto3";
package hydra.v1;

import "ctrl/v1/actor.proto";
import "ctrl/v1/deployment.proto";
import "dev/restate/sdk/go.proto";
import "hydra/v1/deploy.proto";

option go_package = "github.com/unkeyed/unkey/gen/proto/hydra/v1;hydrav1";

// DeploymentCreateService owns the durable part of a deployment create: the
// row insert with its audit log, the DeployService send, the invocation-id
// write, and the sibling dedup. Ctrl runs the gates and resolves the build
// source before the call, so a request that reaches this service is already
// authorized and fully specified.
//
// A plain service, not a virtual object: creates for different deployments
// have nothing to serialize on. Deduplication of caller retries happens at
// the invocation layer instead: ctrl calls Create with an idempotency key
// derived from (workspace id, app id, environment id, caller key), so a
// retry attaches to the original invocation and receives its journaled
// response. Durable execution completes every accepted create: it cannot
// die between the insert and the send.
service DeploymentCreateService {
  option (dev.restate.sdk.go.service_type) = SERVICE;

  // Create inserts the deployment row (with its create audit in the same
  // transaction), starts the Deploy workflow, records the invocation id, and
  // cancels superseded queued siblings. A target deleted between ctrl's
  // checks and execution fails terminally; transient failures retry.
  rpc Create(DeploymentCreateRequest) returns (DeploymentCreateResponse) {}
}

// DeploymentCreateAction is why the row is created. Only CREATE writes the
// deployment.create audit log; a rebuild's audit is recorded by ctrl with
// its own deployment.rebuild event.
enum DeploymentCreateAction {
  DEPLOYMENT_CREATE_ACTION_UNSPECIFIED = 0;
  DEPLOYMENT_CREATE_ACTION_CREATE = 1;
  DEPLOYMENT_CREATE_ACTION_REBUILD = 2;
}

message DeploymentCreateRequest {
  // Replay detection: the handler echoes this back, so a caller that reads
  // a different nonce knows its request attached to an existing invocation.
  string nonce = 1;

  // Target identifiers. The handler reloads project, app, environment, and
  // settings itself instead of trusting a snapshot, so the row records the
  // settings current at execution time.
  string project_id = 2;
  string app_id = 3;
  string environment_slug = 4;

  // The fully resolved DeployService request, including the deployment id
  // ctrl generated and the build source it resolved (GitHub resolution
  // happens in ctrl, before the key is consumed). When two racing requests
  // carry the same idempotency key, the one that starts the invocation
  // defines the deployment; the loser attaches and gets its response.
  DeployRequest deploy_request = 5;

  // Commit metadata recorded on the row, already resolved and complete.
  ctrl.v1.GitCommitInfo git_commit = 6;

  // Attribution persisted on the deployment row.
  ctrl.v1.DeploymentTrigger trigger = 7;
  string triggered_by = 8;
  string trigger_reason = 9;

  // Actor attributed on the deployment.create audit log. Nil falls back to
  // the system actor.
  ctrl.v1.ActorInfo actor = 10;

  DeploymentCreateAction action = 11;
}

message DeploymentCreateResponse {
  // Nonce of the request whose execution produced this response. A caller
  // that reads back a foreign nonce knows it was answered by replay, and
  // checks the deployment row for the current status.
  string nonce = 1;

  string deployment_id = 2;
}

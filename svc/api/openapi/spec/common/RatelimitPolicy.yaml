type: object
required:
  - limit
  - windowMs
properties:
  limit:
    type: integer
    format: int64
    minimum: 1
    description: Maximum number of requests per window.
  windowMs:
    type: integer
    format: int64
    minimum: 1
    description: Window duration in milliseconds.
  identifier:
    allOf:
      - "$ref": "./RatelimitIdentifier.yaml"
    description: |-
      One source that supplies the rate limit key. Equal to `identifiers`
      with one entry.
  identifiers:
    type: array
    items:
      "$ref": "./RatelimitIdentifier.yaml"
    minItems: 1
    maxItems: 5
    description: |-
      Ordered list of sources that form a compound rate limit key. The
      gateway resolves each source for each request. Each unique
      combination of resolved values has its own counter. All counters use
      the same limit and window. Example: `[authenticatedSubject, path]`
      limits each subject separately on each path.
additionalProperties: false
description: |-
  Rate limits matching requests. Set exactly one of `identifier` (one
  dimension) or `identifiers` (a compound key of 1 to 5 dimensions).
example:
  limit: 100
  windowMs: 60000
  identifier:
    remoteIp: {}

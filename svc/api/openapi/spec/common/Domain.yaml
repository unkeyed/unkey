type: object
required:
  - id
  - domain
  - projectId
  - appId
  - environmentId
  - status
  - dnsRecords
  - createdAt
properties:
  id:
    "$ref": "./ResourceIdentifier.yaml"
  domain:
    type: string
    minLength: 4
    maxLength: 253
    description: Fully qualified domain name attached to the environment.
    example: api.acme.com
  projectId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The project the domain's environment belongs to.
    example: proj_1234abcd
  appId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The app the domain's environment belongs to.
    example: app_1234abcd
  environmentId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: |
      The environment this domain serves. Traffic to the domain reaches whatever is currently
      deployed to this environment.
    example: env_1234abcd
  status:
    type: string
    enum:
      - pending
      - verifying
      - verified
      - failed
    # Codegen otherwise emits bare Pending/Verifying/Verified/Failed into the shared openapi package.
    x-enum-varnames:
      - DomainStatusPending
      - DomainStatusVerifying
      - DomainStatusVerified
      - DomainStatusFailed
    description: |
      Where the domain is in verification.

      - `pending`: created, no DNS check has completed yet
      - `verifying`: DNS is being polled, roughly once a minute
      - `verified`: verification passed and a certificate has been requested
      - `failed`: the required records did not appear within 24 hours of creation

      `verified` means verification passed, so Unkey has provisioned routing and requested a
      certificate. Each entry in `dnsRecords` carries its own `verified` flag showing which record
      that proof came from.
    example: verified
  verificationError:
    type: string
    maxLength: 512
    description: |
      Why the most recent verification attempt did not succeed, in plain language.
      Omitted while verification is progressing normally.
    example: domain verification timed out after 24 hours
  dnsRecords:
    type: array
    minItems: 1
    items:
      "$ref": "./DnsRecord.yaml"
    description: |
      The DNS records this domain needs, rebuilt from stored state so they match what
      domains.createDomain returned. Useful for recovering the values without re-creating the domain,
      and each entry's `verified` flag shows which records are still outstanding.
  createdAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds when the domain was created. The 24 hour verification window runs from here.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds of the last change to this domain. Omitted if it has never changed.
    example: 1704153600000
additionalProperties: false

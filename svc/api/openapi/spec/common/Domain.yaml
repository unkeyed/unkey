type: object
required:
  - id
  - domain
  - projectId
  - appId
  - environmentId
  - status
  - dnsRecords
  - createdAt
properties:
  id:
    "$ref": "./ResourceIdentifier.yaml"
  domain:
    type: string
    minLength: 4
    maxLength: 253
    description: Fully qualified domain name attached to the environment.
    example: api.acme.com
  projectId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The project the domain's environment belongs to.
    example: proj_1234abcd
  appId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The app the domain's environment belongs to.
    example: app_1234abcd
  environmentId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: |
      The environment this domain serves. Traffic to the domain reaches whatever is currently
      deployed to this environment.
    example: env_1234abcd
  status:
    type: string
    enum:
      - pending
      - verifying
      - verified
      - failed
    # Codegen otherwise emits bare Pending/Verifying/Verified/Failed into the shared openapi package.
    x-enum-varnames:
      - DomainStatusPending
      - DomainStatusVerifying
      - DomainStatusVerified
      - DomainStatusFailed
    description: |
      The verification status of the domain.

      - `pending`: the domain is created. No DNS check has completed yet.
      - `verifying`: Unkey checks the DNS records approximately each minute.
      - `verified`: the domain is verified. Unkey has configured routing and requested a certificate.
      - `failed`: the required DNS records did not appear within 24 hours. Fix the records, then retry verification.
    example: verified
  verificationError:
    type: string
    maxLength: 512
    description: |
      Why the most recent verification attempt did not succeed, in plain language.
      Omitted while verification is progressing normally.
    example: domain verification timed out after 24 hours
  dnsRecords:
    type: array
    minItems: 1
    items:
      "$ref": "./DnsRecord.yaml"
    description: |
      The DNS records this domain needs. Create each record at your DNS provider.
      Each record has a `verified` flag. The flag shows whether Unkey has read that record back,
      so it tells you which records are still missing.
  createdAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds when the domain was created. The 24 hour verification window runs from here.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds of the last change to this domain. Omitted if it has never changed.
    example: 1704153600000
additionalProperties: false

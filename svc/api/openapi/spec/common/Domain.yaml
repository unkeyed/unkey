type: object
required:
  - id
  - domain
  - projectId
  - appId
  - environmentId
  - status
  - routingVerified
  - ownershipVerified
  - dnsRecords
  - createdAt
properties:
  id:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: |
      The unique identifier of this domain, generated by Unkey.
      Always begins with 'dom_' followed by a unique alphanumeric sequence.
    example: dom_1234abcd
  domain:
    type: string
    minLength: 4
    maxLength: 253
    description: Fully qualified domain name attached to the environment.
    example: api.acme.com
  projectId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The project the domain's environment belongs to.
    example: proj_1234abcd
  appId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The app the domain's environment belongs to.
    example: app_1234abcd
  environmentId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: |
      The environment this domain serves. Traffic to the domain reaches whatever is currently
      deployed to this environment.
    example: env_1234abcd
  status:
    type: string
    enum:
      - pending
      - verifying
      - verified
      - failed
    # Codegen otherwise emits bare Pending/Verifying/Verified/Failed into the shared openapi package.
    x-enum-varnames:
      - DomainStatusPending
      - DomainStatusVerifying
      - DomainStatusVerified
      - DomainStatusFailed
    description: |
      Where the domain is in verification.

      - `pending`: created, no DNS check has completed yet
      - `verifying`: DNS is being polled, roughly once a minute
      - `verified`: verification passed and a certificate has been requested
      - `failed`: the required records did not appear within 24 hours of creation

      Treat this as a summary, not as a routing guarantee. Read `routingVerified` to learn whether
      traffic actually reaches Unkey: verification can pass on ownership alone, so `verified` with
      `routingVerified: false` means the domain is claimed but serves nothing.
    example: verified
  routingVerified:
    type: boolean
    description: |
      Whether the routing record has been read back with the expected value. This is what determines
      if traffic reaches Unkey. False means the routing record from `dnsRecords` is missing, wrong,
      or unreadable, which is what a proxied record looks like.
    example: true
  ownershipVerified:
    type: boolean
    description: |
      Whether the TXT record proving ownership has been read back. False is normal for a domain that
      verified through its routing record alone, since the TXT record is only consulted when it is
      needed.
    example: false
  verificationError:
    type: string
    maxLength: 512
    description: |
      Why the most recent verification attempt did not succeed, in plain language.
      Omitted while verification is progressing normally.
    example: domain verification timed out after 24 hours
  lastCheckedAt:
    type: integer
    format: int64
    description: |
      Unix timestamp in milliseconds of the most recent DNS check.
      Omitted until the first check completes.
    example: 1704067200000
  dnsRecords:
    type: array
    minItems: 1
    items:
      "$ref": "./DnsRecord.yaml"
    description: |
      The DNS records this domain needs, rebuilt from stored state so they match what
      domains.createDomain returned. Useful for recovering the values without re-creating the domain,
      and for showing what is still outstanding when `routingVerified` or `ownershipVerified` is
      false.
  createdAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds when the domain was created. The 24 hour verification window runs from here.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds of the last change to this domain. Omitted if it has never changed.
    example: 1704153600000
additionalProperties: false

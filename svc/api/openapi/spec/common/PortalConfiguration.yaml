type: object
description: |
  A Customer Portal configuration. Maps to exactly one keyspace or one app and
  scopes the portal experience for a workspace's end users.
required:
  - id
  - slug
  - enabled
  - createdAt
properties:
  id:
    type: string
    description: |
      The unique identifier of the portal configuration, generated by Unkey.
      Always begins with 'pc_'.
    example: pc_1234abcd
  slug:
    type: string
    minLength: 3
    maxLength: 64
    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
    description: |
      Human-readable slug, unique within the workspace. Used by
      `portal.createSession` to select the configuration.
    example: my-portal
  keyspaceId:
    type: string
    description: |
      The keyspace this configuration maps to. Present when the configuration is
      keyspace-mapped; omitted when it is app-mapped.
    example: ks_1234abcd
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
  appId:
    type: string
    description: |
      The app this configuration maps to. Present when the configuration is
      app-mapped; omitted when it is keyspace-mapped.
    example: app_1234abcd
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
  enabled:
    type: boolean
    description: |
      Whether the portal configuration is enabled. Disabled configurations reject
      new session creation.
    example: true
  returnUrl:
    type: string
    format: uri
    maxLength: 500
    description: |
      URL the end user is returned to when they exit the portal.
    example: "https://app.example.com/dashboard"
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
  branding:
    "$ref": "./PortalBranding.yaml"
  createdAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the configuration was created.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the configuration was last updated.
      Omitted if the configuration has never been updated.
    example: 1704153600000
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
additionalProperties: false

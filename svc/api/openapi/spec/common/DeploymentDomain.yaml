type: object
required:
  - domain
  - type
  - status
properties:
  domain:
    type: string
    description: |
      Fully qualified domain name this deployment is reachable at.
    example: kebap-app-preview.unkey.app
  type:
    type: string
    enum:
      - system
      - custom
    x-enum-varnames:
      - DeploymentDomainTypeSystem
      - DeploymentDomainTypeCustom
    description: |
      `system` is an Unkey-managed hostname (always active). `custom` is a
      customer-owned domain whose `status` reflects verification.
    example: system
  status:
    type: string
    enum:
      - active
      - pending
      - failed
    x-enum-varnames:
      - DeploymentDomainStatusActive
      - DeploymentDomainStatusPending
      - DeploymentDomainStatusFailed
    description: |
      `active` serves traffic. `pending` is a custom domain awaiting
      verification. `failed` is a custom domain whose verification failed.
    example: active
additionalProperties: false

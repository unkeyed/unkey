type: object
description: |
  Configure a Docker image as the app source. The image reference must include
  an explicit tag or digest.
required:
  - dockerImage
properties:
  dockerImage:
    type: string
    minLength: 1
    maxLength: 512
    pattern: "\\S"
    description: The default Docker image reference for new deployments.
    example: ghcr.io/acme/api:v1.2.3
additionalProperties: false

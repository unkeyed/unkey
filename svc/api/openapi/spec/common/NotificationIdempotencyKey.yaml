type: string
minLength: 1
maxLength: 128
pattern: '^[^\s\x00]([^\x00]*[^\s\x00])?$'
description: Workspace- and action-scoped idempotency key containing 1 to 128 UTF-8 bytes. Leading or trailing whitespace and NUL characters are not allowed. The server enforces the byte limit, which may be reached before 128 Unicode characters. Repeated creation requests return the existing redacted resource without changing it. Repeated tests for the same destination return the original delivery. Use a fresh key for a different intended resource or a new test.

type: object
description: |
  Connect a GitHub repository as the app source on creation.
required:
  - repository
properties:
  repository:
    type: string
    minLength: 1
    maxLength: 255
    description: |
      The GitHub repository to connect, as "owner/repo". The workspace must have
      the Unkey GitHub App installed with access to it.
    example: unkeyed/unkey
  defaultBranch:
    type: string
    minLength: 1
    maxLength: 256
    description: |
      The branch this app's deployments track. Omit to adopt the repository's
      default branch on GitHub.
    example: main
additionalProperties: false

type: object
required:
  - id
  - slug
  - displayName
  - enabled
  - createdAt
description: |
  A portal you expose to your end users so they can manage their own keys.

  Exactly one of `keyspaceId` or `appId` is present, naming the single resource
  the portal serves. Neither is in the required list because which one appears
  depends on the portal, so a reader checks for the one it cares about.
properties:
  id:
    type: string
    description: |
      The unique identifier of the portal, generated by Unkey.
    example: pc_1234abcd
  slug:
    type: string
    minLength: 3
    maxLength: 64
    description: |
      URL-safe handle for this portal, unique within your workspace.
    example: acme-portal
  displayName:
    type: string
    minLength: 1
    maxLength: 64
    description: |
      Human-readable name your end users see in the portal header and page
      titles. Unlike `slug` it is not part of any URL, so it can be changed
      freely.
    example: Acme
  enabled:
    type: boolean
    description: |
      Whether new sessions can be minted for this portal.

      Disabling a portal stops `portal.createSession` from minting new sessions.
      It does not end sessions that are already live.
    example: true
  keyspaceId:
    "$ref": "./PortalKeyspaceId.yaml"
  appId:
    "$ref": "./PortalAppId.yaml"
  branding:
    description: |
      How the portal looks to your end users. Omitted when no branding is set.
    allOf:
      - "$ref": "./PortalBranding.yaml"
  createdAt:
    type: integer
    format: int64
    description: |
      Unix timestamp in milliseconds when the portal was created.
    example: 1719849600000
  updatedAt:
    type: integer
    format: int64
    description: |
      Unix timestamp in milliseconds when the portal was last changed. Omitted
      if it has never been changed since creation.
    example: 1719936000000
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
additionalProperties: false

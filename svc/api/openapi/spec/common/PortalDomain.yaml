type: object
required:
  - id
  - portalId
  - domain
  - status
  - dnsRecords
  - createdAt
properties:
  id:
    type: string
    minLength: 3
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The portal domain's ID. Pass it as `domainId` to the other portal domain operations.
    example: pdom_1234abcd
  portalId:
    type: string
    minLength: 3
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: The portal this domain serves.
    example: pc_1234abcd
  domain:
    type: string
    minLength: 4
    maxLength: 253
    description: Fully qualified domain name attached to the portal.
    example: portal.acme.com
  status:
    type: string
    enum:
      - pending
      - verifying
      - verified
      - failed
    # Distinct names so codegen does not collide with Domain's status enum in the shared package.
    x-enum-varnames:
      - PortalDomainStatusPending
      - PortalDomainStatusVerifying
      - PortalDomainStatusVerified
      - PortalDomainStatusFailed
    description: |
      The verification status of the domain.

      - `pending`: the domain is created. No DNS check has completed yet.
      - `verifying`: Unkey checks the DNS records approximately each minute.
      - `verified`: the domain is verified and serves the portal.
      - `failed`: the required DNS records did not appear within 24 hours. Fix the records, then retry verification.
    example: verified
  verificationError:
    type: string
    maxLength: 512
    description: |
      Why the most recent verification attempt did not succeed, in plain language.
      Omitted while verification is progressing normally.
    example: domain verification timed out after 24 hours
  dnsRecords:
    type: array
    minItems: 1
    items:
      "$ref": "./DnsRecord.yaml"
    description: |
      The DNS records this domain needs. Create each record at your DNS provider.
      Each record has a `verified` flag showing whether Unkey has read that record back.
  createdAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds when the domain was created. The 24 hour verification window runs from here.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    description: Unix timestamp in milliseconds of the last change to this domain. Omitted if it has never changed.
    example: 1704153600000
additionalProperties: false

type: object
required:
  - id
  - name
  - slug
  - isRolledBack
  - deleteProtection
  - createdAt
properties:
  id:
    type: string
    description: |
      The unique identifier of the app, generated by Unkey.
    example: app_1234abcd
  name:
    type: string
    description: |
      Human-readable name for this app.
    example: Payments API
  slug:
    type: string
    description: |
      URL-safe handle for this app, unique within its project.
      Chosen at creation time.
    example: payments-api
  sourceType:
    type: string
    enum:
      - legacy
      - github
      - docker_image
    description: |
      The configured source used to create deployments. `legacy` identifies
      apps created before explicit source tracking was introduced.
    example: docker_image
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
  git:
    description: |
      The connected GitHub repository and the branch its deployments track.
      Omitted when the app has no repository connected (for example a
      Docker-based app).
    allOf:
      - "$ref": "./AppGit.yaml"
  docker:
    description: |
      The configured Docker image source. Present only for Docker image apps.
    allOf:
      - "$ref": "./AppDocker.yaml"
  currentDeploymentId:
    type: string
    description: |
      The identifier of the deployment currently serving this app.
      Omitted if the app has no active deployment yet.
    example: d_1234abcd
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
  isRolledBack:
    type: boolean
    description: |
      Whether the app is currently serving a rolled-back deployment rather than its latest one.
    example: false
  deleteProtection:
    type: boolean
    description: |
      Whether delete protection is enabled for this app.
      When true, the app cannot be deleted until protection is disabled.
    example: false
  createdAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the app was created.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the app was last updated.
      Omitted if the app has never been updated.
    example: 1704153600000
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
additionalProperties: false

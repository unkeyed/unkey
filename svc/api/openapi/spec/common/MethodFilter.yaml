type: object
additionalProperties: false
description: Filters by HTTP method.
properties:
  is:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      "$ref": "./HttpMethod.yaml"
    description: Keep rows with one of these methods.
  isNot:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      "$ref": "./HttpMethod.yaml"
    description: Remove rows with one of these methods.
example:
  is: ["POST", "PUT"]

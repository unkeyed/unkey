type: object
required:
  - id
  - name
  - createdAt
properties:
  id:
    type: string
    description: |
      The unique identifier of the namespace, generated by Unkey.
    example: rlns_1234abcd
  name:
    type: string
    description: |
      The name of the namespace, unique within your workspace.
      Pass it as `namespace` to `ratelimit.limit` and the override endpoints.
    example: api.requests
  createdAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the namespace was created.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the namespace was last updated.
      Omitted if the namespace has never been updated.
    example: 1704153600000
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
additionalProperties: false

type: object
description: |
  How the portal looks to your end users. Both fields are optional; a portal
  with neither set renders with default styling.
properties:
  logoUrl:
    type: string
    format: uri
    maxLength: 500
    description: |
      Absolute `https://` URL of the logo shown in the portal header.

      Loaded by your end users' browsers, so the host you name receives their IP
      and user agent on every page view.
    example: https://cdn.example.com/logo.svg
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
  primaryColor:
    type: string
    pattern: "^#[0-9a-fA-F]{6}$"
    description: |
      Six-digit hex colour used for primary actions and accents in the portal.
    example: "#6366f1"
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
additionalProperties: false

type: object
required:
  - reason
  - message
  - restartCount
properties:
  reason:
    "$ref": "./DeploymentExitReason.yaml"
  message:
    type: string
    description: |
      Human-readable explanation of the exit and what to do about it. The
      wording can change. For programmatic handling, use `reason` and
      `exitCode`.
    example: Your app used more memory than its limit and was stopped. Check its memory usage, or raise the limit.
  exitCode:
    type: integer
    format: int32
    description: |
      Exit code of the last recorded exit. Codes above 128 mean the process
      was killed by signal `exitCode - 128`, for example 137 for SIGKILL.
      Omitted when no exit was recorded.
    example: 137
  restartCount:
    type: integer
    format: int64
    minimum: 0
    description: |
      How many times the instance that reported this exit was restarted. This
      is not a total across the instances of the deployment.
    example: 4
  finishedAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds of the last recorded exit. The exit stays
      reported after the instance recovers. Omitted when no exit was recorded.
    example: 1704067260000
additionalProperties: false

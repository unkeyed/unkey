type: object
properties:
  requestHeaders:
    type: boolean
    default: false
    description: |-
      Capture request headers, plus the query string, query parameters,
      user agent, and client IP. Query data is grouped with request
      headers because URLs routinely carry secrets; user agent and client
      IP are grouped here because they identify the client.
  responseHeaders:
    type: boolean
    default: false
    description: Capture response headers.
  requestBody:
    type: boolean
    default: false
    description: Capture the request body, capped at the body-capture limit.
  responseBody:
    type: boolean
    default: false
    description: Capture the response body, capped at the body-capture limit.
additionalProperties: false
description: |-
  Opts matching requests into capturing sensitive request data in the
  request log. The gateway always records a base log entry for every
  request (method, host, path, status, latency) — that cannot be turned
  off. This policy adds headers and bodies on top,
  each direction as a separate opt-in, scoped via the policy's `match`
  expressions. A policy without `match` expressions matches every request.
  Authorization headers and configured key locations are always redacted
  before storage.
example:
  requestHeaders: true
  responseHeaders: true
  requestBody: true
  responseBody: true

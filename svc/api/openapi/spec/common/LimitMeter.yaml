type: object
description: A workspace limit and the current usage against it.
required:
  - limit
  - used
properties:
  limit:
    type: integer
    format: int64
    description: The maximum the workspace can use.
    example: 5
  used:
    type: integer
    format: int64
    description: The amount the workspace uses now.
    example: 1
additionalProperties: false

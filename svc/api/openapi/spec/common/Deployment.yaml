type: object
required:
  - id
  - status
  - isCurrent
  - environment
  - app
  - project
  - availableActions
  - regions
  - runtime
  - createdAt
properties:
  id:
    type: string
    description: |
      The unique identifier of the deployment, generated by Unkey.
    example: d_1234abcd
  status:
    "$ref": "./DeploymentStatus.yaml"
  isCurrent:
    type: boolean
    description: |
      True when the deployment's app currently routes traffic to it. A deployment
      can be `ready` without being current, for example one that was superseded or
      not yet promoted.
    example: true
  environment:
    type: string
    description: Slug of the environment this deployment belongs to.
    example: production
  app:
    type: string
    description: Slug of the app this deployment belongs to.
    example: payments-api
  project:
    type: string
    description: Slug of the project this deployment belongs to.
    example: acme
  git:
    "$ref": "./DeploymentGit.yaml"
    description: |
      Present for git-sourced deployments. Mutually exclusive with `docker`.
  docker:
    "$ref": "./DeploymentDocker.yaml"
    description: |
      Present for image-sourced deployments. Mutually exclusive with `git`.
  availableActions:
    type: array
    items:
      "$ref": "./DeploymentAction.yaml"
    description: |
      Lifecycle operations that are legal to call on this deployment right now.
      Empty when none apply (e.g. while building or in a terminal state).
    example: ["stop"]
  regions:
    type: array
    items:
      type: string
    description: |
      Regions this deployment is configured to run in. Empty while the deployment
      has no scheduled regions yet.
    example: ["us-east-1", "eu-west-1"]
  error:
    "$ref": "./DeploymentError.yaml"
    description: |
      Why the deployment failed. Present only when `status` is `failed`, and only
      returned by getDeployment.
  domains:
    type: array
    items:
      type: string
    description: |
      Frontline hostnames this deployment is reachable at. Only returned by
      getDeployment.
    example: ["kebap-app.unkey.app"]
  runtime:
    "$ref": "./DeploymentRuntime.yaml"
  createdAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the deployment was created.
    example: 1704067200000
  updatedAt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds when the deployment was last updated.
      Omitted if the deployment has never been updated.
    example: 1704153600000
    x-go-type-skip-optional-pointer: true
    x-go-type-skip-optional-pointer-with-omitzero: true
additionalProperties: false

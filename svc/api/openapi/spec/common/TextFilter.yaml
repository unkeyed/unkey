type: object
additionalProperties: false
description: |
  Filters a text field. Every operator is exact and case-sensitive. `%` and `_` match only themselves.
  The positive operators (`is`, `contains`, `startsWith`, `endsWith`) are combined with OR.
  The negated operators (`isNot`, `notContains`) are combined with AND.
properties:
  is:
    "$ref": "./StringValues.yaml"
    description: Keep rows where the field equals one of the values.
  isNot:
    "$ref": "./StringValues.yaml"
    description: Remove rows where the field equals one of the values.
  contains:
    "$ref": "./StringValues.yaml"
    description: Keep rows where the field contains one of the values.
  notContains:
    "$ref": "./StringValues.yaml"
    description: Remove rows where the field contains one of the values.
  startsWith:
    "$ref": "./StringValues.yaml"
    description: Keep rows where the field starts with one of the values.
  endsWith:
    "$ref": "./StringValues.yaml"
    description: Keep rows where the field ends with one of the values.
example:
  startsWith: ["/v2/keys."]
  notContains: ["verifyKey"]

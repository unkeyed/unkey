type: object
required:
  - type
  - message
properties:
  type:
    "$ref": "./DeploymentIssueType.yaml"
  time:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Unix timestamp in milliseconds of the last occurrence. For `crash_loop`,
      this is the time of the last exit. Omitted when unknown.
    example: 1704067260000
  message:
    type: string
    description: |
      Human-readable explanation of the issue and what to do about it. The
      wording can change. For programmatic handling, use `type` and `meta`.
    example: Your app used more memory than its limit and keeps stopping, so Unkey waits longer before each restart. Check its memory usage, or raise the limit.
  meta:
    "$ref": "./DeploymentIssueMeta.yaml"
additionalProperties: false

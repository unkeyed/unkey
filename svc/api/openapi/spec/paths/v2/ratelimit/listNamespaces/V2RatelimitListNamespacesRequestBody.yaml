type: object
properties:
  limit:
    type: integer
    description: |
      Maximum number of namespaces to return per request.
      Omit this field to receive up to 100 namespaces.
    default: 100
    minimum: 1
    maximum: 100
  cursor:
    type: string
    minLength: 1
    maxLength: 1024
    description: |
      Pagination cursor from a previous response to fetch the next page.
      Use when `hasMore: true` in the previous response. Omit this field to start from the first page.
    example: rlns_1234abcd
  search:
    type: string
    maxLength: 256
    description: |
      Free-form text to filter namespaces. Returns namespaces whose ID or name contains the search string. Matching is case-insensitive.
      Omit this field to list every namespace.
    example: api
additionalProperties: false
examples:
  basic:
    summary: List all namespaces
    description: List the first page of namespaces in your workspace
    value: {}
  paginated:
    summary: Continue from a cursor
    description: Fetch a smaller page and continue from the cursor of the previous response
    value:
      limit: 20
      cursor: rlns_1234abcd
  search:
    summary: Search namespaces
    description: List namespaces whose ID or name contains the search string
    value:
      search: api

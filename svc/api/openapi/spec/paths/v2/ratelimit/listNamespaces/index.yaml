post:
  tags:
    - ratelimit
  summary: List ratelimit namespaces
  description: |
    Retrieve a paginated list of the rate limit namespaces in your workspace.

    Use this to find the namespaces your services rate limit against, for example to build an admin view or to look up a namespace ID. Results are ordered newest first and returned in pages. When `hasMore` is true, pass the returned `cursor` to fetch the next page.

    Deleted namespaces are not returned. The list contains only the namespaces your root key can read.

    **Required Permissions**

    Your root key must have one of the following permissions:
    - `unkey:v1:<workspace_id>:projects/*/ratelimits/namespaces/*#read` (to read every namespace)
    - `unkey:v1:<workspace_id>:projects/<project_id>/ratelimits/namespaces/<namespace_id>#read` (to read a specific namespace)
  operationId: ratelimit.listNamespaces
  x-speakeasy-name-override: listNamespaces
  x-unkey-idempotency: idempotent
  security:
    - bearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "./V2RatelimitListNamespacesRequestBody.yaml"
        examples:
          basic:
            summary: List all namespaces
            description: List the first page of namespaces in your workspace
            value: {}
          paginated:
            summary: Continue from a cursor
            description: Fetch a smaller page and continue from the cursor of the previous response
            value:
              limit: 20
              cursor: rlns_1234abcd
          search:
            summary: Search namespaces
            description: List namespaces whose ID or name contains the search string
            value:
              search: api
  responses:
    "200":
      description: |
        Successfully retrieved a page of namespaces. Use the pagination cursor for additional results when `hasMore: true`.
      content:
        application/json:
          schema:
            "$ref": "./V2RatelimitListNamespacesResponseBody.yaml"
          examples:
            namespaceList:
              summary: Namespace list
              description: The last page of namespaces in a workspace
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  - id: rlns_5678efgh
                    name: email.sends
                    createdAt: 1704240000000
                  - id: rlns_1234abcd
                    name: api.requests
                    createdAt: 1704067200000
                    updatedAt: 1704153600000
                pagination:
                  hasMore: false
            morePages:
              summary: More namespaces available
              description: A page with a cursor for the next page
              value:
                meta:
                  requestId: req_5678efgh
                data:
                  - id: rlns_5678efgh
                    name: email.sends
                    createdAt: 1704240000000
                pagination:
                  cursor: rlns_1234abcd
                  hasMore: true
            empty:
              summary: No namespaces
              description: The workspace has no namespaces your root key can read
              value:
                meta:
                  requestId: req_9876zyxw
                data: []
                pagination:
                  hasMore: false
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
          examples:
            invalidLimit:
              summary: Invalid limit
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Bad Request
                  detail: One or more fields failed validation
                  status: 400
                  type: https://unkey.com/docs/errors/unkey/application/invalid_input
                  errors:
                    - location: body.limit
                      message: must be less than or equal to 100
                      fix: Use a limit between 1 and 100
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "403":
      description: Forbidden - Insufficient permissions (requires a namespace `#read` grant)
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
          examples:
            missingPermission:
              summary: No namespace read permission
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Insufficient Permissions
                  detail: "Missing permission: 'unkey:v1:ws_1234abcd:projects/*/ratelimits/namespaces/*#read'"
                  status: 403
                  type: https://unkey.com/docs/errors/unkey/authorization/insufficient_permissions
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"
  x-speakeasy-pagination:
    type: cursor
    inputs:
      - name: cursor
        in: requestBody
        type: cursor
    outputs:
      nextCursor: "$.pagination.cursor"

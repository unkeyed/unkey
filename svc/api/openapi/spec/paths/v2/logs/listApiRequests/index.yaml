post:
  tags:
    - logs
  summary: List API requests
  description: |
    List the requests that the Unkey API served for your workspace, newest first.

    Filter by time, path, host, method, request ID, and status. In one field, values under `is`, `contains`, `startsWith`, and `endsWith` are combined with OR. Values under `isNot` and `notContains`, and the range operators `gt`, `gte`, `lt`, and `lte`, are combined with AND. Different fields are combined with AND. Every text match is exact and case-sensitive.

    To get the next page, send the `pagination.cursor` of the previous page together with the same `filters`.

    Unkey returns only requests inside the log retention of your workspace. The calls to this endpoint are not logged.

    **Required Permissions**

    Your root key must have the following permission:
    - `unkey:v1:<workspace_id>:logs/requests#read`
  operationId: logs.listApiRequests
  x-speakeasy-name-override: listApiRequests
  x-unkey-idempotency: idempotent
  security:
    - bearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "./V2LogsListApiRequestsRequestBody.yaml"
  responses:
    "200":
      description: A page of requests, newest first. When `hasMore` is true, send `pagination.cursor` to get the next page.
      content:
        application/json:
          schema:
            "$ref": "./V2LogsListApiRequestsResponseBody.yaml"
          examples:
            page:
              summary: A page with more results
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  - requestId: req_5678efgh
                    time: 1792021850123
                    host: api.unkey.com
                    method: POST
                    path: /v2/keys.updateKey
                    status: 404
                    latencyMs: 38
                    error: ""
                    requestHeaders: [
                      "Content-Type: application/json",
                      "Authorization: [REDACTED]",
                    ]
                    requestBody: '{"keyId":"key_1234abcd","name":"Payments"}'
                    responseHeaders: ["Content-Type: application/json"]
                    responseBody: '{"meta":{"requestId":"req_5678efgh"},"error":{"status":404}}'
                pagination:
                  cursor: eyJ0IjoxNzkyMDIxODUwMTIzLCJyIjoicmVxXzU2NzhlZmdoIn0
                  hasMore: true
            empty:
              summary: No matching requests
              value:
                meta:
                  requestId: req_1234abcd
                data: []
                pagination:
                  hasMore: false
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
          examples:
            invalidCursor:
              summary: Invalid cursor
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Bad Request
                  detail: The cursor is not valid. Send the `pagination.cursor` of the previous response, or omit it to get the first page.
                  status: 400
                  type: https://unkey.com/docs/errors/unkey/application/invalid_input
                  errors: []
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "403":
      description: Forbidden - Insufficient permissions (requires `unkey:v1:<workspace_id>:logs/requests#read`)
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
          examples:
            missingPermission:
              summary: Missing required permission
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Insufficient Permissions
                  detail: "Missing permission: 'unkey:v1:ws_1234abcd:logs/requests#read'"
                  status: 403
                  type: https://unkey.com/docs/errors/unkey/authorization/insufficient_permissions
    "422":
      description: The query exceeds a query limit
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnprocessableEntityErrorResponse.yaml"
          examples:
            resultTooLarge:
              summary: Result too large
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Unprocessable Entity
                  detail: The query exceeds a read limit. Send a lower `limit`, a narrower `filters.time` window, or more filters, then try again.
                  status: 422
                  type: https://unkey.com/docs/errors/user/unprocessable_entity/query_memory_limit_exceeded
    "429":
      description: The workspace rate limit is exceeded
      content:
        application/json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
          examples:
            workspaceRateLimited:
              summary: Workspace rate limit exceeded
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Too Many Requests
                  detail: This workspace has exceeded its API rate limit of 1000/1m0s. Please try again later.
                  status: 429
                  type: https://unkey.com/docs/errors/user/too_many_requests/workspace_rate_limited
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"
    "503":
      description: The log store is not available
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ServiceUnavailableErrorResponse.yaml"
  x-speakeasy-pagination:
    type: cursor
    inputs:
      - name: cursor
        in: requestBody
        type: cursor
    outputs:
      nextCursor: "$.pagination.cursor"

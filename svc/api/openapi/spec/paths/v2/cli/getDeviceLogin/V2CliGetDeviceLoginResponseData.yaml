type: object
required:
  - userCode
  - status
  - createdAt
  - expiresAt
properties:
  userCode:
    type: string
  deviceName:
    type: string
    description: Label sent by the CLI. The requester chooses it, so do not trust it.
  requesterIp:
    type: string
    description: IP address that started the login. Empty when the API could not determine it.
  requesterUserAgent:
    type: string
    description: User agent of the client that started the login.
  workspaceId:
    type: string
    description: Workspace selected at approval. Empty until the login is approved.
  status:
    type: string
    description: pending, approved, consumed, denied, or expired.
  grantablePermissions:
    type: array
    description: Permissions the signed-in member's role allows. The approval page starts with all of them selected.
    items:
      type: string
  createdAt:
    type: integer
    format: int64
    description: Unix millisecond time the login was started.
  expiresAt:
    type: integer
    format: int64
    description: Unix millisecond expiry.
  oauthClientId:
    type: string
    description: |
      Client ID metadata document URL of the OAuth client that started the login. Present only for OAuth logins.
      deviceName then holds the client's self-reported name, so show this URL's host next to it unless oauthClientFirstParty is true.
  oauthClientFirstParty:
    type: boolean
    description: |
      True when the OAuth client is Unkey's hosted MCP server. deviceName is then Unkey's own name for it, so do not show the client's host. Present only when oauthClientId is.

type: object
required:
  - userCode
  - status
  - createdAt
  - expiresAt
  - delivery
properties:
  userCode:
    type: string
  delivery:
    type: string
    enum:
      - device
      - redirect
    description: |
      How an approved login reaches its holder. `device`: the Unkey CLI polls for it.
      `redirect`: an OAuth app asked for access, and the decision sends the browser to `client.redirectUri`.
  client:
    $ref: ./V2CliGetDeviceLoginClient.yaml
  deviceName:
    type: string
    description: Label sent by the CLI, or the OAuth app's registered name. The requester chooses it, so do not trust it.
  requesterIp:
    type: string
    description: IP address that started the login. Empty when the API could not determine it.
  requesterUserAgent:
    type: string
    description: User agent of the client that started the login.
  workspaceId:
    type: string
    description: Workspace selected at approval. Empty until the login is approved.
  status:
    type: string
    description: pending, approved, consumed, denied, or expired.
  grantablePermissions:
    type: array
    description: Permissions the signed-in member's role allows. The approval page starts with all of them selected.
    items:
      type: string
  createdAt:
    type: integer
    format: int64
    description: Unix millisecond time the login was started.
  expiresAt:
    type: integer
    format: int64
    description: Unix millisecond expiry.

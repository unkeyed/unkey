type: object
additionalProperties: false
required:
  - userCode
  - decision
properties:
  userCode:
    type: string
    minLength: 4
    maxLength: 32
    x-unkey-redact: true
    description: Code shown in the terminal.
  decision:
    type: string
    enum:
      - approve
      - deny
  permissions:
    type: array
    minItems: 1
    maxItems: 1000
    x-unkey-redact: true
    description: Permissions to grant. Each permission must be within the caller's role.
    items:
      type: string
      minLength: 1
      maxLength: 512
oneOf:
  - properties:
      decision:
        type: string
        enum: [approve]
    required: [permissions]
  - properties:
      userCode:
        type: string
      decision:
        type: string
        enum: [deny]
    additionalProperties: false

type: object
additionalProperties: false
required:
  - userCode
  - permissions
properties:
  userCode:
    type: string
    minLength: 4
    maxLength: 32
    x-unkey-redact: true
    description: Code shown in the terminal.
  permissions:
    type: array
    minItems: 1
    maxItems: 1000
    x-unkey-redact: true
    description: Permissions to grant. Each permission must be within the caller's role.
    items:
      type: string
      minLength: 1
      maxLength: 512

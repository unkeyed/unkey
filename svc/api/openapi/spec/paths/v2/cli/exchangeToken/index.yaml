post:
  x-speakeasy-ignore: true
  tags:
    - cli
  summary: Exchange a CLI credential
  description: |
    Supply exactly one of `loginId` or `refreshToken`. No authentication header is required.
    A `loginId` polls a device login started by cli.startDeviceLogin. While the user has not approved it,
    the status is `permissions_required`. Approval returns access and refresh tokens exactly once.
    Device polling is rate limited per IP address.
    A `refreshToken` rotates an existing session and returns `complete` with new tokens.
    The user's current membership and permissions are checked again. Reuse of the previous token
    after the retry grace period revokes the session.
    Access tokens last 15 minutes. A session expires after 7 days without a refresh,
    and no later than 30 days after login.
  operationId: cli.exchangeToken
  x-speakeasy-name-override: exchangeToken
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ./V2CliExchangeTokenRequestBody.yaml
  responses:
    "200":
      description: Current login state. `complete` includes the access token and refresh token.
      content:
        application/json:
          schema:
            $ref: ./V2CliExchangeTokenResponseBody.yaml
    "400":
      description: Invalid credential selection or unknown login.
      content:
        application/json:
          schema:
            $ref: ../../../../error/BadRequestErrorResponse.yaml
    "401":
      description: The refresh token is invalid, expired, or reused outside the retry grace period.
      content:
        application/json:
          schema:
            $ref: ../../../../error/UnauthorizedErrorResponse.yaml
    "403":
      description: The user was removed or no longer has the session's permissions.
      content:
        application/json:
          schema:
            $ref: ../../../../error/ForbiddenErrorResponse.yaml
    "429":
      description: Too many requests from this IP address.
      content:
        application/json:
          schema:
            $ref: ../../../../error/TooManyRequestsErrorResponse.yaml
    "500":
      description: Internal server error, including when CLI login is not configured on this API.
      content:
        application/json:
          schema:
            $ref: ../../../../error/InternalServerErrorResponse.yaml

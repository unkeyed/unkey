type: object
required:
  - loginId
  - userCode
  - verificationUrl
  - expiresIn
  - interval
properties:
  loginId:
    type: string
    x-unkey-redact: true
    description: Secret credential used to poll for approval. Do not display it.
  userCode:
    type: string
    description: Code the user confirms in the browser.
  verificationUrl:
    type: string
    description: Dashboard page with the code filled in.
  expiresIn:
    type: integer
    format: int64
    description: Seconds until the login expires.
  interval:
    type: integer
    format: int64
    description: Seconds to wait between polls.

post:
  x-speakeasy-ignore: true
  tags:
    - cli
  summary: List CLI sessions
  description: |
    Lists CLI sessions in the caller's workspace. A member sees their own sessions. An admin sees every session.
    Requires a dashboard session or a CLI access token. Root keys are rejected.
  operationId: cli.listSessions
  x-speakeasy-name-override: listSessions
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ./V2CliListSessionsRequestBody.yaml
  responses:
    "200":
      description: Sessions the caller can see.
      content:
        application/json:
          schema:
            $ref: ./V2CliListSessionsResponseBody.yaml
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../../error/UnauthorizedErrorResponse.yaml
    "403":
      description: The caller is not a dashboard or CLI user.
      content:
        application/json:
          schema:
            $ref: ../../../../error/ForbiddenErrorResponse.yaml
    "500":
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: ../../../../error/InternalServerErrorResponse.yaml

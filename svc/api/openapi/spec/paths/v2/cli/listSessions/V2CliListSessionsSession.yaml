type: object
required:
  - id
  - userId
  - kind
  - permissions
  - createdAt
  - lastUsedAt
  - expiresAt
properties:
  id:
    type: string
  userId:
    type: string
  kind:
    $ref: ./V2CliSessionKind.yaml
  deviceName:
    type: string
    description: The CLI machine's hostname, or the OAuth client's self-reported name for mcp sessions.
  oauthClientId:
    type: string
    description: |
      Client ID metadata document URL of the OAuth client that holds the session. Present only for mcp sessions.
      deviceName then holds the client's self-reported name, so show this URL's host next to it.
  permissions:
    type: array
    items:
      type: string
  createdAt:
    type: integer
    format: int64
  lastUsedAt:
    type: integer
    format: int64
  expiresAt:
    type: integer
    format: int64
    description: Unix millisecond time the session expires. Each refresh moves it to 7 days later, but never past 30 days after createdAt.
  revokedAt:
    type: integer
    format: int64
    description: Unix millisecond time the session was revoked. Omitted when the session is still active.

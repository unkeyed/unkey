type: object
required:
  - id
  - userId
  - kind
  - permissions
  - createdAt
  - lastUsedAt
  - expiresAt
properties:
  id:
    type: string
  userId:
    type: string
  kind:
    $ref: ./V2CliSessionKind.yaml
  deviceName:
    type: string
    description: The CLI machine's name, or the MCP client's self-reported name.
  permissions:
    type: array
    items:
      type: string
  createdAt:
    type: integer
    format: int64
  lastUsedAt:
    type: integer
    format: int64
  expiresAt:
    type: integer
    format: int64
    description: Unix millisecond time the session expires. Each refresh moves it to 7 days later, but never past 30 days after createdAt.
  revokedAt:
    type: integer
    format: int64
    description: Unix millisecond time the session was revoked. Omitted when the session is still active.

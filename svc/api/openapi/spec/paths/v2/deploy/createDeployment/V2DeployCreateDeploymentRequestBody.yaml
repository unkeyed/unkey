type: object
required:
  - project
  - app
  - branch
  - environmentSlug
  - dockerImage
properties:
  project:
    type: string
    minLength: 1
    description: Project slug
    example: "my-project"
  app:
    type: string
    minLength: 1
    description: App slug within the project
    example: "default"
  keyspaceId:
    type: string
    description: Optional keyspace ID for authentication context
    example: "key_abc123"
  branch:
    type: string
    minLength: 1
    description: Git branch name
    example: "main"
  environmentSlug:
    type: string
    minLength: 1
    description: Environment slug (e.g., "production", "staging")
    example: "production"
  dockerImage:
    type: string
    minLength: 1
    maxLength: 256
    description: >-
      Full image reference to deploy. Qualify the version with a tag
      (ghcr.io/user/app:v1.0.0) or with a digest
      (ghcr.io/user/app@sha256:...). Without either, the registry serves the
      latest tag.
    example: "ghcr.io/user/app:v1.0.0"
  gitCommit:
    $ref: "./V2DeployGitCommit.yaml"
description: Create a deployment from a pre-built Docker image

post:
  tags: [logdrains]
  summary: Get log drain
  description: |
    Read a log drain in your workspace. Credential values are never returned.
    Requires `unkey:v1:{workspaceId}:logdrains/{logdrainId}#read`.
  operationId: logdrains.getLogdrain
  x-speakeasy-name-override: getLogdrain
  security:
    - bearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../LogdrainIdRequest.yaml
  responses:
    "200":
      description: Log drain configuration without credentials.
      content:
        application/json:
          schema:
            $ref: ../LogdrainResponse.yaml
    "400":
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: ../../../../error/BadRequestErrorResponse.yaml
    "401":
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../error/UnauthorizedErrorResponse.yaml
    "403":
      description: Insufficient permission.
      content:
        application/json:
          schema:
            $ref: ../../../../error/ForbiddenErrorResponse.yaml
    "404":
      description: No log drain with this ID exists in the authorized workspace.
      content:
        application/json:
          schema:
            $ref: ../../../../error/NotFoundErrorResponse.yaml
    "500":
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: ../../../../error/InternalServerErrorResponse.yaml

type: object
required:
  - name
  - stream
  - destination
additionalProperties: false
properties:
  name:
    type: string
    description: A human-readable name to identify this log drain.
    minLength: 1
    maxLength: 128
  stream:
    type: object
    additionalProperties: false
    minProperties: 1
    maxProperties: 1
    description: |
      Select exactly one stream. Empty filter arrays select all values.
      Nonempty filter dimensions are combined with AND.
    properties:
      auditLogs:
        type: object
        additionalProperties: false
        properties:
          eventTypes:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
      keyVerifications:
        type: object
        additionalProperties: false
        properties:
          outcomes:
            type: array
            maxItems: 256
            items:
              type: string
              x-go-type: string
              enum:
                - VALID
                - INSUFFICIENT_PERMISSIONS
                - RATE_LIMITED
                - FORBIDDEN
                - DISABLED
                - EXPIRED
                - USAGE_EXCEEDED
                - ""
          keySpaceIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
      ratelimits:
        type: object
        additionalProperties: false
        properties:
          namespaceIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
          passed:
            type: array
            maxItems: 2
            items:
              type: boolean
      gatewayRequests:
        type: object
        additionalProperties: false
        properties:
          statusClasses:
            type: array
            maxItems: 4
            items:
              type: integer
              x-go-type: LogdrainFiltersStatusClasses
              enum:
                - 2
                - 3
                - 4
                - 5
          projectIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
          appIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
          environmentIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
      runtimeLogs:
        type: object
        additionalProperties: false
        properties:
          severities:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
          projectIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
          appIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
          environmentIds:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 256
  batchSize:
    type: integer
    format: int64
    minimum: 1
    maximum: 4294967295
  destination:
    $ref: LogdrainDestinationWrite.yaml
    properties:
      http:
        required:
          - url
      axiom:
        required:
          - dataset
          - token

type: object
additionalProperties: false
minProperties: 1
properties:
  url: { type: string, format: uri, minLength: 1 }
  format: { type: string, enum: [json, ndjson] }
  headers:
    type: array
    maxItems: 32
    description: |
      The complete desired header set. Omit to preserve all headers, or send an
      empty array to remove all headers. Preserve is valid only for existing headers.
    items:
      $ref: LogdrainHeaderWrite.yaml

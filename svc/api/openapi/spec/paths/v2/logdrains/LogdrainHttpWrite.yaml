type: object
additionalProperties: false
minProperties: 1
properties:
  url: { type: string, format: uri, minLength: 1 }
  format: { type: string, enum: [json, ndjson] }
  headers:
    type: array
    maxItems: 32
    description: |
      Headers sent to the destination. Values are encrypted at rest.
      Updates replace the header list when supplied. Use preserve to retain an
      existing value without reading it. Omit headers to retain the entire list.
    items:
      $ref: LogdrainHeaderWrite.yaml

type: object
additionalProperties: false
required:
  - keyId
minProperties: 2
properties:
  ipAllowlist:
    type: array
    maxItems: 100
    description: Replacement IPv4 or IPv6 addresses and CIDR ranges. Omit to keep the current list. Use an empty list for unrestricted access. A restricted root-key caller can expand the target's list only within the caller's allowed networks and cannot send an empty list.
    items:
      type: string
      minLength: 1
      maxLength: 49
  keyId:
    type: string
    minLength: 3
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: Root key identifier returned by rootKeys.createKey or rootKeys.listKeys.
  name:
    type: [string, "null"]
    minLength: 1
    maxLength: 255
    description: New root key name. Set null to remove the name. Omit to keep the current name.
  enabled:
    type: boolean
    description: Whether the root key can authenticate. Omit to keep the current state.
  permissions:
    type: array
    minItems: 0
    maxItems: 1000
    description: |
      Complete replacement permission set. Every permission must be a supported URN in the authenticated workspace
      and within the caller's permissions. Omit to keep the current permissions.
    items:
      type: string
      minLength: 1
      maxLength: 512

post:
  tags:
    - rootKeys
  summary: Delete root key
  description: |
    Deletes a root key in the authenticated workspace.
    Requires `unkey:v1:<workspace_id>:rootKeys/<key_id>#delete`.
    Use `rootKeys/*#delete` to delete any root key in the workspace.
    Deleted keys cannot authenticate.
  operationId: rootKeys.deleteKey
  x-speakeasy-name-override: deleteKey
  security:
    - bearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ./V2RootKeysDeleteKeyRequestBody.yaml
  responses:
    "200":
      description: Root key deleted.
      content:
        application/json:
          schema:
            $ref: ./V2RootKeysDeleteKeyResponseBody.yaml
    "400":
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: ../../../../error/BadRequestErrorResponse.yaml
    "401":
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: ../../../../error/UnauthorizedErrorResponse.yaml
    "403":
      description: The caller cannot delete this root key.
      content:
        application/json:
          schema:
            $ref: ../../../../error/ForbiddenErrorResponse.yaml
    "404":
      description: The root key was not found.
      content:
        application/json:
          schema:
            $ref: ../../../../error/NotFoundErrorResponse.yaml
    "429":
      description: Too many requests.
      content:
        application/problem+json:
          schema:
            $ref: ../../../../error/TooManyRequestsErrorResponse.yaml
    "500":
      description: The root key could not be deleted.
      content:
        application/json:
          schema:
            $ref: ../../../../error/InternalServerErrorResponse.yaml

type: object
additionalProperties: false
required:
  - permissions
properties:
  ipAllowlist:
    type: array
    maxItems: 100
    description: IPv4 or IPv6 addresses and CIDR ranges allowed to use this root key. Omit or use an empty list for unrestricted access. A restricted root-key caller must provide a list within its own allowed networks.
    items:
      type: string
      minLength: 1
      maxLength: 49
  name:
    type: string
    maxLength: 255
    description: Optional name for the root key.
  permissions:
    type: array
    minItems: 0
    maxItems: 1000
    description: Permissions to grant to the root key. Each permission must be within the caller's existing permissions.
    items:
      type: string
      minLength: 1
      maxLength: 512
  expires:
    type: [integer, "null"]
    format: int64
    description: Expiration as Unix milliseconds, strictly in the future. Expiring root-key callers must provide a child expiry no later than their own. JWT admins and nonexpiring root-key callers may omit it or set null for no expiration.

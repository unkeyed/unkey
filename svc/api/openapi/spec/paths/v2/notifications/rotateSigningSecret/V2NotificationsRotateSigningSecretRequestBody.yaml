type: object
additionalProperties: false
required: [destinationId, signingSecret]
properties:
  destinationId:
    type: string
    minLength: 1
  signingSecret:
    type: string
    minLength: 32
    maxLength: 512
    writeOnly: true
    x-unkey-redact: true
    description: Replacement write-only webhook signing secret, at most 512 UTF-8 bytes. Retrying the same value is safe.

post:
  tags: [notifications]
  summary: List notification destinations
  description: Lists redacted destinations in the authenticated workspace. Requires unkey:v1:{workspaceId}:notifications#read. Shared notification management is restricted to workspace admins by default.
  operationId: notifications.listDestinations
  x-speakeasy-name-override: listDestinations
  security: [{ bearer: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../../../../common/NotificationListRequest.yaml }
  responses:
    "200":
      description: Redacted destinations.
      content:
        application/json:
          schema: { $ref: ./V2NotificationsListDestinationsResponseBody.yaml }
    "400": {
      description: Invalid request,
      content: {
        application/json: {
          schema: { $ref: ../../../../error/BadRequestErrorResponse.yaml },
        },
      },
    }
    "401": {
      description: Unauthorized,
      content: {
        application/json: {
          schema: { $ref: ../../../../error/UnauthorizedErrorResponse.yaml },
        },
      },
    }
    "403": {
      description: Insufficient notification permissions,
      content: {
        application/json: {
          schema: { $ref: ../../../../error/ForbiddenErrorResponse.yaml },
        },
      },
    }
    "500": {
      description: Internal server error,
      content: {
        application/json: {
          schema: { $ref: ../../../../error/InternalServerErrorResponse.yaml },
        },
      },
    }
  x-speakeasy-pagination:
    type: cursor
    inputs: [{ name: cursor, in: requestBody, type: cursor }]
    outputs: { nextCursor: "$.pagination.nextCursor" }

type: object
additionalProperties: false
required: [destinationId, idempotencyKey]
properties:
  destinationId:
    type: string
    minLength: 1
  idempotencyKey:
    $ref: ../../../../common/NotificationIdempotencyKey.yaml
    description: Contains 1 to 128 UTF-8 bytes, without leading or trailing whitespace or NUL characters. The server enforces the byte limit. Reusing this key for the same workspace and destination returns the same durable test delivery. Use a fresh key to send a new test.

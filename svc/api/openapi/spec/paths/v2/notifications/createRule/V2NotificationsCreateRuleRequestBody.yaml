type: object
additionalProperties: false
required: [name, notificationType, enabled, targets, idempotencyKey]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 128
  notificationType:
    type: string
    minLength: 1
    description: Supported event type from notifications.getCatalog. Unsupported types are rejected at runtime.
  projectId:
    type: string
    minLength: 1
    description: Omit all scope IDs for a workspace-wide rule.
  appId:
    type: string
    minLength: 1
    description: Requires projectId and must belong to that project.
  environmentId:
    type: string
    minLength: 1
    description: Requires appId and must belong to that app.
  enabled:
    type: boolean
  targets:
    type: array
    minItems: 1
    maxItems: 100
    items:
      $ref: ../../../../common/NotificationTarget.yaml
  idempotencyKey:
    $ref: ../../../../common/NotificationIdempotencyKey.yaml

type: object
required:
  - project
  - name
  - slug
properties:
  project:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  name:
    type: string
    minLength: 1
    maxLength: 256
    description: Human-readable name for this app.
    example: Payments API
  slug:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  git:
    "$ref": "../../../../common/AppGitCreateInput.yaml"
  oci:
    "$ref": "../../../../common/AppOCI.yaml"
additionalProperties: false
oneOf:
  - required:
      - git
  - required:
      - oci
description: |
  Create an app with exactly one source: `git` or `oci`. Requests that omit a
  source or provide both sources are rejected.
examples:
  byProjectSlug:
    summary: Create within a project by slug
    description: Create an app, locating the parent project by its slug
    value:
      project: payments
      name: Payments API
      slug: payments-api
      oci:
        image: ghcr.io/acme/payments:v1.2.3
  byProjectId:
    summary: Create within a project by ID
    description: Create an app, locating the parent project by its ID
    value:
      project: proj_1234abcd
      name: Payments API
      slug: payments-api
      oci:
        image: ghcr.io/acme/payments:v1.2.3
  connectRepo:
    summary: Create and connect a GitHub repository
    description: Create an app and connect it to a GitHub repository in one request. The workspace must have the Unkey GitHub App installed with access to the repository.
    value:
      project: payments
      name: Payments API
      slug: payments-api
      git:
        repository: unkeyed/unkey
  selectRepoLater:
    summary: Create a Git app before connecting a repository
    description: Create a Git-sourced app and connect its GitHub repository later.
    value:
      project: payments
      name: Payments API
      slug: payments-api
      git: {}
  ociImage:
    summary: Create from an OCI image
    description: Create an OCI-sourced app with a default image reference.
    value:
      project: payments
      name: Payments API
      slug: payments-api
      oci:
        image: ghcr.io/acme/payments:v1.2.3

type: object
required:
  - project
  - name
  - slug
properties:
  project:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  name:
    type: string
    minLength: 1
    maxLength: 256
    description: |
      Human-readable name for this app.
      Use a descriptive name like 'Payments API' to identify its purpose.
    example: Payments API
  slug:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  git:
    "$ref": "../../../../common/AppGitCreateInput.yaml"
  docker:
    "$ref": "../../../../common/AppDockerInput.yaml"
additionalProperties: false
not:
  required: [git, docker]
description: |
  Create an app with an optional GitHub or Docker image source. Provide at most
  one of `git` or `docker`. Omit both only for compatibility with source-less apps.
examples:
  byProjectSlug:
    summary: Create within a project by slug
    description: Create an app, locating the parent project by its slug
    value:
      project: payments
      name: Payments API
      slug: payments-api
  byProjectId:
    summary: Create within a project by ID
    description: Create an app, locating the parent project by its ID
    value:
      project: proj_1234abcd
      name: Payments API
      slug: payments-api
  connectRepo:
    summary: Create and connect a GitHub repository
    description: Create an app and connect it to a GitHub repository in one request. The workspace must have the Unkey GitHub App installed with access to the repository.
    value:
      project: payments
      name: Payments API
      slug: payments-api
      git:
        repository: unkeyed/unkey
  dockerImage:
    summary: Create from a Docker image
    description: Create a Docker-sourced app with a default image reference.
    value:
      project: payments
      name: Payments API
      slug: payments-api
      docker:
        image: ghcr.io/acme/payments:v1.2.3

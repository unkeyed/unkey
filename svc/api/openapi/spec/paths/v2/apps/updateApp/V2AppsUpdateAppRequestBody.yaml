type: object
required:
  - project
  - app
properties:
  project:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  app:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  name:
    type: string
    minLength: 1
    maxLength: 256
    description: |
      New human-readable name for the app.
      Omit this field to leave the current name unchanged.
    example: Payments API
  slug:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  git:
    description: |
      Connect, reconfigure, or disconnect this app's GitHub repository.
      Omit to leave unchanged, set null to disconnect, or set an object with a
      "repository" to connect or replace it and/or a "defaultBranch" to set which
      branch it tracks. Fields are independent, so send only the one you change.
    anyOf:
      - "$ref": "../../../../common/AppGitInput.yaml"
      - type: "null"
  deleteProtection:
    type: boolean
    description: |
      Enable or disable delete protection for the app.
      Omit this field to leave the current setting unchanged.
    example: true
additionalProperties: false
examples:
  rename:
    summary: Rename an app by ID
    description: Update only the display name, locating the app by its ID
    value:
      project: payments
      app: app_1234abcd
      name: Payments API
  changeSlug:
    summary: Change an app slug by slug
    description: Locate the app by its current slug and assign a new one
    value:
      project: payments
      app: payments-service
      slug: payments-api
  protect:
    summary: Toggle delete protection
    description: Enable delete protection without changing the name
    value:
      project: payments
      app: app_1234abcd
      deleteProtection: true
  connectRepo:
    summary: Connect a GitHub repository
    description: Connect a repository and track a branch. Requires the Unkey GitHub App installed on the owner.
    value:
      project: payments
      app: app_1234abcd
      git:
        repository: unkeyed/unkey
        defaultBranch: main
  retargetBranch:
    summary: Change only the tracked branch
    description: Retarget the branch of the already-connected repository without re-specifying it
    value:
      project: payments
      app: app_1234abcd
      git:
        defaultBranch: develop
  disconnectRepo:
    summary: Disconnect the GitHub repository
    description: Remove the repository connection, leaving the app without a linked repo
    value:
      project: payments
      app: app_1234abcd
      git: null

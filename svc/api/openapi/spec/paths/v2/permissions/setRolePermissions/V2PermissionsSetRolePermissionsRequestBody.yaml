type: object
description: Provide exactly one of `role` or the deprecated `roleId`.
required:
  - permissions
properties:
  role:
    type: string
    minLength: 1
    maxLength: 128
    description: |
      The role whose directly assigned permissions will be replaced.
      IDs can identify a role in any project in your workspace. Names resolve in the default project.
  roleId:
    type: string
    minLength: 1
    maxLength: 128
    deprecated: true
    description: |
      Deprecated. Use `role` instead.
      IDs can identify a role in any project in your workspace. Names resolve in the default project.
  permissions:
    type: array
    description: The complete set of permission slugs to assign directly to the role. Missing permissions are created when authorized. An empty array clears all direct permissions.
    items:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[a-zA-Z0-9_:\-\.\*]+$
additionalProperties: false
oneOf:
  - required: [role]
  - required: [roleId]

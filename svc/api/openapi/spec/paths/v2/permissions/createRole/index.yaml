post:
  tags:
    - permissions
  summary: Create role
  description: |
    Create a new role to group related permissions for easier management. Roles enable consistent permission assignment across multiple API keys. Permission slugs supplied in `permissions` are attached during creation. Missing permissions are created automatically.

    **Important:** Role names must be unique within the default project. Once created, roles are immediately available for assignment.

    **Required Permissions**

    Your root key must always have:
    - `rbac.*.create_role`

    When `permissions` is not empty, it must also have:
    - `rbac.*.add_permission_to_role`

    When any requested permission slug does not exist, it must also have:
    - `rbac.*.create_permission`
  operationId: permissions.createRole
  x-speakeasy-name-override: CreateRole
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2PermissionsCreateRoleRequestBody.yaml"
        examples:
          basic:
            summary: Basic role creation
            value:
              name: content.editor
              description: Can read and write content
              permissions:
                - content.read
                - content.write
          withoutDescription:
            summary: Role without description
            value:
              name: api.reader
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            "$ref": "./V2PermissionsCreateRoleResponseBody.yaml"
      description: Role created successfully
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
    "409":
      description: Conflict - A role with this name already exists in the default project
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ConflictErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

type: object
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    # No character pattern: role names are human-readable labels today and the
    # dashboard lets users create names with spaces.
    #
    # 128 matches permissions.slug (varchar(128)) rather than the wider
    # roles.name column (varchar(512)), so this field does not have to narrow
    # later when roles start accepting slugs. Keep this value in step with the
    # other role endpoints and the dashboard role editor.
    maxLength: 128
    description: |
      The unique name for this role. Must be unique within the default project and clearly indicate the role's purpose. Use descriptive names like 'admin', 'editor', or 'Billing Manager'.

      Examples: 'admin.billing', 'support.readonly', 'developer.api', 'Billing Manager'
    example: "support.readonly"
  description:
    type: string
    maxLength: 512
    description: |
      Provides comprehensive documentation of what this role encompasses and what access it grants.
      Include information about the intended use case, what permissions should be assigned, and any important considerations.
      This internal documentation helps team members understand role boundaries and security implications.
      Not visible to end users - designed for administration teams and access control audits.

      Consider documenting:
      - The role's intended purpose and scope
      - What types of users should receive this role
      - What permissions are typically associated with it
      - Any security considerations or limitations
      - Related roles that might be used together
    example: "Provides read-only access for customer support representatives. Includes permissions to view user accounts, support tickets, and basic analytics. Does not include access to billing, admin functions, or data modification capabilities."
  permissions:
    type: array
    description: |
      Permission slugs to attach to the role. Existing permissions are reused. Missing permissions are created automatically when the root key has `rbac.*.create_permission`.

      Omit this field or provide an empty array to create the role without permissions.
    items:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[a-zA-Z0-9_:\-\.\*]+$
      description: Specify the permission by its slug.
additionalProperties: false
examples:
  adminRole:
    summary: Create admin role
    description: Create a role for administrative users
    value:
      name: admin
      description: Full administrative access to all resources
  editorRole:
    summary: Create editor role
    description: Create a role for content editors
    value:
      name: editor
      description: Can create and edit content but not manage users
      permissions:
        - content.read
        - content.write

type: object
required:
  - permission
properties:
  permission:
    type: string
    minLength: 1
    # Accepts a permission ID or slug. Matches the permissions.slug column
    # (varchar(128)). See createKey for the shared permission slug rule.
    maxLength: 128
    pattern: ^[a-zA-Z0-9_:\-\.\*]+$
    description: |
      The ID or slug of the permission to retrieve. It must refer to a permission that exists within your workspace.
    example: perm_1234567890abcdef
additionalProperties: false
examples:
  basic:
    summary: Retrieve permission details
    description: Get information about a specific permission
    value:
      permissionId: perm_1234567890abcdef

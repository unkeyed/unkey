type: object
required:
  - role
properties:
  role:
    type: string
    minLength: 1
    # Accepts a role ID or a role name. 128 matches permissions.slug
    # (varchar(128)) so this field does not have to narrow later when roles
    # start accepting slugs. See createKey for why no character pattern is
    # applied to role names.
    maxLength: 128
    description: |
      The role ID or name to retrieve. IDs can identify a role in any project in your workspace. Names resolve in the default project.

      Use this endpoint to verify role details, check its current permissions, or retrieve metadata.
      Returns complete role information including all assigned permissions for comprehensive access review.
    example: role_1234567890abcdef
additionalProperties: false

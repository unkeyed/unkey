type: object
required:
  - meta
  - data
properties:
  meta:
    "$ref": "../../../../common/Meta.yaml"
  data:
    "$ref": "../../../../common/Domain.yaml"
additionalProperties: false
examples:
  verified:
    summary: Domain serving traffic
    description: Verification passed through the routing record, so the TXT record was never consulted
    value:
      meta:
        requestId: req_1234abcd
      data:
        id: dom_1234abcd
        domain: api.acme.com
        projectId: proj_1234abcd
        appId: app_1234abcd
        environmentId: env_1234abcd
        status: verified
        dnsRecords:
          - type: CNAME
            name: api.acme.com
            value: a1b2c3d4e5f6g7h8.cname.unkey.com
            ttl: 60
            verified: true
            note: Create as DNS-only if your provider offers the choice.
          - type: TXT
            name: _unkey.api.acme.com
            value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
            ttl: 60
            verified: false
            note: Proves ownership. Create it alongside the routing record.
        createdAt: 1704067200000
        updatedAt: 1704067260000
  pending:
    summary: Domain created, not checked yet
    description: No DNS check has run, so neither record is verified and updatedAt is absent
    value:
      meta:
        requestId: req_1234abcd
      data:
        id: dom_1234abcd
        domain: api.acme.com
        projectId: proj_1234abcd
        appId: app_1234abcd
        environmentId: env_1234abcd
        status: pending
        dnsRecords:
          - type: CNAME
            name: api.acme.com
            value: a1b2c3d4e5f6g7h8.cname.unkey.com
            ttl: 60
            verified: false
            note: Create as DNS-only if your provider offers the choice.
          - type: TXT
            name: _unkey.api.acme.com
            value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
            ttl: 60
            verified: false
            note: Proves ownership. Create it alongside the routing record.
        createdAt: 1704067200000
  claimedButNotRouting:
    summary: Apex domain serving, routing record unreadable
    description: |
      The TXT record was published but the routing record was not, so the domain counts as verified
      while serving no traffic. Create the routing record from `dnsRecords` to fix it.
    value:
      meta:
        requestId: req_1234abcd
      data:
        id: dom_1234abcd
        domain: acme.com
        projectId: proj_1234abcd
        appId: app_1234abcd
        environmentId: env_1234abcd
        status: verified
        dnsRecords:
          - type: ALIAS
            name: acme.com
            value: a1b2c3d4e5f6g7h8.cname.unkey.com
            ttl: 60
            verified: false
            note: Apex domains cannot hold a CNAME. Use ALIAS, ANAME, or a flattened CNAME depending on your provider.
          - type: TXT
            name: _unkey.acme.com
            value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
            ttl: 60
            verified: true
            note: Proves ownership. An apex domain cannot be verified through its routing record, so this is the only proof available.
        createdAt: 1704067200000
        updatedAt: 1704067260000
  failed:
    summary: Verification timed out
    description: The records did not appear within 24 hours of creation
    value:
      meta:
        requestId: req_1234abcd
      data:
        id: dom_1234abcd
        domain: api.acme.com
        projectId: proj_1234abcd
        appId: app_1234abcd
        environmentId: env_1234abcd
        status: failed
        verificationError: domain verification timed out after 24 hours
        dnsRecords:
          - type: CNAME
            name: api.acme.com
            value: a1b2c3d4e5f6g7h8.cname.unkey.com
            ttl: 60
            verified: false
            note: Create as DNS-only if your provider offers the choice.
          - type: TXT
            name: _unkey.api.acme.com
            value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
            ttl: 60
            verified: false
            note: Proves ownership. Create it alongside the routing record.
        createdAt: 1704067200000
        updatedAt: 1704153600000

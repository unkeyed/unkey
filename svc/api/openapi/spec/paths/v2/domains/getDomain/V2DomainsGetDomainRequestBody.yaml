type: object
required:
  - domain
properties:
  domain:
    "$ref": "../../../../common/DomainIdentifier.yaml"
additionalProperties: false
examples:
  byName:
    summary: Retrieve by domain name
    description: The name is unique per workspace, so it addresses the domain on its own
    value:
      domain: api.acme.com
  byId:
    summary: Retrieve by domain ID
    description: Uses the id returned by domains.createDomain
    value:
      domain: dom_1234abcd

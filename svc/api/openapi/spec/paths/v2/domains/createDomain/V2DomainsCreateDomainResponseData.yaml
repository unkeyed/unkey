type: object
required:
  - domainId
  - targetCname
  - verificationToken
properties:
  domainId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: |
      The unique identifier of the newly created domain, generated by Unkey.
      Always begins with 'dom_' followed by a unique alphanumeric sequence.
    example: dom_1234abcd
  targetCname:
    type: string
    minLength: 1
    maxLength: 256
    description: |
      The CNAME target for this domain. Point a CNAME record for the requested domain at this value.
      The value is unique per domain and is the fastest path to verification.
    example: a1b2c3d4e5f6g7h8.cname.unkey.com
  verificationToken:
    type: string
    minLength: 1
    maxLength: 64
    description: |
      Ownership proof token. Publish it as a TXT record on '_unkey.<domain>' with the value
      'unkey-domain-verify=<verificationToken>'. Required when the CNAME record cannot be used, which is
      the case for apex domains and for any domain another workspace has already verified.
    example: 3ZQ8xK1mP7vT5nR2wY6bJ4hL
  domainConnectProvider:
    type: string
    maxLength: 256
    description: |
      Display name of the DNS provider the domain is delegated to, such as 'Cloudflare'. Discovered from
      the domain's nameservers, so it reflects where DNS is actually hosted rather than where the domain
      was registered. Omitted when the provider does not support Domain Connect or discovery failed.
    example: Cloudflare
  domainConnectUrl:
    type: string
    maxLength: 2048
    description: |
      Signed Domain Connect URL that pre-fills this domain's required DNS records at the provider. Open it
      in a browser and the domain owner approves the records in one step instead of entering them by hand.
      The URL is signed with an Unkey key, so it cannot be constructed or altered by the caller.

      Intended for a browser, not a script: after approval the provider sends the browser to this
      workspace's app settings page in the Unkey dashboard, so it suits a caller who administers this
      workspace. Anyone who does not have access to it approves the records successfully but lands on a
      page they cannot open. Approving is what writes the records; verification then proceeds on its own,
      so nothing depends on completing that return trip.

      Omitted whenever domainConnectProvider is omitted.
    example: https://dash.cloudflare.com/domainconnect/v2/domaintemplates/apply?domain=acme.com&host=api
additionalProperties: false

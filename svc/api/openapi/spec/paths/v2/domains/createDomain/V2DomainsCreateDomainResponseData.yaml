type: object
required:
  - domainId
  - dnsRecords
properties:
  domainId:
    type: string
    minLength: 8
    maxLength: 255
    pattern: "^[a-zA-Z0-9_]+$"
    description: |
      The unique identifier of the newly created domain, generated by Unkey.
      Always begins with 'dom_' followed by a unique alphanumeric sequence.
    example: dom_1234abcd
  dnsRecords:
    type: array
    minItems: 1
    maxItems: 4
    items:
      "$ref": "../../../../common/DnsRecord.yaml"
    description: |
      Every DNS record needed to finish setting up this domain, ready to create at your provider.
      The list already accounts for whether the domain is an apex or a subdomain, so no further
      branching is needed: create each entry as given.

      One record establishes routing and one proves ownership. Records marked `required: false` are
      only consulted when the routing record cannot be read, which happens for proxied records and
      for a name another workspace has already verified.
  domainConnectProvider:
    type: string
    maxLength: 256
    description: |
      Display name of the DNS provider the domain is delegated to, such as 'Cloudflare'. Discovered from
      the domain's nameservers, so it reflects where DNS is actually hosted rather than where the domain
      was registered. Omitted when the provider does not support Domain Connect or discovery failed.
    example: Cloudflare
  domainConnectUrl:
    type: string
    maxLength: 2048
    description: |
      Signed Domain Connect URL that pre-fills the records in `dnsRecords` at the provider. Open it in a
      browser and the domain owner approves them in one step instead of entering them by hand. The URL is
      signed with an Unkey key, so it cannot be constructed or altered by the caller.

      Intended for a browser, not a script: after approval the provider sends the browser to this
      workspace's app settings page in the Unkey dashboard, so it suits a caller who administers this
      workspace. Anyone who does not have access to it approves the records successfully but lands on a
      page they cannot open. Approving is what writes the records; verification then proceeds on its own,
      so nothing depends on completing that return trip.

      Omitted whenever domainConnectProvider is omitted.
    example: https://dash.cloudflare.com/domainconnect/v2/domaintemplates/apply?domain=acme.com&host=api
additionalProperties: false

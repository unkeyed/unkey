post:
  tags:
    - domains
  summary: Create domain
  description: |
    Attach a custom domain to an environment and start verifying it.

    The domain is created in the `pending` state and does not serve traffic until verification succeeds. Verification runs in the background and polls DNS, so it is eventually consistent.

    The response returns `dnsRecords`: every record needed to finish setup, already resolved for whether this domain is an apex or a subdomain. Create each entry exactly as given. One record establishes routing and one proves ownership; entries marked `required: false` are only consulted when the routing record cannot be read, which happens for proxied records and for a name another workspace has already verified.

    When your DNS provider supports Domain Connect, the response also carries `domainConnectProvider` and `domainConnectUrl`; opening that URL applies the same records at the provider in one step.

    Domains are unique per workspace, so the same name cannot be attached to two environments. Attaching a domain that already exists in your workspace returns a 409 conflict.

    **Important**: verification stops after 24 hours without the required DNS records, and the domain moves to `failed`.

    **Required Permissions**

    Your root key must have one of the following permissions:
    - `environment.*.create_domain` (to attach domains to any environment)
    - `environment.<environment_id>.create_domain` (to attach domains to a specific environment)
  operationId: domains.createDomain
  x-speakeasy-name-override: createDomain
  x-unkey-idempotency: conditionally-idempotent
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2DomainsCreateDomainRequestBody.yaml"
        examples:
          bySlug:
            summary: Attach a domain, locating the environment by slug
            description: Uses the project, app, and environment slugs
            value:
              project: payments
              app: payments-api
              environment: production
              domain: api.acme.com
          byId:
            summary: Attach a domain, locating the environment by ID
            description: Uses the ids returned by the corresponding list endpoints
            value:
              project: proj_1234abcd
              app: app_1234abcd
              environment: env_1234abcd
              domain: api.acme.com
          apex:
            summary: Attach an apex domain
            description: An apex domain is verified through the TXT record and needs A or AAAA records to serve traffic
            value:
              project: payments
              app: payments-api
              environment: production
              domain: acme.com
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            "$ref": "./V2DomainsCreateDomainResponseBody.yaml"
          examples:
            subdomain:
              summary: Subdomain attached
              description: A subdomain verifies from its CNAME alone, so the TXT record is optional
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  domainId: dom_1234abcd
                  dnsRecords:
                    - type: CNAME
                      name: api.acme.com
                      value: a1b2c3d4e5f6g7h8.cname.unkey.com
                      required: true
                      note: Create as DNS-only. A proxied record is flattened and cannot be read.
                    - type: TXT
                      name: _unkey.api.acme.com
                      value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
                      required: false
                      note: Only needed when the CNAME cannot be read, or the domain is already verified in another workspace.
            apex:
              summary: Apex domain attached
              description: An apex domain cannot hold a CNAME, so it needs an apex-compatible alias and the TXT record
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  domainId: dom_1234abcd
                  dnsRecords:
                    - type: ALIAS
                      name: acme.com
                      value: a1b2c3d4e5f6g7h8.cname.unkey.com
                      required: true
                      note: Apex domains cannot hold a CNAME. Use ALIAS, ANAME, or a flattened CNAME depending on your provider.
                    - type: TXT
                      name: _unkey.acme.com
                      value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
                      required: true
                      note: Required for apex domains, which cannot be verified through their routing record.
            domainConnect:
              summary: Domain attached at a Domain Connect provider
              description: The same records can be applied through the returned URL
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  domainId: dom_1234abcd
                  dnsRecords:
                    - type: CNAME
                      name: api.acme.com
                      value: a1b2c3d4e5f6g7h8.cname.unkey.com
                      required: true
                      note: Create as DNS-only. A proxied record is flattened and cannot be read.
                    - type: TXT
                      name: _unkey.api.acme.com
                      value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
                      required: false
                      note: Only needed when the CNAME cannot be read, or the domain is already verified in another workspace.
                  domainConnectProvider: Cloudflare
                  domainConnectUrl: https://dash.cloudflare.com/domainconnect/v2/domaintemplates/apply?domain=acme.com&host=api
      description: |
        Domain created and verification started. The domain is `pending` until the DNS records resolve.
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
          examples:
            invalidDomain:
              summary: Invalid domain format
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Bad Request
                  detail: The domain must be a fully qualified domain name.
                  status: 400
                  type: validation-error
                  errors:
                    - location: body.domain
                      message: must match ^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$
                      fix: Pass a fully qualified domain name such as 'api.acme.com', without a scheme, port, or path
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
          examples:
            invalidRootKey:
              summary: Root key not found
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Unauthorized
                  detail: The provided root key is invalid.
                  status: 401
                  type: unauthorized
    "403":
      description: |
        Forbidden - The root key or its workspace is disabled. A root key that simply lacks
        `environment.*.create_domain` receives a 404 instead, so permissions cannot be used to discover
        which environments exist.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
          examples:
            keyDisabled:
              summary: Root key disabled
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Forbidden
                  detail: The provided root key is disabled.
                  status: 403
                  type: forbidden
    "404":
      description: |
        Not Found - The environment does not exist in your workspace, or your root key may not read it
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
          examples:
            environmentNotFound:
              summary: Environment not found
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Not Found
                  detail: The requested environment does not exist.
                  status: 404
                  type: not-found
    "409":
      description: Conflict - The domain is already attached to an environment in this workspace
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ConflictErrorResponse.yaml"
          examples:
            domainExists:
              summary: Domain already registered
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Conflict
                  detail: The domain 'api.acme.com' is already registered in this workspace.
                  status: 409
                  type: conflict
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
          examples:
            rateLimited:
              summary: Workspace rate limit exceeded
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Too Many Requests
                  detail: You have exceeded the rate limit for this operation. Retry after the window resets.
                  status: 429
                  type: rate-limited
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"
          examples:
            internalError:
              summary: Unexpected server error
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Internal Server Error
                  detail: An unexpected error occurred. Contact support@unkey.com with the requestId.
                  status: 500
                  type: internal-server-error

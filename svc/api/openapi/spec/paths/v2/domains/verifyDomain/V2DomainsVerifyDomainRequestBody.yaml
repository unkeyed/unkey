type: object
required:
  - domain
properties:
  domain:
    type: string
    minLength: 4
    maxLength: 253
    description: |
      Identifies a domain by its name or by its ID. Send the fully qualified domain name, such as
      'api.acme.com', without a scheme, port, or path, or send the domain ID that
      domains.createDomain returns. You can send an internationalized name in Unicode or in
      Punycode form. Both forms address the same domain.
    example: api.acme.com
additionalProperties: false
examples:
  byName:
    summary: Verify by domain name
    description: The name is unique per workspace. It addresses the domain on its own.
    value:
      domain: api.acme.com
  byId:
    summary: Verify by domain ID
    description: The domains.createDomain operation returns this ID.
    value:
      domain: dom_1234abcd

post:
  tags:
    - domains
  summary: List domains
  description: |
    List custom domains in your workspace and their verification status. Use the optional
    project, app, and environment filters to narrow the results. Each filter accepts an ID or
    slug without requiring its parent filters, and all supplied filters combine with AND. Missing
    resources, mismatched parent and child filters, and scopes with no matching domains return an
    empty list.

    ### Access patterns

    Choose filters for the scope you want to list. These examples use slugs, but each
    identifier matches both the ID and slug of its resource.

    | Request body | Matching domains |
    | --- | --- |
    | `{}` | Across all projects, apps, and environments in your workspace. |
    | `{"project":"payments"}` | Across all apps and environments in the matching projects. |
    | `{"app":"api"}` | Across all environments in matching apps, in any project. |
    | `{"environment":"production"}` | Across all matching environments, in any project or app. |
    | `{"project":"payments","app":"api"}` | Across all environments in matching apps within the matching projects. |
    | `{"project":"payments","environment":"production"}` | In matching environments across all apps within the matching projects. |
    | `{"app":"api","environment":"production"}` | In matching environments within matching apps, in any project. |
    | `{"project":"payments","app":"api","environment":"production"}` | In environments that match all three identifiers through their parent relationships. |

    Omitting `environment` includes every environment in the selected scope.
    A slug can match multiple apps or environments. For example,
    `{"environment":"production"}` selects domains from every environment named `production`
    in your workspace.

    Results include only domains you have permission to read, sorted by ID.
    When `hasMore` is true, send the returned `cursor` to get the next page.

    `status: verified` means the domain is verified. Unkey has configured routing and requested a
    certificate. Each domain includes its full `dnsRecords`. Each record has a `verified` flag.
    The flag shows which records Unkey has read back, so you can see which records are still
    missing without a second call. Some providers hide a record from DNS lookups, for example a
    proxied or flattened routing record. Such a record stays `false` while it serves traffic.

    **Required Permissions**

    Your credential needs a `#read` grant covering the domains you want to list,
    such as a grant ending in `/domains/<domain_id>#read` for one domain.

    The legacy `environment.*.read_domain` permission remains supported. A successful request
    returns an empty list if no matching domains are readable by your credential.
  operationId: domains.listDomains
  x-speakeasy-name-override: listDomains
  x-unkey-idempotency: idempotent
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2DomainsListDomainsRequestBody.yaml"
        examples:
          workspaceWide:
            summary: List all domains in the workspace
            value: {}
          byProject:
            summary: List a project's domains
            value:
              project: payments
          bySlugs:
            summary: List an environment's domains by slugs
            description: Uses the project, app, and environment slugs.
            value:
              project: payments
              app: payments-api
              environment: production
          byIds:
            summary: List an environment's domains by its ID
            value:
              environment: env_1234abcd
          search:
            summary: Filter by name
            description: Returns only domains whose id or name contains the search string.
            value:
              project: payments
              app: payments-api
              environment: production
              search: acme.com
          paginated:
            summary: Paginate with a smaller page size
            description: Get a smaller page and continue from a cursor.
            value:
              project: payments
              app: payments-api
              environment: production
              limit: 20
              cursor: dom_1234abcd
    required: true
  responses:
    "200":
      description: |
        Successfully retrieved the permitted domains that match every filter. Missing or
        mismatched filtered resources return an empty list.
      content:
        application/json:
          schema:
            "$ref": "./V2DomainsListDomainsResponseBody.yaml"
          examples:
            domainList:
              summary: Domain list
              description: Two verified domains. The routing record verified the subdomain. The TXT record verified the apex domain, because Unkey cannot read its alias back.
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  - id: dom_1234abcd
                    domain: api.acme.com
                    projectId: proj_1234abcd
                    appId: app_1234abcd
                    environmentId: env_1234abcd
                    status: verified
                    dnsRecords:
                      - type: CNAME
                        name: api.acme.com
                        value: a1b2c3d4e5f6g7h8.cname.unkey.com
                        ttl: 60
                        verified: true
                        note: Create as DNS-only if your provider offers the choice.
                      - type: TXT
                        name: _unkey.api.acme.com
                        value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
                        ttl: 60
                        verified: false
                        note: Proves ownership. Create it alongside the routing record.
                    createdAt: 1704067200000
                    updatedAt: 1704067260000
                  - id: dom_5678efgh
                    domain: acme.com
                    projectId: proj_1234abcd
                    appId: app_1234abcd
                    environmentId: env_1234abcd
                    status: verified
                    dnsRecords:
                      - type: ALIAS
                        name: acme.com
                        value: i9j8k7l6m5n4o3p2.cname.unkey.com
                        ttl: 60
                        verified: false
                        note: Apex domains cannot hold a CNAME. Use ALIAS, ANAME, or a flattened CNAME depending on your provider.
                      - type: TXT
                        name: _unkey.acme.com
                        value: unkey-domain-verify=7Kp2Rq9wZx4mB6nT1yL8vJ3h
                        ttl: 60
                        verified: true
                        note: Proves ownership. An apex domain cannot be verified through its routing record, so this is the only proof available.
                    createdAt: 1704067200000
                    updatedAt: 1704067260000
                pagination:
                  hasMore: false
            empty:
              summary: No permitted domains match
              description: Missing or mismatched resources and filters with no permitted matches return an empty array.
              value:
                meta:
                  requestId: req_1234abcd
                data: []
                pagination:
                  cursor: null
                  hasMore: false
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
          examples:
            searchTooLong:
              summary: Search string above the maximum
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Bad Request
                  detail: The search string must be at most 256 characters.
                  status: 400
                  type: validation-error
                  errors:
                    - location: body.search
                      message: must be at most 256 characters
                      fix: Shorten the search string, or omit it to return domains without a search filter
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
          examples:
            invalidRootKey:
              summary: Root key not found
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Unauthorized
                  detail: The provided root key is invalid.
                  status: 401
                  type: unauthorized
    "403":
      description: |
        Forbidden - The root key or its workspace is disabled.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
          examples:
            keyDisabled:
              summary: Root key disabled
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Forbidden
                  detail: The provided root key is disabled.
                  status: 403
                  type: forbidden
    "404":
      description: |
        The workspace associated with the root key does not exist.
        Missing or mismatched project, app, and environment filters return an empty list, not 404.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
          examples:
            rateLimited:
              summary: Workspace rate limit exceeded
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Too Many Requests
                  detail: You have exceeded the rate limit for this operation. Retry after the window resets.
                  status: 429
                  type: rate-limited
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"
          examples:
            internalError:
              summary: Unexpected server error
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Internal Server Error
                  detail: An unexpected error occurred. Contact support@unkey.com with the requestId.
                  status: 500
                  type: internal-server-error
    "503":
      description: |
        The request could not be completed. No partial result is returned.
        Narrow the project, app, environment, or search filters before retrying.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ServiceUnavailableErrorResponse.yaml"
          examples:
            scanBudgetExhausted:
              summary: Narrow the request filters
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Service Unavailable
                  detail: The domain scan limit was reached. Narrow the project, app, environment, or search filters and retry.
                  status: 503
                  type: service-unavailable

type: object
required:
  - meta
  - data
properties:
  meta:
    "$ref": "../../../../common/Meta.yaml"
  data:
    type: array
    items:
      "$ref": "../../../../common/Domain.yaml"
    description: |
      Up to 10 domains attached to the environment, ordered by domain id.
      Empty when the environment has none, which is not an error.
additionalProperties: false
examples:
  domainList:
    summary: Domain list
    description: |
      Two domains in one environment. The apex verified on its TXT record, so it reports routingVerified false while serving.
      despite reporting verified.
    value:
      meta:
        requestId: req_1234abcd
      data:
        - id: dom_1234abcd
          domain: api.acme.com
          projectId: proj_1234abcd
          appId: app_1234abcd
          environmentId: env_1234abcd
          status: verified
          routingVerified: true
          ownershipVerified: false
          lastCheckedAt: 1704067260000
          dnsRecords:
            - type: CNAME
              name: api.acme.com
              value: a1b2c3d4e5f6g7h8.cname.unkey.com
              note: Create as DNS-only if your provider offers the choice.
            - type: TXT
              name: _unkey.api.acme.com
              value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
              note: Proves ownership. Create it alongside the routing record.
          createdAt: 1704067200000
          updatedAt: 1704067260000
        - id: dom_5678efgh
          domain: acme.com
          projectId: proj_1234abcd
          appId: app_1234abcd
          environmentId: env_1234abcd
          status: verified
          routingVerified: false
          ownershipVerified: true
          lastCheckedAt: 1704067260000
          dnsRecords:
            - type: ALIAS
              name: acme.com
              value: i9j8k7l6m5n4o3p2.cname.unkey.com
              note: Apex domains cannot hold a CNAME. Use ALIAS, ANAME, or a flattened CNAME depending on your provider.
            - type: TXT
              name: _unkey.acme.com
              value: unkey-domain-verify=7Kp2Rq9wZx4mB6nT1yL8vJ3h
              note: Proves ownership. An apex domain cannot be verified through its routing record, so this is the only proof available.
          createdAt: 1704067200000
          updatedAt: 1704067260000
  empty:
    summary: No domains attached
    description: An environment with no custom domains returns an empty array rather than a 404
    value:
      meta:
        requestId: req_1234abcd
      data: []

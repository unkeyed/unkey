type: object
required:
  - meta
  - data
  - pagination
properties:
  meta:
    "$ref": "../../../../common/Meta.yaml"
  data:
    type: array
    maxItems: 100
    items:
      "$ref": "../../../../common/Domain.yaml"
    description: |
      The domains attached to the environment, in order of domain id.
      The array is empty when the environment has no domains. This is not an error.
  pagination:
    "$ref": "../../../../common/Pagination.yaml"
additionalProperties: false
examples:
  domainList:
    summary: Domain list
    description: |
      Two verified domains in one environment. The routing record verified the subdomain. The TXT
      record verified the apex domain, because Unkey cannot read its alias back.
    value:
      meta:
        requestId: req_1234abcd
      data:
        - id: dom_1234abcd
          domain: api.acme.com
          projectId: proj_1234abcd
          appId: app_1234abcd
          environmentId: env_1234abcd
          status: verified
          dnsRecords:
            - type: CNAME
              name: api.acme.com
              value: a1b2c3d4e5f6g7h8.cname.unkey.com
              ttl: 60
              verified: true
              note: Create as DNS-only if your provider offers the choice.
            - type: TXT
              name: _unkey.api.acme.com
              value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
              ttl: 60
              verified: false
              note: Proves ownership. Create it alongside the routing record.
          createdAt: 1704067200000
          updatedAt: 1704067260000
        - id: dom_5678efgh
          domain: acme.com
          projectId: proj_1234abcd
          appId: app_1234abcd
          environmentId: env_1234abcd
          status: verified
          dnsRecords:
            - type: ALIAS
              name: acme.com
              value: i9j8k7l6m5n4o3p2.cname.unkey.com
              ttl: 60
              verified: false
              note: Apex domains cannot hold a CNAME. Use ALIAS, ANAME, or a flattened CNAME depending on your provider.
            - type: TXT
              name: _unkey.acme.com
              value: unkey-domain-verify=7Kp2Rq9wZx4mB6nT1yL8vJ3h
              ttl: 60
              verified: true
              note: Proves ownership. An apex domain cannot be verified through its routing record, so this is the only proof available.
          createdAt: 1704067200000
          updatedAt: 1704067260000
      pagination:
        hasMore: false
  paginatedResponse:
    summary: Paginated domain listing with more results
    description: The response when the environment has more domains than the limit
    value:
      meta:
        requestId: req_5678efgh
      data:
        - id: dom_1234abcd
          domain: api.acme.com
          projectId: proj_1234abcd
          appId: app_1234abcd
          environmentId: env_1234abcd
          status: pending
          dnsRecords:
            - type: CNAME
              name: api.acme.com
              value: a1b2c3d4e5f6g7h8.cname.unkey.com
              ttl: 60
              verified: false
              note: Create as DNS-only if your provider offers the choice.
            - type: TXT
              name: _unkey.api.acme.com
              value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
              ttl: 60
              verified: false
              note: Proves ownership. Create it alongside the routing record.
          createdAt: 1704067200000
      pagination:
        cursor: dom_5678efgh
        hasMore: true
  empty:
    summary: No domains attached
    description: An environment with no custom domains returns an empty array, not a 404
    value:
      meta:
        requestId: req_1234abcd
      data: []
      pagination:
        cursor: null
        hasMore: false

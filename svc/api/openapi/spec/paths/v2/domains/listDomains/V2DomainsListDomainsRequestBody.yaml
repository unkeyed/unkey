type: object
properties:
  project:
    # oapi-codegen ignores description siblings on $ref; allOf preserves the field-specific docs.
    allOf:
      - "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Match domains whose project ID or slug equals this value. This filter does not require
      an app or environment filter.
  app:
    allOf:
      - "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Match domains whose app ID or slug equals this value. This filter does not require a
      project or environment filter.
  environment:
    allOf:
      - "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Match domains whose environment ID or slug equals this value. This filter does not require
      a project or app filter.
  limit:
    type: integer
    description: |
      The maximum number of domains one response contains.
      A small limit makes the response smaller, but makes more requests necessary.
    default: 100
    minimum: 1
    maximum: 100
  cursor:
    type: string
    description: |
      The pagination cursor from the response that came before.
      Send it to get the next page when that response has `hasMore: true`.
    example: dom_1234abcd
  search:
    type: string
    maxLength: 256
    description: Free-form text to filter domains. Returns domains whose ID or
      name contains the search string. Matching is case-insensitive.
    example: acme.com
additionalProperties: false
description: |
  Filter domains within a workspace. All filters are optional and combine with AND. Each resource
  filter matches its ID or slug directly, even when its parent filters are omitted. A missing
  resource or a resource that does not match the other filters produces an empty list.
examples:
  workspaceWide:
    summary: List all domains in the workspace
    value: {}
  byProject:
    summary: List a project's domains
    value:
      project: payments
  bySlugs:
    summary: List an environment's domains by slugs
    description: Uses the project, app, and environment slugs, which is the form a human or agent usually has on hand.
    value:
      project: payments
      app: payments-api
      environment: production
  byIds:
    summary: List an environment's domains by its ID
    value:
      environment: env_1234abcd
  search:
    summary: Filter by name
    description: Returns only domains whose id or name contains the search string.
    value:
      project: payments
      app: payments-api
      environment: production
      search: acme.com
  paginated:
    summary: Paginate with a smaller page size
    description: Get a smaller page and continue from a cursor.
    value:
      project: payments
      app: payments-api
      environment: production
      limit: 20
      cursor: dom_1234abcd

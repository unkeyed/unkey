type: object
properties:
  project:
    # oapi-codegen ignores description siblings on $ref; allOf preserves the field-specific docs.
    allOf:
      - "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Restrict results to one project, identified by its ID or slug.
      Set this when an `app` filter uses a slug.
  app:
    allOf:
      - "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Restrict results to one app, identified by its ID or slug.
      If `project` is omitted, the endpoint treats this opaque value only as an app ID.
      Set `project` to use an app slug.
  environment:
    allOf:
      - "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Restrict results to one environment, identified by its ID or slug.
      If `app` is omitted, the endpoint treats this opaque value only as an environment ID.
      Set `app` to use an environment slug.
      If the app uses a slug, also set `project`.
  limit:
    type: integer
    description: |
      The maximum number of domains one response contains.
      A small limit makes the response smaller, but makes more requests necessary.
    default: 100
    minimum: 1
    maximum: 100
  cursor:
    type: string
    description: |
      The pagination cursor from the response that came before.
      Send it to get the next page when that response has `hasMore: true`.
    example: dom_1234abcd
  search:
    type: string
    maxLength: 256
    description: Free-form text to filter domains. Returns domains whose ID or
      name contains the search string. Matching is case-insensitive.
    example: acme.com
additionalProperties: false
description: |
  Filter domains within a workspace. All filters are optional. With no filters,
  the endpoint returns every custom domain in the workspace.
examples:
  workspaceWide:
    summary: List all domains in the workspace
    value: {}
  byProject:
    summary: List a project's domains
    value:
      project: payments
  bySlugs:
    summary: List an environment's domains by slugs
    description: Uses the project, app, and environment slugs, which is the form a human or agent usually has on hand.
    value:
      project: payments
      app: payments-api
      environment: production
  byIds:
    summary: List an environment's domains by its ID
    value:
      environment: env_1234abcd
  search:
    summary: Filter by name
    description: Returns only domains whose id or name contains the search string.
    value:
      project: payments
      app: payments-api
      environment: production
      search: acme.com
  paginated:
    summary: Paginate with a smaller page size
    description: Get a smaller page and continue from a cursor.
    value:
      project: payments
      app: payments-api
      environment: production
      limit: 20
      cursor: dom_1234abcd

type: object
description: Compute one environment used in the period.
required:
  - projectId
  - appId
  - environmentId
  - cpuSeconds
  - memoryGiBHours
  - diskGiBHours
  - egressGiB
properties:
  projectId:
    type: string
    description: The project the environment belongs to.
    example: proj_1234abcd
  projectName:
    type: string
    description: The project name. Omitted when the project was deleted.
    example: Payments
  appId:
    type: string
    description: |
      The app the environment belongs to. Empty when the usage was recorded
      before Unkey stored app ids and the environment was deleted since.
    example: app_1234abcd
  appName:
    type: string
    description: The app name. Omitted when the app was deleted.
    example: API
  environmentId:
    type: string
    description: The environment that used the compute.
    example: env_1234abcd
  environmentSlug:
    type: string
    description: The environment slug. Omitted when the environment was deleted.
    example: production
  cpuSeconds:
    type: number
    format: double
    description: CPU time used, in seconds.
    example: 5400.5
  memoryGiBHours:
    type: number
    format: double
    description: Memory used over time, in GiB-hours.
    example: 96.2
  diskGiBHours:
    type: number
    format: double
    description: Ephemeral disk allocated over time, in GiB-hours.
    example: 0
  egressGiB:
    type: number
    format: double
    description: Public network egress, in GiB.
    example: 1.4
additionalProperties: false

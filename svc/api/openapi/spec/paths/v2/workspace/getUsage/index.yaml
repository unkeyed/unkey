post:
  tags:
    - workspace
  summary: Get workspace usage
  description: |
    Get the usage of your workspace for one calendar month (UTC): billable API
    operations, compute usage per environment, and active keys per app.

    Use this to track usage during the month or to look back at the previous
    month. The response has no prices. Your invoice is the source of truth.
    Compute usage can be up to 15 minutes late, and it can change for up to 7
    days.

    Send `{}` for the current month to date, or `{"period": "previous"}` for the
    full previous month.

    **Required Permissions**

    Your root key must have one of the following permissions:
    - `workspace.*.read_usage`
    - `unkey:v1:<workspace_id>:usage#read`
  operationId: workspace.getUsage
  x-speakeasy-name-override: getUsage
  x-unkey-idempotency: idempotent
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2WorkspaceGetUsageRequestBody.yaml"
        examples:
          currentMonth:
            summary: Current month to date
            value: {}
          previousMonth:
            summary: Previous month
            value:
              period: previous
    required: true
  responses:
    "200":
      description: |
        The workspace usage for the requested month.
      content:
        application/json:
          schema:
            "$ref": "./V2WorkspaceGetUsageResponseBody.yaml"
          examples:
            currentMonth:
              summary: Current month to date
              description: Usage so far this month, ending at the time of the request
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  period:
                    start: 1790812800000
                    end: 1790946000000
                  totals:
                    api:
                      verifications: 40000
                      ratelimits: 2000
                    compute:
                      cpuSeconds: 5400.5
                      memoryGiBHours: 96.2
                      storageGiBHours: 0
                      egressGiB: 1.4
                    gateway:
                      activeKeys: 12
                  breakdowns:
                    byEnvironment:
                      - project:
                          id: proj_1234abcd
                          name: Payments
                        app:
                          id: app_1234abcd
                          name: API
                        environment:
                          id: env_1234abcd
                          slug: production
                        compute:
                          cpuSeconds: 5400.5
                          memoryGiBHours: 96.2
                          storageGiBHours: 0
                          egressGiB: 1.4
                    byApp:
                      - project:
                          id: proj_1234abcd
                          name: Payments
                        app:
                          id: app_1234abcd
                          name: API
                        gateway:
                          activeKeys: 12
            previousMonth:
              summary: Previous month
              description: The full previous month, ending at the start of the current month
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  period:
                    start: 1788220800000
                    end: 1790812800000
                  totals:
                    api:
                      verifications: 120000
                      ratelimits: 8000
                    compute:
                      cpuSeconds: 16200
                      memoryGiBHours: 288.6
                      storageGiBHours: 0
                      egressGiB: 4.2
                    gateway:
                      activeKeys: 30
                  breakdowns:
                    byEnvironment:
                      - project:
                          id: proj_1234abcd
                          name: Payments
                        app:
                          id: app_1234abcd
                          name: API
                        environment:
                          id: env_1234abcd
                          slug: production
                        compute:
                          cpuSeconds: 16200
                          memoryGiBHours: 288.6
                          storageGiBHours: 0
                          egressGiB: 4.2
                    byApp:
                      - project:
                          id: proj_1234abcd
                          name: Payments
                        app:
                          id: app_1234abcd
                          name: API
                        gateway:
                          activeKeys: 30
            emptyMonth:
              summary: No usage
              description: Nothing ran and no keys were verified, so totals are zero and the lists are empty
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  period:
                    start: 1790812800000
                    end: 1790946000000
                  totals:
                    api:
                      verifications: 0
                      ratelimits: 0
                    compute:
                      cpuSeconds: 0
                      memoryGiBHours: 0
                      storageGiBHours: 0
                      egressGiB: 0
                    gateway:
                      activeKeys: 0
                  breakdowns:
                    byEnvironment: []
                    byApp: []
            deletedApp:
              summary: Usage of a deleted app
              description: The app and its environment were deleted after they ran, so their names are omitted. The last row has keys without an app id
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  period:
                    start: 1788220800000
                    end: 1790812800000
                  totals:
                    api:
                      verifications: 0
                      ratelimits: 0
                    compute:
                      cpuSeconds: 900
                      memoryGiBHours: 12.5
                      storageGiBHours: 0
                      egressGiB: 0.2
                    gateway:
                      activeKeys: 4
                  breakdowns:
                    byEnvironment:
                      - project:
                          id: proj_1234abcd
                          name: Payments
                        app:
                          id: app_5678efgh
                        environment:
                          id: env_5678efgh
                        compute:
                          cpuSeconds: 900
                          memoryGiBHours: 12.5
                          storageGiBHours: 0
                          egressGiB: 0.2
                    byApp:
                      - app:
                          id: app_5678efgh
                        gateway:
                          activeKeys: 3
                      - gateway:
                          activeKeys: 1
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
          examples:
            invalidPeriod:
              summary: Unknown period
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Bad Request
                  detail: POST request body for '/v2/workspace.getUsage' failed to validate schema
                  status: 400
                  type: https://unkey.com/docs/errors/unkey/application/invalid_input
                  errors:
                    - location: /properties/period/enum
                      message: value must be one of 'current', 'previous'
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
          examples:
            invalidRootKey:
              summary: Invalid root key
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Unauthorized
                  detail: The provided root key is invalid. We could not find the requested key.
                  status: 401
                  type: https://unkey.com/docs/errors/unkey/authentication/key_not_found
    "403":
      description: Forbidden - Insufficient permissions (requires `workspace.*.read_usage`)
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
          examples:
            missingPermission:
              summary: Missing required permission
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Insufficient Permissions
                  detail: "Missing one of these permissions: unkey:v1:ws_1234abcd:usage#read or workspace.*.read_usage"
                  status: 403
                  type: https://unkey.com/docs/errors/unkey/authorization/insufficient_permissions
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
          examples:
            workspaceRateLimited:
              summary: Workspace rate limit exceeded
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Too Many Requests
                  detail: This workspace has exceeded its API rate limit of 1000/1m0s. Please try again later.
                  status: 429
                  type: https://unkey.com/docs/errors/user/too_many_requests/workspace_rate_limited
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"
          examples:
            usageUnavailable:
              summary: Usage could not be read
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Internal Server Error
                  detail: Failed to read the workspace's compute usage.
                  status: 500
                  type: https://unkey.com/docs/errors/unkey/application/service_unavailable

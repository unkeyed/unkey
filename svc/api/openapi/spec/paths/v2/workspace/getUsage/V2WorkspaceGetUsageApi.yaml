type: object
description: |
  Billable operations through the Unkey API in the period. Key verifications
  through the Unkey gateway are not counted here. The gateway bills by active
  keys, see `gateway`.
required:
  - verifications
  - ratelimits
properties:
  verifications:
    type: integer
    format: int64
    description: Billable key verifications.
    example: 40000
  ratelimits:
    type: integer
    format: int64
    description: Billable rate limit operations.
    example: 2000
additionalProperties: false

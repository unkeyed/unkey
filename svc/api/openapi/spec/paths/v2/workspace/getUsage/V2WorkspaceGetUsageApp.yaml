type: object
description: Active gateway keys counted for one app in the period.
required:
  - appId
  - activeKeys
properties:
  appId:
    type: string
    description: |
      The app whose gateway verified the keys. Empty for keys whose
      verifications were all recorded before Unkey stored app ids.
    example: app_1234abcd
  appName:
    type: string
    description: The app name. Omitted when the app was deleted or `appId` is empty.
    example: API
  projectId:
    type: string
    description: The project the app belongs to. Omitted when the app was deleted or `appId` is empty.
    example: proj_1234abcd
  projectName:
    type: string
    description: |
      The project name. Omitted when the app or the project was deleted, or
      `appId` is empty.
    example: Payments
  activeKeys:
    type: integer
    format: int64
    description: |
      Distinct keys this app's gateway verified in the period. A key verified
      through several apps counts once, for the app that verified it most, so
      the rows sum to `compute.activeKeys`.
    example: 12
additionalProperties: false

type: object
properties:
  period:
    type: string
    enum:
      - current
      - previous
    # Codegen otherwise emits bare Current/Previous into the shared openapi package
    x-enum-varnames:
      - UsagePeriodCurrent
      - UsagePeriodPrevious
    default: current
    description: |
      The calendar month (UTC) to read. `current` is the month to date.
      `previous` is the full month before it.
    example: current
additionalProperties: false
examples:
  currentMonth:
    summary: Current month to date
    value: {}
  previousMonth:
    summary: Previous month
    value:
      period: previous

type: object
required:
  - value
  - description
  - allowEnable
  - allowDisable
properties:
  value:
    type: boolean
    description: Whether the feature is enabled for this workspace. A workspace-specific value overrides the flag's default.
  description:
    type: string
    description: What the flag controls.
  allowEnable:
    type: boolean
    description: Whether this flag can be enabled. Updating it also requires `flags#write` permission.
  allowDisable:
    type: boolean
    description: Whether this flag can be disabled. Updating it also requires `flags#write` permission.
additionalProperties: false

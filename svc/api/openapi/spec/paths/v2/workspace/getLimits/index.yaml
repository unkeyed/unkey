post:
  tags:
    - workspace
  summary: Get workspace limits
  description: |
    Get every limit of your workspace, with the current value against each
    limit that has one.

    Use this before an operation that a limit can reject, for example to see how
    many custom domains or log drains remain, or how much CPU, memory, and disk
    a new deployment can still reserve.

    The request takes no parameters. Each limit has a `limit`, which is `null`
    when unlimited, and a `current` value when the limit has one. Billable
    operations count the current calendar month in UTC. The Compute limits are
    present only when the workspace has a Compute plan.

    **Required Permissions**

    Your root key must have the following permission:
    - `unkey:v1:<workspace_id>:limits#read`
  operationId: workspace.getLimits
  x-speakeasy-name-override: getLimits
  x-unkey-idempotency: idempotent
  security:
    - bearer: []
  responses:
    "200":
      description: |
        The workspace limits and the current values against them.
      content:
        application/json:
          schema:
            "$ref": "./V2WorkspaceGetLimitsResponseBody.yaml"
          examples:
            withCompute:
              summary: Workspace with a Compute plan
              description: API, log, and Compute limits with current values. Custom domains are unlimited, so their `limit` is `null`.
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  apiBillableOperationsCountMaxPerMonth:
                    limit: 150000
                    current: 42000
                  apiRequestsCountMaxPerMinute:
                    limit: 1000
                  logsRetentionDaysMax:
                    limit: 7
                  logsAuditRetentionDaysMax:
                    limit: 30
                  logdrainsMax:
                    limit: 1
                    current: 0
                  cpuCoresMax:
                    limit: 4
                    current: 2.5
                  cpuCoresMaxPerInstance:
                    limit: 2
                  memoryMibMax:
                    limit: 8192
                    current: 4096
                  memoryMibMaxPerInstance:
                    limit: 4096
                  storageMibMax:
                    limit: 10240
                    current: 2048
                  storageMibMaxPerInstance:
                    limit: 5120
                  buildsConcurrentMax:
                    limit: 2
                  autoscalingReplicasMax:
                    limit: 10
                  customDomainsMax:
                    limit: null
                    current: 1
            withoutCompute:
              summary: Workspace without a Compute plan
              description: No Compute plan, so the Compute limits are omitted. No per-minute limit, so its `limit` is `null`.
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  apiBillableOperationsCountMaxPerMonth:
                    limit: 150000
                    current: 42000
                  apiRequestsCountMaxPerMinute:
                    limit: null
                  logsRetentionDaysMax:
                    limit: 7
                  logsAuditRetentionDaysMax:
                    limit: 30
                  logdrainsMax:
                    limit: 0
                    current: 0
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
          examples:
            invalidRootKey:
              summary: Invalid root key
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Unauthorized
                  detail: The provided root key is invalid. We could not find the requested key.
                  status: 401
                  type: https://unkey.com/docs/errors/unkey/authentication/key_not_found
    "403":
      description: Forbidden - Insufficient permissions (requires `unkey:v1:<workspace_id>:limits#read`)
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
          examples:
            missingPermission:
              summary: Missing required permission
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Insufficient Permissions
                  detail: "Missing permission: 'unkey:v1:ws_1234abcd:limits#read'"
                  status: 403
                  type: https://unkey.com/docs/errors/unkey/authorization/insufficient_permissions
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
          examples:
            workspaceRateLimited:
              summary: Workspace rate limit exceeded
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Too Many Requests
                  detail: This workspace has exceeded its API rate limit of 1000/1m0s. Please try again later.
                  status: 429
                  type: https://unkey.com/docs/errors/user/too_many_requests/workspace_rate_limited
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"
          examples:
            limitsNotConfigured:
              summary: Limits not configured
              description: The workspace has no limits row, which support has to fix
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Internal Server Error
                  detail: Resource limits are not configured for this workspace. Contact support@unkey.com.
                  status: 500
                  type: https://unkey.com/docs/errors/unkey/application/service_unavailable

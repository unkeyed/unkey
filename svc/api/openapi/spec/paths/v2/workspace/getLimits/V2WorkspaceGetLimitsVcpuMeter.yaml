type: object
description: The workspace CPU limit and the reserved CPU against it, in vCPUs.
required:
  - limit
  - used
properties:
  limit:
    type: number
    format: double
    description: The maximum vCPUs the workspace can reserve.
    example: 4
  used:
    type: number
    format: double
    description: The vCPUs the workspace reserves now.
    example: 2.5
additionalProperties: false

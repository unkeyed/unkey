type: object
description: A workspace compute limit and the capacity reserved against it.
required:
  - limit
  - reserved
properties:
  limit:
    type: integer
    format: int64
    description: The maximum the workspace can reserve.
    example: 8192
  reserved:
    type: integer
    format: int64
    description: The amount running deployments reserve now.
    example: 4096
additionalProperties: false

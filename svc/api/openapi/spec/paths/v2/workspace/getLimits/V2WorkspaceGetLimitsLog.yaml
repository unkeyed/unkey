type: object
description: Limits for logs and log drains.
required:
  - retentionDays
  - auditRetentionDays
  - drains
properties:
  retentionDays:
    type: integer
    description: How many days back request and runtime logs can be queried.
    example: 7
  auditRetentionDays:
    type: integer
    description: The audit log retention of the workspace plan, in days.
    example: 30
  drains:
    description: The log drains in the workspace, against the allowance.
    allOf:
      - "$ref": "../../../../common/LimitMeter.yaml"
additionalProperties: false

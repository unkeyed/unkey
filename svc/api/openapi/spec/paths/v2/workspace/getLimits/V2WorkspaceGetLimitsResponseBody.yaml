          auditRetentionDays: 30
          drains:
            limit: 1
            used: 0
        compute:
          workspace:
            vCpus:
              limit: 4
              reserved: 2.5
            memoryMib:
              limit: 8192
              reserved: 4096
            storageMib:
              limit: 10240
              reserved: 2048
          perInstance:
            vCpus: 2
            memoryMib: 4096
            storageMib: 5120
          concurrentBuilds: 2
          replicasPerRegion: 10
          customDomains:
            limit: 5
            used: 1

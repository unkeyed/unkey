        logsRetentionDaysMax:
          limit: 7
        logsAuditRetentionDaysMax:
          limit: 30
        logdrainsMax:
          limit: 1
          current: 0
        cpuCoresMax:
          limit: 4
          current: 2.5
        cpuCoresMaxPerInstance:
          limit: 2
        memoryMibMax:
          limit: 8192
          current: 4096
        memoryMibMaxPerInstance:
          limit: 4096
        storageMibMax:
          limit: 10240
          current: 2048
        storageMibMaxPerInstance:
          limit: 5120
        buildsConcurrentMax:
          limit: 2
        autoscalingReplicasMax:

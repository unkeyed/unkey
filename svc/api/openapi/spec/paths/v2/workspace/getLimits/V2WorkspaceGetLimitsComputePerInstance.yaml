type: object
description: The maximum size of one instance.
required:
  - vCpus
  - memoryMib
  - storageMib
properties:
  vCpus:
    type: number
    format: double
    description: The maximum vCPUs for one instance.
    example: 2
  memoryMib:
    type: integer
    description: The maximum memory for one instance, in MiB.
    example: 4096
  storageMib:
    type: integer
    description: The maximum ephemeral disk for one instance, in MiB.
    example: 5120
additionalProperties: false

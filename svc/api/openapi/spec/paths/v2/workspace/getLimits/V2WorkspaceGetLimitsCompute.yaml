type: object
description: Limits for Compute.
required:
  - workspace
  - perInstance
  - concurrentBuilds
  - replicasPerRegion
  - customDomains
properties:
  workspace:
    "$ref": "./V2WorkspaceGetLimitsComputeWorkspace.yaml"
  perInstance:
    "$ref": "./V2WorkspaceGetLimitsComputePerInstance.yaml"
  concurrentBuilds:
    type: integer
    description: The maximum builds that run at the same time.
    example: 2
  replicasPerRegion:
    type: integer
    description: The maximum instances that autoscaling runs for one app in one region.
    example: 10
  customDomains:
    "$ref": "./V2WorkspaceGetLimitsCustomDomains.yaml"
additionalProperties: false

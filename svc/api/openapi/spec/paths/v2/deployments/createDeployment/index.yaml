post:
  tags:
    - deployments
  summary: Create deployment
  description: |
    Create a deployment for an app in a project.

    Provide exactly one source:
    - `image`: deploy a prebuilt Docker image as-is (no build).
    - `git`: build and deploy from the app's connected GitHub repository, a branch, a specific commit, or a fork commit. Requires the app to have a repository connected.
    - `deployment`: re-run an existing deployment by its id. Git-connected apps rebuild from the recorded commit; other apps reuse the recorded image.

    Returns immediately with a `deploymentId`. The build and rollout run asynchronously — poll `deployments.getDeployment` to watch status until it is ready.

    **Idempotency**: send an `Idempotency-Key` header to deduplicate retries. Two requests with the same key for the same app and environment create one deployment; the second returns the original `deploymentId` with the `Idempotent-Replayed: true` response header instead of creating a second deployment.

    - Use a random unique value, such as a UUID, and a fresh value for each new deployment intent. Do not construct keys by hand.
    - A key is scoped per workspace, app, and environment. The same key reused for a different target creates its own deployment there.
    - A key expires 12 hours after its first use. Reusing it later creates a new deployment.
    - Reusing a key with other body changes answers with the original deployment and ignores the changes. Send a new key when you change the request.
    - Omit the header to disable deduplication.

    **Authentication**: requires a root key with permission to create deployments.
  operationId: deployments.createDeployment
  x-speakeasy-name-override: createDeployment
  x-unkey-idempotency: conditionally-idempotent
  security:
    - bearer: []
  parameters:
    - name: Idempotency-Key
      in: header
      required: false
      description: Deduplicates retries of one deployment create. See the Idempotency section of the endpoint description for the full contract. At most 255 bytes.
      schema:
        type: string
        maxLength: 255
        example: 0191b1c2-8c3d-7e4f-a5b6-c7d8e9f0a1b2
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "./V2DeploymentsCreateDeploymentRequestBody.yaml"
  responses:
    "201":
      description: Deployment created, or replayed for a reused Idempotency-Key
      headers:
        Idempotent-Replayed:
          description: Present and `true` when the Idempotency-Key answered with the deployment it already created instead of creating a new one. The body is identical either way.
          schema:
            type: string
            enum: ["true"]
      content:
        application/json:
          schema:
            "$ref": "./V2DeploymentsCreateDeploymentResponseBody.yaml"
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "412":
      description: Precondition failed
      content:
        application/json:
          schema:
            "$ref": "../../../../error/PreconditionFailedErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

post:
  tags:
    - deployments
  summary: Stop deployment
  description: |
    Stop a running deployment. Stopped deployments keep their
    configuration and can be resumed later with `startDeployment`.

    The deployment must be ready and running. A deployment that is already
    draining from a previous stop is rejected with a precondition error.
    Stopping the current production deployment takes its domains offline
    until you start it again.

    Stopping is asynchronous: this endpoint only enqueues the stop and returns
    immediately. Poll `getDeployment` until the status reaches `stopped`.

    **Required Permissions**

    Your root key must have write permission on the deployment:
    - `unkey:v1:<workspace_id>:projects/<project_id>/apps/<app_id>/environments/<environment_id>/deployments/<deployment_id>#write`
  operationId: deployments.stopDeployment
  x-speakeasy-name-override: stopDeployment
  security:
    - bearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "./V2DeploymentsStopDeploymentRequestBody.yaml"
        examples:
          stop:
            summary: Stop a running deployment
            description: Spin down a deployment that is currently serving
            value:
              deploymentId: d_1234abcd
  responses:
    "202":
      description: |
        Stop accepted and enqueued. The deployment transitions to `stopped`
        asynchronously; poll `getDeployment` to observe the transition.
      content:
        application/json:
          schema:
            "$ref": "./V2DeploymentsStopDeploymentResponseBody.yaml"
          examples:
            accepted:
              summary: Stop enqueued
              value:
                meta:
                  requestId: req_1234abcd
                data: {}
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "403":
      description: Forbidden - Your root key can read the deployment but lacks the `stop_deployment` permission.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
    "404":
      description: |
        Not Found - The deployment does not exist in your workspace, or your
        root key cannot read it. Both cases return the same response, so
        deployment existence is never revealed. A root key that can read the
        deployment but lacks the `stop_deployment` permission receives 403 instead.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "412":
      description: |
        Precondition failed - The deployment is not running, or a stop is
        already in progress.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/PreconditionFailedErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

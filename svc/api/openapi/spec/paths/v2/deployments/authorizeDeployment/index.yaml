post:
  tags:
    - deployments
  summary: Authorize deployment
  description: |
    Authorize a deployment that is awaiting approval. Deployments from forked
    pull requests run code from outside your repository, so they wait for a
    project member to approve them before they build.

    The deployment must have the status `awaiting_approval`. Authorization is
    asynchronous: this endpoint only enqueues it and returns immediately. The
    deployment then moves to `pending` and starts its build. Poll
    `getDeployment` to follow its status. If the build cannot start, the
    deployment returns to `awaiting_approval`.

    **Required Permissions**

    Your root key must have the following permission:
    - `unkey:v1:<workspace_id>:projects/<project_id>/apps/<app_id>/environments/<environment_id>/deployments/<deployment_id>#write`
  operationId: deployments.authorizeDeployment
  x-speakeasy-name-override: authorizeDeployment
  x-unkey-idempotency: conditionally-idempotent
  security:
    - bearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "./V2DeploymentsAuthorizeDeploymentRequestBody.yaml"
        examples:
          authorize:
            summary: Authorize a fork pull request deployment
            description: Approve a deployment that is waiting for a project member
            value:
              deploymentId: d_1234abcd
  responses:
    "202":
      description: |
        Authorization accepted and enqueued. The deployment moves to `pending`
        and builds asynchronously; poll `getDeployment` to observe its status.
      content:
        application/json:
          schema:
            "$ref": "./V2DeploymentsAuthorizeDeploymentResponseBody.yaml"
          examples:
            accepted:
              summary: Build enqueued
              value:
                meta:
                  requestId: req_1234abcd
                data: {}
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
          examples:
            missingDeploymentId:
              summary: Missing deploymentId
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Bad Request
                  detail: POST request body for '/v2/deployments.authorizeDeployment' failed to validate schema
                  status: 400
                  type: https://unkey.com/docs/errors/unkey/application/invalid_input
                  errors:
                    - location: body
                      message: "missing properties: 'deploymentId'"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "404":
      description: |
        Not Found - The deployment does not exist in your workspace, or your
        root key cannot write to it. Both cases return the same response, so
        deployment existence is never revealed.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
          examples:
            notFound:
              summary: Deployment not found
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Not Found
                  detail: The requested deployment does not exist.
                  status: 404
                  type: https://unkey.com/docs/errors/unkey/data/deployment_not_found
    "412":
      description: |
        Precondition failed - The deployment is not awaiting approval, or the
        workspace has no Compute plan or is paused at its spend limit.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/PreconditionFailedErrorResponse.yaml"
          examples:
            notAwaitingApproval:
              summary: Deployment is not awaiting approval
              value:
                meta:
                  requestId: req_1234abcd
                error:
                  title: Precondition Failed
                  detail: The deployment is not awaiting approval. Its status is building.
                  status: 412
                  type: https://unkey.com/docs/errors/unkey/application/deployment_not_awaiting_approval
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

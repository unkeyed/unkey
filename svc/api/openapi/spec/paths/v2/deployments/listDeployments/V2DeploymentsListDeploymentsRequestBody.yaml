type: object
properties:
  project:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Restrict results to a single project, identified by its ID or slug.
      Required when filtering by `app`, `environment`, or `branch`.
  app:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Restrict results to a single app, identified by its ID or slug.
      Requires `project` to also be set.
  environment:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
    description: |
      Restrict results to a single environment, identified by its ID or slug.
      Requires `project` and `app` to also be set.
  status:
    type: array
    maxItems: 13
    items:
      "$ref": "../../../../common/DeploymentStatus.yaml"
    description: |
      Restrict results to deployments in any of the given lifecycle statuses.
      Omit to return deployments in every status.
    example: ["ready", "failed"]
  branch:
    type: array
    maxItems: 50
    items:
      type: string
      minLength: 1
      maxLength: 256
    description: |
      Restrict results to deployments built from any of the given git branches.
      Requires `project` and `app` to also be set. Omit or pass an empty list to
      return deployments from every branch.
    example: ["main", "feature/checkout"]
  startTime:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Return only deployments created at or after this unix timestamp in
      milliseconds (inclusive).
    example: 1704067200000
  endTime:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
    description: |
      Return only deployments created before this unix timestamp in
      milliseconds (exclusive). Must be later than `startTime` when both are
      set.
    example: 1704672000000
  limit:
    type: integer
    description: |
      Maximum number of deployments to return per request.
      Balance between response size and number of pagination calls needed.
    default: 100
    minimum: 1
    maximum: 100
  cursor:
    type: string
    description: |
      Pagination cursor from a previous response to fetch the next page.
      Use when `hasMore: true` in the previous response.
additionalProperties: false
description: |
  Filter deployments within a workspace. All filters are optional; with none
  set, every deployment in the workspace is returned, newest first.
examples:
  workspaceWide:
    summary: List all deployments in the workspace
    description: List the first page of deployments, newest first
    value: {}
  byProject:
    summary: List a project's deployments
    description: Restrict to a single project, located by slug
    value:
      project: payments-service
  byEnvironment:
    summary: List an environment's deployments
    description: Restrict to one environment, providing the full hierarchy
    value:
      project: payments-service
      app: payments-api
      environment: production
  byStatus:
    summary: List only failed or building deployments
    description: Filter across the workspace by lifecycle status
    value:
      status: ["failed", "building"]
  byBranchAndTime:
    summary: List an app's deployments for some branches in a time window
    description: Restrict to branches of one app, created within a week
    value:
      project: payments-service
      app: payments-api
      branch: ["main", "feature/checkout"]
      startTime: 1704067200000
      endTime: 1704672000000

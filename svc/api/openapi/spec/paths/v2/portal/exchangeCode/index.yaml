post:
  x-excluded: true
  tags:
    - portal
  summary: Exchange portal code
  description: |
    Consume a short-lived exchange code to issue a portal access token.

    This endpoint is unauthenticated. The exchange code itself serves as proof of authorization.
    Each code can only be exchanged once; subsequent attempts return 401.

    The returned access token is valid for 24 hours. The hosted portal stores it
    in an httpOnly cookie and uses its server-side proxy for subsequent requests.
  operationId: portal.exchangeCode
  x-speakeasy-name-override: exchangeCode
  security: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2PortalExchangeCodeRequestBody.yaml"
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            "$ref": "./V2PortalExchangeCodeResponseBody.yaml"
      description: |
        Exchange code consumed successfully. The hosted portal stores the returned access token in an httpOnly cookie.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
          description: Prevents caching of the access token response.
        Pragma:
          schema:
            type: string
            example: no-cache
          description: HTTP/1.0 backward-compatible cache prevention.
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized — session is invalid, expired, or already exchanged
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

type: object
required:
  - accessToken
  - expiresAt
properties:
  accessToken:
    type: string
    x-unkey-redact: true
    description: |
      The access token. Store this as an httpOnly cookie for subsequent portal requests.
    example: xyz789abc123def456
  expiresAt:
    type: integer
    format: int64
    description: |
      Unix timestamp in milliseconds when the access token expires (24 hours from the code exchange).
    example: 1711386400000
additionalProperties: false

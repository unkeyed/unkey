type: object
required:
  - accessToken
  - expiresAt
properties:
  accessToken:
    type: string
    x-unkey-redact: true
    description: |
      The portal access token. Store this as an httpOnly cookie for subsequent portal requests.
    example: pat_xyz789abc123
  expiresAt:
    type: integer
    format: int64
    description: |
      Unix timestamp in milliseconds when the access token expires (24 hours from creation).
    example: 1711386400000
additionalProperties: false

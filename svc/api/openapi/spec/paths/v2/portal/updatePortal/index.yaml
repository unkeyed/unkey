post:
  x-excluded: true
  tags:
    - portal
  summary: Update portal
  description: |
    Change a portal's slug, display name, the resource it serves, its enabled
    state, or its branding.

    Unreleased and subject to change without notice.

    Only the fields you send change. Omitting a field leaves it as it is, and for
    branding, sending null clears it. Send at most one of `keyspaceId` or `appId`.

    Two changes affect your end users immediately:
    - Re-pointing at a different resource revokes the portal's live sessions,
      because a session carries the scope it was minted with.
    - Disabling stops new sessions but leaves live ones running until they expire.

    **Required Permissions**

    Your root key must have one of:
    - `portal.*.update_portal` (to update any portal in the workspace)
    - `portal.<portal_id>.update_portal` (to update a specific portal)

    Without the permission this returns **404**, not 403.
  operationId: portal.updatePortal
  x-speakeasy-name-override: updatePortal
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2PortalUpdatePortalRequestBody.yaml"
    required: true
  responses:
    "200":
      description: |
        The portal as it now stands.
      content:
        application/json:
          schema:
            "$ref": "./V2PortalUpdatePortalResponseBody.yaml"
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "404":
      description: |
        No such portal, the named app or keyspace is not in your workspace, or
        your root key may not update it.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "409":
      description: |
        The new slug is taken in your workspace, or the named app or keyspace
        already backs another portal.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ConflictErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

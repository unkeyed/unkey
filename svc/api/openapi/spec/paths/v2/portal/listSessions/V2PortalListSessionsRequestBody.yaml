type: object
required:
  - portal
properties:
  portal:
    "$ref": "../../../../common/ResourceIdentifier.yaml"
  limit:
    type: integer
    description: Maximum number of end users to return per request.
    default: 100
    minimum: 1
    maximum: 100
  cursor:
    type: string
    description: |
      Pagination cursor from a previous response to fetch the next page.
      Use when `hasMore: true` in the previous response.
    example: user_123
  search:
    type: string
    maxLength: 256
    description: |
      Returns only end users whose `externalId` starts with this string.
      Matching is case-sensitive, and `%` and `_` match literally.
    example: user_
additionalProperties: false
examples:
  byId:
    summary: List by portal id
    value:
      portal: pc_1234abcd
  bySlugWithSearch:
    summary: Search by portal slug
    value:
      portal: acme-portal
      search: user_
      limit: 20

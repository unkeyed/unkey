post:
  x-excluded: true
  tags:
    - portal
  summary: Get portal domain
  description: |
    Read one custom domain attached to a portal, with its verification status and DNS records.

    Unreleased and subject to change without notice.

    **Required Permissions**

    Your root key must have one of:
    - `portal.*.read_portal` (to read domains on any portal in the workspace)
    - `portal.<portal_id>.read_portal` (to read domains on a specific portal)
    - `portal.*.update_portal` or `portal.<portal_id>.update_portal`, so a key that
      creates a domain can poll it

    Without the permission this returns **404**, not 403.
  operationId: portal.getDomain
  x-speakeasy-name-override: getDomain
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2PortalGetDomainRequestBody.yaml"
    required: true
  responses:
    "200":
      description: The portal domain.
      content:
        application/json:
          schema:
            "$ref": "./V2PortalGetDomainResponseBody.yaml"
          examples:
            verified:
              summary: Domain serving the portal
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  id: pdom_1234abcd
                  portalId: prt_1234abcd
                  domain: portal.acme.com
                  status: verified
                  dnsRecords:
                    - type: CNAME
                      name: portal.acme.com
                      value: a1b2c3d4e5f6g7h8.portal.unkey.com
                      ttl: 60
                      verified: true
                      note: Create as DNS-only if your provider offers the choice.
                    - type: TXT
                      name: _unkey.portal.acme.com
                      value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
                      ttl: 60
                      verified: false
                      note: Proves ownership. Create it alongside the routing record.
                  createdAt: 1704067200000
                  updatedAt: 1704067260000
            failed:
              summary: Verification stopped
              description: The records never appeared. Fix them, then call portal.verifyDomain.
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  id: pdom_1234abcd
                  portalId: prt_1234abcd
                  domain: portal.acme.com
                  status: failed
                  verificationError: domain verification timed out after 24 hours
                  dnsRecords:
                    - type: CNAME
                      name: portal.acme.com
                      value: a1b2c3d4e5f6g7h8.portal.unkey.com
                      ttl: 60
                      verified: false
                      note: Create as DNS-only if your provider offers the choice.
                    - type: TXT
                      name: _unkey.portal.acme.com
                      value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
                      ttl: 60
                      verified: false
                      note: Proves ownership. Create it alongside the routing record.
                  createdAt: 1704067200000
                  updatedAt: 1704153600000
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "404":
      description: |
        No such portal or domain on that portal, or your root key may not read the portal.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

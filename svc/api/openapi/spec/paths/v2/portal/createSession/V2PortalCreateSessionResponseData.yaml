type: object
required:
  - sessionId
  - url
properties:
  sessionId:
    type: string
    description: |
      The stable, non-secret identifier for the portal session.
    example: ps_abc123def
  url:
    type: string
    format: uri
    # Carries the exchange code as a query parameter.
    x-unkey-redact: true
    description: |
      The full portal URL with the exchange code in its query string. Redirect the end user to this URL.
    example: "https://portal.unkey.com/?code=abc123def456ghi789"
additionalProperties: false

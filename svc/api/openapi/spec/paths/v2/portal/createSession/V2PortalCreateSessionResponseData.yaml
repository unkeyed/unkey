type: object
required:
  - id
  - url
properties:
  id:
    type: string
    description: |
      The portal session's identifier. Not a credential: it is safe to log and
      to store against your own records of the end user's visit.
    example: ps_abc123def456
  url:
    type: string
    format: uri
    # Carries the single-use exchange code as a query parameter, so it is a
    # credential in its own right.
    x-unkey-redact: true
    description: |
      The full portal URL to redirect the end user to. Carries a single-use
      exchange code that is valid for 15 minutes.
    example: "https://portal.unkey.com/?code=pst_abc123def456"
additionalProperties: false

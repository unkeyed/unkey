post:
  x-excluded: true
  tags:
    - portal
  summary: Create portal session
  description: |
    Create a portal session for an end user and get the URL to redirect them to.

    The URL carries a single-use exchange code valid for 15 minutes, which the portal
    redeems exactly once for a 24-hour access token via `portal.exchangeCode`.

    **Required Permissions**

    Your root key must be associated with a workspace that has an enabled portal.
  operationId: portal.createSession
  x-speakeasy-name-override: createSession
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2PortalCreateSessionRequestBody.yaml"
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            "$ref": "./V2PortalCreateSessionResponseBody.yaml"
      description: |
        Session created successfully. Redirect the end user to the returned URL.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
          description: Prevents caching of the response, which carries an exchange code.
        Pragma:
          schema:
            type: string
            example: no-cache
          description: HTTP/1.0 backward-compatible cache prevention.
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

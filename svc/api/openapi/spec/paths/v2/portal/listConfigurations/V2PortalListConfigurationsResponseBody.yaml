type: object
required:
  - meta
  - data
properties:
  meta:
    "$ref": "../../../../common/Meta.yaml"
  data:
    type: array
    items:
      "$ref": "../../../../common/PortalConfiguration.yaml"
    description: Array of portal configurations in the workspace, newest first.
additionalProperties: false
examples:
  configList:
    summary: Configuration list
    description: Typical response listing a workspace's portal configurations
    value:
      meta:
        requestId: req_1234abcd
      data:
        - id: pc_1234abcd
          slug: my-portal
          keyspaceId: ks_1234abcd
          enabled: true
          branding:
            logoUrl: "https://cdn.example.com/logo.png"
            primaryColor: "#4f46e5"
          createdAt: 1704067200000
        - id: pc_5678efgh
          slug: billing-portal
          appId: app_1234abcd
          enabled: false
          createdAt: 1704240000000
  emptyResponse:
    summary: Empty configuration list
    description: Response when the workspace has no portal configurations
    value:
      meta:
        requestId: req_9876zyxw
      data: []

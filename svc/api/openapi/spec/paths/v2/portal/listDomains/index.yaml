post:
  x-excluded: true
  tags:
    - portal
  summary: List portal domains
  description: |
    List the custom domains attached to a portal, with their verification status and DNS records.

    Unreleased and subject to change without notice.

    **Required Permissions**

    Your root key must have one of:
    - `portal.*.read_portal` (to read domains on any portal in the workspace)
    - `portal.<portal_id>.read_portal` (to read domains on a specific portal)
    - `portal.*.update_portal` or `portal.<portal_id>.update_portal`, so a key that
      creates a domain can poll it

    Without the permission this returns **404**, not 403.
  operationId: portal.listDomains
  x-speakeasy-name-override: listDomains
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2PortalListDomainsRequestBody.yaml"
    required: true
  responses:
    "200":
      description: The portal's domains.
      content:
        application/json:
          schema:
            "$ref": "./V2PortalListDomainsResponseBody.yaml"
          examples:
            twoDomains:
              summary: One verified, one still verifying
              value:
                meta:
                  requestId: req_1234abcd
                data:
                  - id: pdom_1234abcd
                    portalId: prt_1234abcd
                    domain: portal.acme.com
                    status: verified
                    dnsRecords:
                      - type: CNAME
                        name: portal.acme.com
                        value: a1b2c3d4e5f6g7h8.portal.unkey.com
                        ttl: 60
                        verified: true
                        note: Create as DNS-only if your provider offers the choice.
                      - type: TXT
                        name: _unkey.portal.acme.com
                        value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
                        ttl: 60
                        verified: false
                        note: Proves ownership. Create it alongside the routing record.
                    createdAt: 1704067200000
                    updatedAt: 1704067260000
                  - id: pdom_5678efgh
                    portalId: prt_1234abcd
                    domain: help.acme.com
                    status: verifying
                    dnsRecords:
                      - type: CNAME
                        name: help.acme.com
                        value: h8g7f6e5d4c3b2a1.portal.unkey.com
                        ttl: 60
                        verified: false
                        note: Create as DNS-only if your provider offers the choice.
                      - type: TXT
                        name: _unkey.help.acme.com
                        value: unkey-domain-verify=9LhJ4bY6wR2nT5vP7mK1xQ8Z
                        ttl: 60
                        verified: false
                        note: Proves ownership. Create it alongside the routing record.
                    createdAt: 1704070800000
                    updatedAt: 1704070860000
            empty:
              summary: No domains attached
              value:
                meta:
                  requestId: req_1234abcd
                data: []
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "404":
      description: |
        No such portal, or your root key may not read it.
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            "$ref": "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

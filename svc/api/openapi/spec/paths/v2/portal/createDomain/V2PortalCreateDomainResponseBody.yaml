type: object
required:
  - meta
  - data
properties:
  meta:
    "$ref": "../../../../common/Meta.yaml"
  data:
    "$ref": "./V2PortalCreateDomainResponseData.yaml"
additionalProperties: false
examples:
  subdomain:
    summary: Subdomain attached
    value:
      meta:
        requestId: req_1234abcd
      data:
        domainId: pdom_1234abcd
        dnsRecords:
          - type: CNAME
            name: portal.acme.com
            value: a1b2c3d4e5f6g7h8.portal.unkey.com
            ttl: 60
            verified: false
            note: Create as DNS-only if your provider offers the choice.
          - type: TXT
            name: _unkey.portal.acme.com
            value: unkey-domain-verify=3ZQ8xK1mP7vT5nR2wY6bJ4hL
            ttl: 60
            verified: false
            note: Proves ownership. Create it alongside the routing record.

type: object
required:
  - configId
properties:
  configId:
    type: string
    maxLength: 64
    description: |
      The identifier of the portal configuration to delete. Always begins with
      'pc_'.
    example: pc_1234abcd
additionalProperties: false
examples:
  delete:
    summary: Delete a configuration
    description: Delete a portal configuration and its branding
    value:
      configId: pc_1234abcd

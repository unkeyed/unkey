type: object
required:
  - apiId
properties:
  apiId:
    type: string
    minLength: 1
    description: |
      The API namespace whose keys to list. Results are always restricted to the
      keys owned by the authenticated portal session's end user; the session
      identity is authoritative and cannot be overridden from the request.
    example: api_1234abcd
  limit:
    type: integer
    description: |
      Maximum number of keys to return per request.
      Balance between response size and number of pagination calls needed.
    default: 100
    minimum: 1
    maximum: 100
  cursor:
    type: string
    description: |
      Pagination cursor from a previous response to fetch the next page.
      Use when `hasMore: true` in the previous response.
    example: key_1234abcd
additionalProperties: false
examples:
  basic:
    summary: List the end user's keys
    description: List the portal end user's keys in an API namespace
    value:
      apiId: api_1234abcd

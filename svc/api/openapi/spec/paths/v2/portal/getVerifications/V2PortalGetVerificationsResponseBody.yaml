type: object
required:
  - meta
  - data
properties:
  meta:
    $ref: "../../../../common/Meta.yaml"
  data:
    type: array
    description: |
      Zero-filled verification timeseries for the authenticated end user, ordered
      by time ascending. Buckets with no verifications are present with zero
      counts so the series is contiguous across the requested window.
    items:
      $ref: "./V2PortalGetVerificationsDataPoint.yaml"
  keys:
    type: array
    description: |
      Per-key breakout of the same window, present only when `perKey` was
      requested. Keys with no verifications in the window are omitted, as are
      empty buckets within a key's series.

      Entries come from the verification events themselves, so the breakout
      always sums to `data`. A `keyId` may therefore name a key that has since
      been deleted and will not appear in `portal.listKeys`; render those
      totals without assuming the key is still listable.
    items:
      $ref: "./V2PortalGetVerificationsKeySeries.yaml"
additionalProperties: false

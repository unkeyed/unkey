post:
  tags:
    - portal
  summary: Update portal configuration
  description: |
    Update a Customer Portal configuration. This replaces the configuration's
    mutable state: slug, enabled, return URL, keyspace/app mapping, and branding.

    A configuration maps to exactly one keyspace (`keyspaceId`) or one app
    (`appId`) - provide exactly one. Changing it remaps the configuration.

    **Important**: The slug must remain unique within your workspace, and the
    mapped keyspace or app must not already be used by another configuration. A
    collision returns a 409 conflict.

    **Authentication**

    Requires a root key. Only configurations in the root key's workspace can be
    updated.
  operationId: portal.updateConfiguration
  x-speakeasy-name-override: updateConfiguration
  # Unlaunched: kept out of the published docs (Mintlify honors
  # x-excluded). Deliberately no x-speakeasy-ignore, so the operation still
  # generates into the SDK that web/apps/portal builds against.
  x-excluded: true
  security:
    - bearer: []
  requestBody:
    content:
      application/json:
        schema:
          "$ref": "./V2PortalUpdateConfigurationRequestBody.yaml"
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            "$ref": "./V2PortalUpdateConfigurationResponseBody.yaml"
      description: |
        Portal configuration updated successfully.
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "../../../../error/BadRequestErrorResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "../../../../error/UnauthorizedErrorResponse.yaml"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ForbiddenErrorResponse.yaml"
    "404":
      description: Not Found - no configuration with this id in the workspace
      content:
        application/json:
          schema:
            "$ref": "../../../../error/NotFoundErrorResponse.yaml"
    "409":
      description: Conflict - a configuration with this slug, keyspace, or app already exists
      content:
        application/json:
          schema:
            "$ref": "../../../../error/ConflictErrorResponse.yaml"
    "429":
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: "../../../../error/TooManyRequestsErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "../../../../error/InternalServerErrorResponse.yaml"

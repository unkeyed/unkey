type: object
additionalProperties: false
properties:
  cursor:
    description: |
      Pagination cursor from a previous response. Include this when fetching the next page.
      For gap-free incremental sync, keep polling with the latest cursor; the watermark only moves forward.
    type: string
    minLength: 1
    maxLength: 1024
  limit:
    description: |
      Maximum number of audit events to return in a single response.
      Results exceeding this limit are paginated, with a cursor provided for fetching subsequent pages.
    type: integer
    default: 100
    minimum: 1
    maximum: 500
  start:
    description: |
      Only return events at or after this time (RFC3339 / ISO 8601, UTC).
      Intended for one-time backfill windows; ongoing sync should follow the cursor instead.
      Clamped to your plan's audit-log retention.
    type: string
    format: date-time
    example: "2026-08-01T00:00:00Z"
  end:
    description: |
      Only return events at or before this time (RFC3339 / ISO 8601, UTC).
    type: string
    format: date-time
    example: "2026-08-13T00:00:00Z"
  event:
    description: |
      Restrict results to these event types (e.g. `key.create`, `api.delete`). Matches any of the listed values.
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 256
  actorId:
    description: Restrict results to events performed by this actor (root key id, user id, or system identifier).
    type: string
    minLength: 1
    maxLength: 256
  resourceType:
    description: Restrict results to events touching a resource of this type (e.g. `key`, `api`, `identity`).
    type: string
    minLength: 1
    maxLength: 256

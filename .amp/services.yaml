services:
  dashboard:
    command: >-
      "$HOME/.local/bin/mise" run dashboard
    port: 3000
    portal:
      title: Dashboard
      description: Local dashboard with seeded data and local authentication.

  api:
    command: >-
      python3 -u .amp/service-proxy.py "$PORT" 7070
    port: 17070
    portal:
      title: Unkey API
      description: Local API from the dashboard's Docker Compose stack.

  vault:
    command: >-
      python3 -u .amp/service-proxy.py "$PORT" 8060
    port: 18060
    portal:
      title: Vault RPC
      description: Local Vault Connect RPC service from the dashboard stack.

  portal:
    command: >-
      "$HOME/.local/bin/mise" exec --
      pnpm --dir=web --filter=@unkey/portal exec
      vite dev --host 0.0.0.0 --port "$PORT"
    port: 3100
    portal:
      title: API Portal
      description: API portal backed by the dashboard's local development stack.

  design:
    command: >-
      "$HOME/.local/bin/mise" exec --
      pnpm --dir=web --filter=@unkey/design exec
      astro dev --host 0.0.0.0 --port "$PORT"
    port: 4321
    portal:
      title: Design System
      description: Unkey UI components and design patterns.

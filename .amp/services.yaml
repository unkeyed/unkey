services:
  dev:
    command: >-
      "$HOME/.local/bin/mise" run dev-orb
    port: 10350
    portal:
      title: Tilt
      description: Reduced Deploy development stack running in minikube.

  dashboard:
    command: >-
      python3 -u .amp/service-proxy.py "$PORT" 3000
    port: 13000
    portal:
      title: Dashboard
      description: Local dashboard with seeded data and local authentication.

  api:
    command: >-
      python3 -u .amp/service-proxy.py "$PORT" 7070
    port: 17070
    health: /health/live
    portal:
      title: Unkey API
      url: /v2/liveness
      description: Local API from the minikube Deploy stack.

  vault:
    command: >-
      python3 -u .amp/service-proxy.py "$PORT" 8060
    port: 18060
    health: /health/live
    portal:
      title: Vault RPC
      url: /health/live
      description: Local Vault Connect RPC service from the minikube stack.

  control-api:
    command: >-
      python3 -u .amp/service-proxy.py "$PORT" 7091
    port: 17091
    health: /health/live
    portal:
      title: Control API
      url: /health/live
      description: Local Deploy control-plane API from the minikube stack.

  deployment:
    command: >-
      python3 -u .amp/frontline-portal.py
      "$PORT" "$PUBLIC_URL" local-api-production-local.unkey.local
    port: 19080
    health: /_unkey/internal/health/ready
    portal:
      title: Deployed Local API
      description: Active production deployment routed through Frontline.

  portal:
    command: >-
      "$HOME/.local/bin/mise" exec --
      pnpm --dir=web --filter=@unkey/portal exec
      vite dev --host 0.0.0.0 --port "$PORT"
    port: 3100
    portal:
      title: API Portal
      description: API portal backed by the local Kubernetes API.

  design:
    command: >-
      "$HOME/.local/bin/mise" exec --
      pnpm --dir=web --filter=@unkey/design exec
      astro dev --host 0.0.0.0 --port "$PORT"
    port: 4321
    portal:
      title: Design System
      description: Unkey UI components and design patterns.

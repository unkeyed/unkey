[settings]
auto_install = false
disable_default_registry = true
exec_auto_install = false
lockfile = true
locked = true
locked_verify_provenance = true
not_found_auto_install = false
pin = true
provenance_api_failures_fatal = true
task.run_auto_install = false

[env]
GOTOOLCHAIN = "local"

[tools]
node = "24.21.0"
go = "1.27.2"
"github:dprint/dprint" = "0.51.1"
"github:bufbuild/buf" = "1.64.0"
"github:jqlang/jq" = "jq-1.8.2"
"github:tilt-dev/tilt" = "0.37.8"
"github:tilt-dev/ctlptl" = "0.9.6"
"github:FiloSottile/mkcert" = "1.4.4"
"github:planetscale/cli" = "0.284.0"
"github:depot/cli" = "2.101.67"
"github:chronark/rask" = "0.7.0"
"github:golangci/golangci-lint" = "2.13.2"
"github:goreleaser/goreleaser-pro" = "2.15.4"
"github:pnpm/pnpm" = "11.28.5"
"github:speakeasy-api/speakeasy" = "1.790.1"
# Mintlify CLI for the product docs site (docs); see mise tasks docs-*.
"npm:mint" = "4.2.866"
# stripe CLI: only used by the local-dev billing-flow runbooks (stripe login /
# stripe listen). The pricing tool itself is pure SDK and does not need it.
"aqua:stripe/stripe-cli" = "1.53.1"

[tools."github:kubernetes/minikube"]
version = "1.39.0"
rename_exe = "minikube"

[tools."http:kubectl"]
version = "1.37.1"
bin = "kubectl"


name: Bazel
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Build and Test
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - name: Install mise
        run: |
          ./dev/install-mise
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install toolchain
        run: mise install --locked --yes
      - name: Build
        run: mise run build
      - name: Run tests
        run: mise run test

name: eBPF Drift Check
# Catches the silent case where a developer edits network.bpf.c but forgets
# to run `mise run generate-bpf`. Without this check the committed bpf_bpfel.{go,o}
# would go out of sync with the C source, and heimdall would silently run
# stale eBPF against new userspace bindings (billing data bug).
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Regenerate and diff
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: ./.depot/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Cache generator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: svc/heimdall/internal/network/bpf/Dockerfile.gen
          platforms: linux/amd64
          load: true
          tags: unkey-bpf-gen
          cache-from: type=gha,scope=bpf-generator
          cache-to: type=gha,scope=bpf-generator,mode=max
      - name: Cache generator Go dependencies and builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/unkey-bpf
          key: bpf-go-linux-amd64-${{ github.event_name }}-${{ hashFiles('.mise/config.toml', '.mise/mise.lock', 'go.sum', 'svc/heimdall/internal/network/bpf/Dockerfile.gen') }}
      - name: Regenerate eBPF bindings
        run: mise run generate-bpf
      - name: Assert no drift
        run: |
          if ! git diff --exit-code --stat -- svc/heimdall/internal/network; then
            echo "::error::eBPF artifacts are out of sync with network.bpf.c."
            echo "Run 'mise run generate-bpf' locally and commit the result."
            exit 1
          fi

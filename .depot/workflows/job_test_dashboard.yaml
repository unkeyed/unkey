name: Test Dashboard
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Test Dashboard
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: ./.depot/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        id: test
        run: |
          set -o pipefail
          mise run test-web -- --filter=@unkey/dashboard 2>&1 | tee test.log
        env:
          CI: 1
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (WorkOS)
        run: mise run build-web -- --filter=@unkey/dashboard
        env:
          CI: 1
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_PRIMARY: mysql://unkey:password@localhost:8080/unkey
          UNKEY_WORKSPACE_ID: "not-empty"
          UNKEY_API_ID: "not-empty"
          VAULT_URL: "http://localhost:8060"
          VAULT_TOKEN: "not-empty"
          AUTH_PROVIDER: "workos"
          WORKOS_CLIENT_ID: "client_"
          WORKOS_API_KEY: "sk_test_"
          WORKOS_COOKIE_PASSWORD: "ci-test-cookie-password-min-32-chars"
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: "http://localhost:3000/auth/sso-callback"
      - name: Build (local)
        run: mise run build-web -- --filter=@unkey/dashboard
        env:
          CI: 1
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_PRIMARY: mysql://unkey:password@localhost:8080/unkey
          UNKEY_WORKSPACE_ID: "not-empty"
          UNKEY_API_ID: "not-empty"
          VAULT_URL: "http://localhost:8060"
          VAULT_TOKEN: "not-empty"
          AUTH_PROVIDER: "local"
      - name: Triage flaky test
        if: failure() && steps.test.outcome == 'failure'
        uses: ./.depot/actions/triage-flaky-test
        with:
          amp-api-key: ${{ secrets.AMP_FLAKY_TRIAGE_API_KEY }}
          log-file: test.log

name: DeepSec
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
concurrency:
  group: deepsec-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - name: Decide whether to review
        id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          RUNS_AUTOMATIC_MAX: 2
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: issue_number,
            });
            core.setOutput('pr_number', pr.number);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.notice('Skipping a pull request from a fork.');
              return;
            }
            if (pr.state !== 'open') {
              core.notice('Skipping a closed pull request.');
              return;
            }
            if (context.eventName === 'pull_request') {
              if (pr.draft) {
                core.notice('Skipping a draft pull request. DeepSec runs once it is ready for review.');
                return;
              }
              const marker = '<!-- unkey-deepsec -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number, per_page: 100,
              });
              const previous = comments.find(comment =>
                comment.user?.login === 'depot-code-access[bot]' && comment.body?.startsWith(marker)
              );
              const runsAutomatic = previous
                ? Number(previous.body.match(/<!-- unkey-deepsec-automatic-runs: (\d+) -->/)?.[1] ?? 1)
                : 0;
              const runsAutomaticMax = Number(process.env.RUNS_AUTOMATIC_MAX);
              if (runsAutomatic >= runsAutomaticMax) {
                core.notice(`DeepSec already reviewed this pull request ${runsAutomatic} times automatically. Run the DeepSec workflow manually to review again.`);
                return;
              }
            }
            core.setOutput('run', 'true');
  analyze:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 35
    continue-on-error: true
    outputs:
      scan_result: ${{ steps.scan.outcome }}
      job_url: ${{ steps.depot.outputs.url }}
    steps:
      - name: Record scan job link
        id: depot
        run: echo "url=$DEPOT_JOB_URL" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - name: Require trusted scanner configuration
        run: |
          if [ ! -f .deepsec/deepsec.config.ts ]; then
            echo '::error::DeepSec must be merged into the base branch before CI scans can run. PR configuration is not trusted.'
            exit 1
          fi
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: review-source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.depot/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare scanner
        env:
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          FILES_MAX: 40
          PRIORITY_PATTERN: ^(svc/(api|frontline|vault|ctrl)/|internal/services/(keys|portal|ratelimit|usagelimiter)/|pkg/(auth|db|encryption|jwt|paseto|prefixedapikey|rbac|redaction|ssrf|tls|webhook|zen)/|web/apps/dashboard/(lib/(trpc|auth)/|app/(api|auth|proxy)/|proxy[.]ts$|.*/actions[.]ts$)|web/apps/portal/src/(lib|routes)/)
        run: |
          mise exec -- pnpm --dir .deepsec install --frozen-lockfile --ignore-scripts
          merge_base=$(git -C review-source merge-base "$BASE_SHA" "$HEAD_SHA")
          git -C review-source diff --name-only --diff-filter=ACMR "$merge_base" "$HEAD_SHA" -- \
            . ':!gen/**' ':!**/node_modules/**' ':!**/dist/**' ':!**/vendor/**' \
            ':!**/*.generated.*' ':!**/*_generated.*' ':!**/*.pb.go' \
            ':!**/pnpm-lock.yaml' ':!go.sum' ':!web/apps/agent/gen/**' \
            ':!*_test.go' ':!**/testdata/**' ':!*.md' ':!*.mdx' \
            | awk -v priority="$PRIORITY_PATTERN" '
                { tier = 3 }
                /[.](go|ts|tsx|js|mjs|sql|proto|c|h)$/ { tier = $0 ~ priority ? 1 : 2 }
                { print tier "\t" $0 }' \
            | sort -s -n -k1,1 | cut -f2- > .deepsec/ranked.txt
          head -n "$FILES_MAX" .deepsec/ranked.txt > .deepsec/files.txt
          tail -n "+$((FILES_MAX + 1))" .deepsec/ranked.txt > .deepsec/skipped.txt
          git -C review-source diff -U0 --no-color --no-ext-diff --src-prefix=a/ --dst-prefix=b/ --diff-filter=ACMR "$merge_base" "$HEAD_SHA" \
            | mise exec -- node -e '
              const fs = require("node:fs");
              const files = new Set(fs.readFileSync(".deepsec/files.txt", "utf8").split("\n").filter(Boolean));
              const ranges = {};
              let file = null;
              for (const line of fs.readFileSync(0, "utf8").split("\n")) {
                if (line.startsWith("+++ ")) {
                  file = line.startsWith("+++ b/") ? line.slice(6) : null;
                  continue;
                }
                const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/.exec(line);
                if (!hunk || file === null || !files.has(file)) continue;
                const start = Number(hunk[1]);
                const count = hunk[2] === undefined ? 1 : Number(hunk[2]);
                (ranges[file] ??= []).push(count === 0 ? { start, end: start + 1, deleted: true } : { start, end: start + count - 1 });
              }
              fs.writeFileSync(".deepsec/changed-lines.json", JSON.stringify(ranges));
            '
      - name: Review changed files
        id: scan
        timeout-minutes: 25
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.DEEPSEC_VERCEL_GATEWAY_KEY }}
          CHUNK_SIZE: 10
          CHUNK_TIMEOUT: 23m
          CHANGE_MARGIN_LINES: 3
        working-directory: .deepsec
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo '::error::Set the DEEPSEC_VERCEL_GATEWAY_KEY Depot CI secret to enable reviews.'
            exit 2
          fi
          mkdir chunks
          if [ -s files.txt ]; then
            split -l "$CHUNK_SIZE" -d -a 3 files.txt chunks/files-
          fi
          # Each chunk gets its own data root so a failed or timed-out chunk
          # cannot lose findings from the others.
          pids=()
          lists=()
          for list in chunks/files-*; do
            [ -e "$list" ] || continue
            mkdir -p "$list.data"
            cp -R data/unkey "$list.data/"
            mise exec -- node -e '
              const fs = require("node:fs");
              const [list, out] = process.argv.slice(1);
              const ranges = JSON.parse(fs.readFileSync("changed-lines.json", "utf8"));
              const scope = fs.readFileSync(list, "utf8").split("\n").filter(Boolean).map((file) => {
                const lines = (ranges[file] ?? []).map((r) =>
                  r.deleted ? `L${r.start}-L${r.end} (code removed between these lines)` : r.start === r.end ? `L${r.start}` : `L${r.start}-L${r.end}`
                );
                return `- \`${file}\`: ${lines.length > 0 ? lines.join(", ") : "no changed lines"}`;
              });
              const promptAppend = [
                "## Review scope",
                "",
                "This is a pull request review. Report only vulnerabilities that the changed lines below introduce, or that they make newly reachable.",
                "Read unchanged code for context, but do not report issues that exist independently of this change.",
                "Every finding must include at least one changed line in lineNumbers. Findings that cite no changed line are discarded.",
                "",
                "Changed lines, as line numbers in the new version of each file:",
                ...scope,
              ].join("\n");
              fs.writeFileSync(out, JSON.stringify({ promptAppend }));
            ' "$list" "$list.data/unkey/config.json"
            DEEPSEC_DATA_ROOT="$list.data" timeout --kill-after=30s "$CHUNK_TIMEOUT" \
              mise exec -- node_modules/.bin/deepsec process \
                --root "$GITHUB_WORKSPACE/review-source" \
                --project-id unkey \
                --concurrency 2 \
                --files-from "$list" \
                --comment-out "$list.md" \
                > "$list.log" 2>&1 &
            pids+=("$!")
            lists+=("$list")
          done
          incomplete=()
          found=()
          for i in "${!pids[@]}"; do
            list=${lists[$i]}
            if wait "${pids[$i]}"; then status=0; else status=$?; fi
            echo "::group::$(basename "$list") (exit $status)"
            cat "$list.log"
            echo '::endgroup::'
            if [ "$status" -eq 0 ]; then
              continue
            elif [ "$status" -eq 1 ] && [ -s "$list.md" ]; then
              found+=("$list.data")
            else
              incomplete+=("$list")
            fi
          done
          reviewed=$(($(wc -l < files.txt)))
          skipped=$(($(wc -l < skipped.txt)))
          {
            if [ "${#incomplete[@]}" -gt 0 ]; then
              echo '**Incomplete review.** A scan chunk failed or timed out, so these files were not fully reviewed:'
              echo
              cat "${incomplete[@]}" | sed 's/.*/- `&`/'
              echo
            fi
            if [ "$skipped" -gt 0 ]; then
              echo "**Partial review.** This PR changes $((reviewed + skipped)) eligible files. DeepSec reviewed the $reviewed highest-priority files and skipped the rest."
              echo
              echo '<details><summary>Skipped files</summary>'
              echo
              sed 's/.*/- `&`/' skipped.txt
              echo
              echo '</details>'
              echo
            fi
            if [ "${#found[@]}" -gt 0 ]; then
              mise exec -- node -e '
                const fs = require("node:fs");
                const path = require("node:path");
                const ranges = JSON.parse(fs.readFileSync("changed-lines.json", "utf8"));
                const margin = Number(process.env.CHANGE_MARGIN_LINES);
                const severities = ["CRITICAL", "HIGH", "MEDIUM", "HIGH_BUG", "BUG", "LOW"];
                const badges = { CRITICAL: "🔴 CRITICAL", HIGH: "🟠 HIGH", MEDIUM: "🟡 MEDIUM", HIGH_BUG: "🟣 HIGH BUG", BUG: "🟣 BUG", LOW: "⚪ LOW" };
                const verdictsHidden = new Set(["accepted-risk", "false-positive", "fixed", "duplicate"]);
                const truncate = (s, max) => (s.length <= max ? s : `${s.slice(0, max - 1).trimEnd()}…`);
                const kept = [];
                let dropped = 0;
                for (const root of process.argv.slice(1)) {
                  const dir = path.join(root, "unkey", "files");
                  if (!fs.existsSync(dir)) continue;
                  for (const name of fs.readdirSync(dir, { recursive: true })) {
                    if (!name.endsWith(".json")) continue;
                    const record = JSON.parse(fs.readFileSync(path.join(dir, name), "utf8"));
                    const changed = ranges[record.filePath] ?? [];
                    for (const finding of record.findings ?? []) {
                      if (verdictsHidden.has(finding.revalidation?.verdict)) continue;
                      const onChange = (finding.lineNumbers ?? []).some((n) => changed.some((r) => n >= r.start - margin && n <= r.end + margin));
                      if (onChange) kept.push({ file: record.filePath, finding });
                      else dropped++;
                    }
                  }
                }
                kept.sort((a, b) =>
                  severities.indexOf(a.finding.severity) - severities.indexOf(b.finding.severity) ||
                  a.file.localeCompare(b.file) ||
                  a.finding.title.localeCompare(b.finding.title)
                );
                const lines = [];
                if (kept.length === 0) {
                  lines.push("No new findings on or near the changed lines.");
                } else {
                  const counts = severities.filter((s) => kept.some((k) => k.finding.severity === s))
                    .map((s) => `${badges[s]} ×${kept.filter((k) => k.finding.severity === s).length}`);
                  lines.push(`### DeepSec found ${kept.length} finding${kept.length === 1 ? "" : "s"} on or near changed lines`, "", counts.join(" · "), "");
                  for (const { file, finding } of kept) {
                    const n = finding.lineNumbers;
                    const ref = n.length > 1 ? `:L${n[0]}-L${n[n.length - 1]}` : `:L${n[0]}`;
                    lines.push(`#### ${badges[finding.severity]} · \`${file}${ref}\``, "", `**${finding.title}**`);
                    lines.push(`<sub>slug: \`${finding.vulnSlug}\` · confidence: ${finding.confidence}</sub>`, "");
                    if (finding.description) lines.push(truncate(finding.description, 600), "");
                    if (finding.recommendation) lines.push(`**Recommendation:** ${truncate(finding.recommendation, 400)}`, "");
                    lines.push("---", "");
                  }
                }
                if (dropped > 0) {
                  lines.push(`<sub>Omitted ${dropped} finding${dropped === 1 ? "" : "s"} more than ${margin} lines from a change.</sub>`);
                }
                console.log(lines.join("\n"));
              ' "${found[@]}"
            elif [ "$reviewed" -gt 0 ]; then
              echo 'No new findings in the files that were reviewed.'
            else
              echo 'No eligible files to review.'
            fi
            if [ "${#lists[@]}" -gt 0 ]; then
              echo
              mise exec -- node -e '
                const fs = require("node:fs");
                const path = require("node:path");
                let usd = 0;
                const tokens = { input: 0, cached: 0, output: 0 };
                const models = new Set();
                for (const root of process.argv.slice(1)) {
                  const dir = path.join(root, "unkey", "files");
                  if (!fs.existsSync(dir)) continue;
                  for (const name of fs.readdirSync(dir, { recursive: true })) {
                    if (!name.endsWith(".json")) continue;
                    const record = JSON.parse(fs.readFileSync(path.join(dir, name), "utf8"));
                    for (const entry of record.analysisHistory ?? []) {
                      usd += entry.costUsd ?? 0;
                      tokens.input += entry.usage?.inputTokens ?? 0;
                      tokens.cached += entry.usage?.cacheReadInputTokens ?? 0;
                      tokens.output += entry.usage?.outputTokens ?? 0;
                      if (entry.model) models.add(entry.model);
                    }
                  }
                }
                const count = (n) => Math.round(n).toLocaleString("en-US");
                const model = models.size > 0 ? ` with ${[...models].map((m) => `\`${m}\``).join(", ")}` : "";
                console.log(
                  `<sub>Estimated model cost: $${usd.toFixed(usd < 1 ? 4 : 2)}${model} · ` +
                    `${count(tokens.input)} input, ${count(tokens.cached)} cached input, ${count(tokens.output)} output tokens. ` +
                    "Uses DeepSec price data and excludes batches that failed or were stopped.</sub>",
                );
              ' "${lists[@]/%/.data}"
            fi
          } > comment.md
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deepsec-comment
          path: .deepsec/comment.md
          if-no-files-found: ignore
          retention-days: 7
  comment:
    needs: [gate, analyze]
    if: always() && !cancelled() && needs.analyze.result != 'skipped'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: deepsec-comment
          path: report
      - name: Update PR comment
        id: publish
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          REVIEW_SHA: ${{ needs.gate.outputs.head_sha }}
          SCAN_RESULT: ${{ needs.analyze.outputs.scan_result }}
          SCAN_JOB_URL: ${{ needs.analyze.outputs.job_url }}
          RUNS_AUTOMATIC_MAX: 2
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- unkey-deepsec -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: issue_number,
            });
            if (pr.head.sha !== process.env.REVIEW_SHA) {
              core.info('Skipping results for an outdated PR head.');
              return;
            }
            const jobUrl = process.env.SCAN_JOB_URL || process.env.DEPOT_JOB_URL;
            if (!jobUrl) throw new Error('Depot job URL is missing');
            let summary;
            if (fs.existsSync('report/comment.md')) {
              summary = fs.readFileSync('report/comment.md', 'utf8');
            } else if (process.env.SCAN_RESULT === 'success') {
              summary = 'No new findings in the selected changed files, or no eligible files to review.';
            } else {
              summary = 'The scan did not complete. Check the CI run for missing credentials, timeouts, or scanner errors. This is not a clean review.';
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'depot-code-access[bot]' && comment.body?.startsWith(marker)
            );
            const runsAutomaticPrevious = previous
              ? Number(previous.body.match(/<!-- unkey-deepsec-automatic-runs: (\d+) -->/)?.[1] ?? 1)
              : 0;
            const runsAutomatic = runsAutomaticPrevious + (context.eventName === 'pull_request' ? 1 : 0);
            const counter = `<!-- unkey-deepsec-automatic-runs: ${runsAutomatic} -->`;
            const limit = runsAutomatic >= Number(process.env.RUNS_AUTOMATIC_MAX)
              ? '\n\nDeepSec reviews a pull request automatically at most twice. Run the DeepSec workflow manually to review later changes.'
              : '';
            const body = `${marker}\n${counter}\n## DeepSec security review\n\nAdvisory review of ${process.env.REVIEW_SHA}.\n\n${summary.slice(0, 50000)}\n\n[View logs and report artifacts on Depot](${jobUrl})${limit}`;
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

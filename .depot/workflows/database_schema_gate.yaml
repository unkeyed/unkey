name: Database Schema Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PSCALE_ORG: unkey
  PSCALE_DB: unkey
  PSCALE_BASE: main
  BRANCH: schema-check-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  gate:
    if: github.event_name != 'schedule'
    name: Compare production schema
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    env:
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            db_schema:
              - 'web/internal/db/src/schema/**'
              - 'web/internal/db/drizzle.config.ts'
              - 'web/internal/db/package.json'

      - name: Check whether validation is required
        id: preflight
        env:
          DB_SCHEMA_CHANGED: ${{ steps.changes.outputs.db_schema }}
        run: |
          set -euo pipefail
          if [ "$DB_SCHEMA_CHANGED" != "true" ]; then
            echo "The database schema did not change."
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"

      - uses: planetscale/setup-pscale-action@b6a50ee45b4b24944e1d8de6e57b3a5f6476a1af # v1
        if: steps.preflight.outputs.required == 'true'

      - name: Install mise
        if: steps.preflight.outputs.required == 'true'
        run: |
          ./dev/install-mise
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install toolchain
        if: steps.preflight.outputs.required == 'true'
        run: mise install --locked --yes node github:pnpm/pnpm

      - name: Compare proposed schema with production
        if: steps.preflight.outputs.required == 'true'
        run: |
          set -euo pipefail
          BRANCH="$BRANCH" FROM="$PSCALE_BASE" mise run pscale-branch

          # PlanetScale's schema API can lag a completed drizzle-kit push by a
          # few seconds. Keep checking through a bounded propagation window so
          # an initially empty response cannot produce a false pass.
          for attempt in $(seq 1 7); do
            BRANCH_DIFF=$(pscale branch diff "$PSCALE_DB" "$BRANCH" \
              --org "$PSCALE_ORG" --format json)

            if ! jq -e 'type == "array"' <<< "$BRANCH_DIFF" >/dev/null; then
              echo "::error::PlanetScale returned an invalid branch diff."
              exit 1
            fi
            if ! jq -e 'length == 0' <<< "$BRANCH_DIFF" >/dev/null; then
              echo "::error::The production PlanetScale schema does not match this pull request. Deploy the schema changes through staging and main, then rerun this check."
              jq -r '.[].raw' <<< "$BRANCH_DIFF"
              exit 1
            fi
            if [ "$attempt" -lt 7 ]; then
              sleep 5
            fi
          done

          echo "The production PlanetScale schema matches this change."

      - name: Delete schema check branch
        if: always() && steps.preflight.outputs.required == 'true'
        run: |
          pscale branch delete "$PSCALE_DB" "$BRANCH" \
            --org "$PSCALE_ORG" --force || true

  cleanup:
    if: github.event_name == 'schedule'
    name: Delete stale schema check branches
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    env:
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
    steps:
      - uses: planetscale/setup-pscale-action@b6a50ee45b4b24944e1d8de6e57b3a5f6476a1af # v1

      - name: Delete branches older than six hours
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '6 hours ago' +%s)
          pscale branch list "$PSCALE_DB" --org "$PSCALE_ORG" --format json \
            | jq -r --argjson cutoff "$CUTOFF" '
                .[]
                | select(.name | startswith("schema-check-"))
                | select(
                    (.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
                    < $cutoff
                  )
                | .name
              ' \
            | while read -r branch; do
                pscale branch delete "$PSCALE_DB" "$branch" \
                  --org "$PSCALE_ORG" --force
              done

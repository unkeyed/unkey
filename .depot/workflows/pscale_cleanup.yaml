name: PlanetScale Cleanup
# Tears down the per-PR PlanetScale branch when a PR closes. A merged PR has
# already had its schema promoted to `main` (the schema-changes runbook
# requires it before merge), and an abandoned PR is never promoted, so in both
# cases the branch and its open deploy requests are safe to remove.
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
env:
  PSCALE_ORG: unkey
  PSCALE_DB: unkey
  BRANCH: pr-${{ github.event.pull_request.number }}
jobs:
  cleanup:
    name: Delete PlanetScale branch
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
    steps:
      - uses: planetscale/setup-pscale-action@b6a50ee45b4b24944e1d8de6e57b3a5f6476a1af # v1

      - name: close open deploy requests
        # Branch deletion fails while a DR is open, so close them first.
        run: |
          set -euo pipefail
          pscale deploy-request list "$PSCALE_DB" --org "$PSCALE_ORG" --format json \
            | jq -r --arg b "$BRANCH" \
                '.[] | select(.branch==$b and .state=="open") | .number' \
            | while read -r num; do
                pscale deploy-request close "$PSCALE_DB" "$num" --org "$PSCALE_ORG" || true
              done

      - name: delete branch
        run: pscale branch delete "$PSCALE_DB" "$BRANCH" --org "$PSCALE_ORG" --force || true

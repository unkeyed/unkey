name: Validate Workflows
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Validate Workflow Syntax
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: ./.depot/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate workflow YAML
        run: |
          mise exec -- dprint check --config dev/dprint.json \
            '.depot/workflows/*.{yaml,yml}' '.depot/actions/*/action.{yaml,yml}' '.github/workflows/*.{yaml,yml}'

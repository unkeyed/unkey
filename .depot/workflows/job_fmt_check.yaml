name: Format Check
on:
  workflow_call:
permissions:
  contents: read
jobs:
  format-check:
    name: Format check
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0
      - uses: ./.depot/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format
        run: mise run fmt
      - name: Check changed TypeScript tests
        run: mise run lint-test-web "$TEST_BASE"
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'HEAD^' }}
      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo
            echo "Formatting drift detected. Run 'mise run fmt' locally and push again."
            exit 1
          fi

# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

monorepo:
  tag_prefix: cli/

partial:
  by: goos

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # Never publish a binary with an empty WorkOS client ID: the default
    # `unkey auth login` OAuth flow would fail on every released build. A missing
    # GitHub secret renders to an empty string (set but blank), which .Env alone
    # would not catch, so guard against unset-or-empty here.
    - sh -c 'test -n "${UNKEY_WORKOS_CLIENT_ID:-}" || { echo "UNKEY_WORKOS_CLIENT_ID must be set for release builds"; exit 1; }'

builds:
  - id: unkey
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: unkey

    ldflags:
      - -s -w
      - -X 'github.com/unkeyed/unkey/pkg/buildinfo.Version={{.Version}}'
      - -X 'github.com/unkeyed/unkey/pkg/buildinfo.Revision={{.FullCommit}}'
      - -X 'github.com/unkeyed/unkey/pkg/buildinfo.BuildTime={{.Date}}'
      # WorkOS OAuth public client ID, baked in per environment at link time so
      # `unkey auth login` works without runtime configuration. Referencing
      # .Env.UNKEY_WORKOS_CLIENT_ID (not envOrDefault) makes GoReleaser fail the
      # build when the variable is unset, so we never publish a binary with an
      # empty client ID.
      - -X 'github.com/unkeyed/unkey/cmd/api/util.defaultWorkOSClientID={{ .Env.UNKEY_WORKOS_CLIENT_ID }}'

upx:
  - enabled: true
    ids:
      - unkey
    goos:
      - linux # UPX doesn't support macOS
    compress: best
    lzma: true

archives:
  - id: unkey
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

npms:
  - name: "unkey"
    ids:
      - unkey
    description: "Unkey CLI"
    homepage: "https://unkey.com"
    repository: "https://github.com/unkeyed/unkey"
    license: "AGPL-3.0-only"
    tag: "{{ if .Prerelease }}next{{ else }}latest{{ end }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto

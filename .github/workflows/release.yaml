name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "cli/v[0-9]+.[0-9]+.[0-9]+*"
permissions:
  contents: read
concurrency: release
jobs:
  prepare:
    timeout-minutes: 30
    strategy:
      matrix:
        goos: [linux, darwin]
    runs-on: depot-ubuntu-24.04-4
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: ./.depot/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scope changelog to CLI dependencies
        run: |
          mkdir -p .cache
          mise run release-config -- .goreleaser.yaml > .cache/release.yaml
      - name: Run GoReleaser (split)
        run: mise exec -- goreleaser release --clean --split --config .cache/release.yaml
        env:
          GOOS: ${{ matrix.goos }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Upload split artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-${{ matrix.goos }}
          path: dist/${{ matrix.goos }}
          retention-days: 1
          if-no-files-found: error
  release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: ./.depot/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download linux dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-linux
          path: dist/linux
      - name: Download darwin dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-darwin
          path: dist/darwin
      - name: Restore executable bit on binaries
        run: |
          find dist/linux dist/darwin -type f -name 'unkey' -exec chmod +x {} +
      - name: Run GoReleaser (merge)
        run: mise exec -- goreleaser continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          NPM_CONFIG_PROVENANCE: "true"

name: Sync Notion

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".github/workflows/sync-notion.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Sync documents
        uses: unkeyed/actions/notion@144be1ca0e6741f123d4b081aa3ebd0b2258497e
        with:
          root-page-id: 3f1512d643f380d2b1affdac1d6420c8
          repository-base-path: contributing
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

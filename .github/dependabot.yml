version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    open-pull-requests-limit: 2
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: "increase"
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/tools/pricing"
      - "/web/tools/gha-fetch-digest"
    open-pull-requests-limit: 2
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      # github.com/docker/docker is a deprecated module path: none of its open
      # advisories have a patched version, so Dependabot's security update fails
      # with security_update_not_found and aborts the whole gomod run.
      - dependency-name: "github.com/docker/docker"
      # k8s.io/api moves in lockstep with k8s.io/apimachinery and
      # k8s.io/client-go; updating it alone makes Go resolution fail on the
      # beta API packages the pinned client-go imports
      # (dependency_file_not_resolvable) and aborts the whole gomod run.
      - dependency-name: "k8s.io/api"
      # Dependabot's Go updater cannot reconcile vitess.io/vitess's module path
      # (go_module_path_mismatch), which aborts the whole gomod run.
      - dependency-name: "vitess.io/vitess"
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dev"
      - "/docs/engineering"
      - "/docs/product"
      - "/svc/heimdall/internal/network/bpf"
      - "/svc/kitchensink"
      - "/web/apps/portal"
    open-pull-requests-limit: 2
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker-compose"
    directories:
      - "/pkg/testutil"
      - "/web/apps/dashboard/dev"
    open-pull-requests-limit: 2
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

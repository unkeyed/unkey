instance_id = "ctrl-api-dev"
region = "local"
http_port = 7091
auth_token = "your-local-dev-key"
default_domain = "unkey.local"
cname_domain = "unkey.local"
database = "unkey:password@tcp(mysql:3306)/unkey?parseTime=true&interpolateParams=true"

[restate]
url = "http://restate:8080"
admin_url = "http://restate:9070"

[clickhouse]
# Used by ReportInstanceEvents to absorb container lifecycle events from
# krane into instance_events_raw_v1. Without this URL the buffer falls
# back to a noop and the dashboard's events panel stays empty.
url = "clickhouse://default:password@clickhouse:9000?secure=false&skip_verify=true"

[logdrain]
# Endpoint verification runs here, so without this a locally created drain
# cannot point at a private or plain-http address. Mirrors the logdrain
# service's flag of the same name (svc/logdrain/config.go); that service is
# not part of this stack. Local development only: with it on, verification
# passes endpoints the deployed sink would refuse.
insecure_allow_private_endpoints = true

[domain_connect]
private_key_pem = """${UNKEY_DOMAIN_CONNECT_PRIVATE_KEY}"""

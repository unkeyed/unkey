role: Agent
fullnameOverride: vector-logs

rbac:
  create: false

image:
  repository: timberio/vector
  tag: 0.43.1-alpine
  sha: 3677b6007e24e88a6b2a42f51c25fda27b6579e7c3b704fb63c770e5be06cd1a

existingConfigMaps:
  - vector-logs-config
dataDir: /var/lib/vector
rollWorkload: false
rollWorkloadExtraObjects: true
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: vector-logs-config
    data: {}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: vector-logs
    rules:
      - apiGroups: [""]
        resources: ["namespaces", "pods", "nodes"]
        verbs: ["list", "watch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: vector-logs
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: vector-logs
    subjects:
      - kind: ServiceAccount
        name: vector-logs
        namespace: unkey

service:
  enabled: false
serviceHeadless:
  enabled: false

defaultVolumes:
  - name: var-log
    hostPath:
      path: /var/log
  - name: var-lib-docker
    hostPath:
      path: /var/lib/docker
defaultVolumeMounts:
  - name: var-log
    mountPath: /var/log
    readOnly: true
  - name: var-lib-docker
    mountPath: /var/lib/docker
    readOnly: true

persistence:
  hostPath:
    enabled: true
    path: /var/lib/vector

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
terminationGracePeriodSeconds: 30

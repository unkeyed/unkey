apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../manifests/heimdall.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: heimdall
        namespace: unkey
      spec:
        template:
          spec:
            containers:
              - name: heimdall
                securityContext:
                  appArmorProfile:
                    type: Unconfined

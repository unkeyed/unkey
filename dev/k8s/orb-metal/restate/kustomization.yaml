apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../manifests/restate.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: restate
        namespace: unkey
      spec:
        template:
          spec:
            containers:
              - name: restate
                env:
                  - name: RESTATE_BIND_IP
                    value: "0.0.0.0"

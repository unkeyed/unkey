---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: unkey
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: ghcr.io/dragonflydb/dragonfly:v1.38.1@sha256:baf70ba7ad182a992b988497cfa31a488978c8fab7712079784c2401f447e402
          args:
            - --dbfilename=
            - --proactor_threads=2
            - --maxmemory=512mb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(redis-cli ping)" = PONG'
            periodSeconds: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'test "$(redis-cli ping)" = PONG'
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: unkey
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: LoadBalancer

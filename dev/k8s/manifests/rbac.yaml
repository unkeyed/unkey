---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krane
  namespace: unkey
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heimdall
  namespace: unkey
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctrl-api
  namespace: unkey
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctrl-worker
  namespace: unkey
# Local builds use Kubernetes Jobs instead of Depot.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctrl-worker-builds
  namespace: unkey
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctrl-worker-builds
  namespace: unkey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ctrl-worker-builds
subjects:
  - kind: ServiceAccount
    name: ctrl-worker
    namespace: unkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krane-vm-manager
  labels:
    app: unkey
    component: krane
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["create", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "patch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krane-vm-manager-binding
  labels:
    app: unkey
    component: krane
subjects:
  - kind: ServiceAccount
    name: krane
    namespace: unkey
roleRef:
  kind: ClusterRole
  name: krane-vm-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krane-lease
  namespace: unkey
  labels:
    app: unkey
    component: krane
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["krane"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krane-lease
  namespace: unkey
  labels:
    app: unkey
    component: krane
subjects:
  - kind: ServiceAccount
    name: krane
    namespace: unkey
roleRef:
  kind: Role
  name: krane-lease
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heimdall
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heimdall
subjects:
  - kind: ServiceAccount
    name: heimdall
    namespace: unkey
roleRef:
  kind: ClusterRole
  name: heimdall
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: unkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: unkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-collector
  namespace: unkey
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-collector
  namespace: unkey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: unkey

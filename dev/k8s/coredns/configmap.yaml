apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    tilt.dev/down-policy: keep
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        hosts {
            ${MINIKUBE_HOST_IP} host.minikube.internal
            fallthrough
        }
        forward . /etc/resolv.conf {
            max_concurrent 1000
        }
        cache 30 {
            disable success cluster.local
            disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    unkey.internal:53 {
        errors
        cache 5
        loadbalance
        rewrite stop {
            name regex ^(${REGION_LABEL})\.unkey-connection-(${CONNECTION_TOKEN})\.(${NAMESPACE_LABEL})\.unkey\.internal\.$ unkey-r-{2}-{1}.{3}.svc.cluster.local.
            answer auto
        }
        rewrite stop {
            name regex ^(unkey-connection-${CONNECTION_TOKEN})\.(${NAMESPACE_LABEL})\.unkey\.internal\.$ {1}.{2}.svc.cluster.local.
            answer auto
        }
        template ANY ANY unkey.internal {
            rcode NXDOMAIN
        }
        kubernetes cluster.local {
            ttl 5
        }
    }

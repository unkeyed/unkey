<!doctype html>
<html lang="en" class="antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unkey · App row directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <style>
    body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: hsla(240 100% 9% / 0.15); border-radius: 9999px; border: 3px solid transparent; background-clip: padding-box; }

    /* Rows rise in on mount — 8px, 180ms, ease-out, small stagger. Enough to
       show the list assembling; short enough to never be in the way. */
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .row-in {
      animation: rowIn 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    /* A build is the one row state that is genuinely in motion, so the dot
       breathes rather than sitting still and lying about it. */
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    .dot-pulse { animation: dotPulse 1600ms ease-in-out infinite; }
    @keyframes barGrow {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
    .bar-grow { transform-origin: bottom; animation: barGrow 220ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    @media (prefers-reduced-motion: reduce) {
      .row-in, .dot-pulse, .bar-grow { animation: none; }
    }

    /* ---------------- picker (verbatim from PICKER.md) ---------------- */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }
    .proto-picker-item[data-active] { color: #fff; }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body class="bg-white text-accent-12">
  <div class="h-dvh w-full flex flex-col overflow-hidden bg-white">
    <!-- Top nav -->
    <header class="flex w-full shrink-0 items-center gap-1 border-b border-grayA-4 bg-gray-1 px-4" style="height:52px">
      <span class="inline-flex size-6 shrink-0 items-center justify-center text-accent-12">
        <svg viewBox="0 0 512 512" fill="currentColor" class="size-5"><path d="M170.8 115V340.6H341.2L284.4 397H170.8C139.418 397 114 371.761 114 340.6V115H170.8Z"/><path d="M398 284.2L341.2 340.6V115H398V284.2Z"/></svg>
      </span>
      <span class="select-none px-0.5 text-gray-7">/</span>
      <span class="flex min-w-0 items-center gap-1.5 rounded-md px-1.5 py-1 text-[13px] font-medium text-accent-12">
        <span class="size-4 rounded-sm border border-grayA-6 shrink-0 bg-gradient-to-br from-[#f97316] via-[#ec4899] to-[#8b5cf6]"></span>
        test1202101
      </span>
      <span class="select-none px-0.5 text-gray-7">/</span>
      <span class="flex min-w-0 items-center gap-1.5 rounded-md px-1.5 py-1 text-[13px] font-medium text-accent-12">acme-corp</span>
      <div class="ml-auto flex shrink-0 items-center gap-1">
        <button class="hidden md:inline-flex h-8 items-center gap-2 rounded-lg border border-grayA-4 bg-white px-3 text-[13px] font-medium text-accent-12 hover:bg-grayA-3">Feedback</button>
        <span class="size-6 rounded-full border border-grayA-6 bg-gradient-to-br from-[#22d3ee] via-[#6366f1] to-[#a855f7]"></span>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- Project nav -->
      <aside class="shrink-0 bg-gray-1 border-r border-grayA-4 flex flex-col py-2" style="width:13rem">
        <nav id="projectNav" class="px-2 flex flex-col gap-0.5"></nav>
      </aside>

      <!-- Content -->
      <div class="flex-1 overflow-auto bg-white" style="scrollbar-gutter:stable">
        <div class="w-full max-w-[1240px] px-7 py-6">
          <div class="flex items-center justify-between gap-4">
            <h1 class="truncate text-[22px] font-semibold leading-tight tracking-tight text-accent-12">acme-corp</h1>
            <button class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg border border-grayA-4 bg-white px-3 text-[13px] font-medium text-accent-12 hover:bg-grayA-3">Documentation</button>
          </div>

          <div class="mt-6 flex items-start gap-5">
            <!-- STAGE: the apps card, swapped per variant -->
            <div class="flex min-w-0 flex-1 flex-col gap-5">
              <div id="stage"></div>
              <div id="checklist"></div>
            </div>
            <aside id="rail" class="flex w-[260px] shrink-0 flex-col gap-4"></aside>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Table</button>
    <button class="proto-picker-item">Shipped</button>
    <button class="proto-picker-item">Split</button>
    <button class="proto-picker-item">Live</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    // ---------------------------------------------------------------- icons
    const s = (d, c = '') => `<svg viewBox="0 0 24 24" class="${c}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const I = {
      pulse: (c) => s('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>', c),
      cube: (c) => s('<path d="m21 16-9 5-9-5V8l9-5 9 5z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>', c),
      key: (c) => s('<circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>', c),
      gauge: (c) => s('<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>', c),
      shield: (c) => s('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>', c),
      layers: (c) => s('<path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>', c),
      arrows: (c) => s('<path d="m7 3v18"/><path d="m3 7 4-4 4 4"/><path d="M17 21V3"/><path d="m13 17 4 4 4-4"/>', c),
      cog: (c) => s('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 11 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 11a2 2 0 1 1 0 4z"/>', c),
      fingerprint: (c) => s('<path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>', c),
      github: (c) => `<svg viewBox="0 0 24 24" fill="currentColor" class="${c}"><path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.48l-.01-1.7c-2.78.62-3.37-1.37-3.37-1.37-.46-1.18-1.11-1.5-1.11-1.5-.9-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.55-1.14-4.55-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9l-.01 2.82c0 .27.18.59.69.48A10.02 10.02 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/></svg>`,
      terminal: (c) => s('<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>', c),
      branch: (c) => s('<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>', c),
      plus: (c) => s('<path d="M5 12h14"/><path d="M12 5v14"/>', c),
      check: (c) => s('<path d="M20 6 9 17l-5-5"/>', c),
      dots: (c) => `<svg viewBox="0 0 24 24" fill="currentColor" class="${c}"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
      discord: (c) => `<svg viewBox="0 0 24 24" fill="currentColor" class="${c}"><path d="M20.32 4.57A19.8 19.8 0 0 0 15.44 3c-.2.37-.44.87-.6 1.27a14.9 14.9 0 0 0-4.45 0c-.16-.4-.4-.9-.62-1.27a19.7 19.7 0 0 0-4.88 1.58C1.78 9.07.95 13.42 1.36 17.7A19.9 19.9 0 0 0 7.4 20.8c.47-.65.9-1.35 1.25-2.08-.68-.26-1.34-.58-1.96-.95.16-.12.32-.25.47-.38a14.2 14.2 0 0 0 12.1 0c.16.14.32.26.48.38-.62.37-1.28.7-1.97.95.36.73.78 1.43 1.26 2.08a19.86 19.86 0 0 0 6.04-3.1c.5-4.96-.83-9.27-3.5-13.13zM8.68 15.1c-1.18 0-2.15-1.1-2.15-2.44 0-1.35.95-2.45 2.15-2.45s2.17 1.1 2.15 2.45c0 1.34-.95 2.44-2.15 2.44zm7.94 0c-1.18 0-2.15-1.1-2.15-2.44 0-1.35.95-2.45 2.15-2.45s2.16 1.1 2.14 2.45c0 1.34-.94 2.44-2.14 2.44z"/></svg>`,
      chats: (c) => s('<path d="M8 10h8"/><path d="M8 14h5"/><path d="M21 12a8 8 0 0 1-8 8H8l-5 3v-6a8 8 0 0 1 8-8h2a8 8 0 0 1 8 3z"/>', c),
    };

    // ---------------------------------------------------------------- data
    // Deliberately mixed: two healthy production apps, one mid-build off a
    // feature branch, one failed docs deploy. A list where everything is green
    // hides half of what a row has to say.
    const APPS = [
      {
        name: 'api-gateway', source: 'github', repo: 'unkey/api-gateway', domain: 'api.acme.com',
        message: 'fix: retry key verification on 401', sha: 'a3f9c21', branch: 'main',
        actor: 'chronark', avatar: 'from-[#22d3ee] via-[#6366f1] to-[#a855f7]',
        age: '2h ago', env: 'Production', status: 'ready',
        reqs: '1.10M', errPct: 0.2,
        spark: [30, 34, 31, 38, 35, 42, 39, 45, 41, 48, 44, 46, 43, 47, 45, 49],
      },
      {
        name: 'checkout-service', source: 'github', repo: 'unkey/checkout-service', domain: 'checkout.acme.com',
        message: 'chore: bump @unkey/api to 2.1.0', sha: '7c14be0', branch: 'main',
        actor: 'dave', avatar: 'from-[#f97316] via-[#ec4899] to-[#8b5cf6]',
        age: '1d ago', env: 'Production', status: 'ready',
        reqs: '126K', errPct: 0.5,
        spark: [18, 21, 19, 24, 22, 20, 26, 23, 27, 25, 22, 24, 21, 25, 23, 22],
      },
      {
        name: 'internal-tools', source: 'code', repo: null, domain: null,
        message: 'feat: add admin ratelimit override', sha: 'e02da71', branch: 'feat/overrides',
        actor: 'oz', avatar: 'from-[#34d399] via-[#0ea5e9] to-[#6366f1]',
        age: '6m ago', env: 'Preview', status: 'building',
        reqs: '14K', errPct: 2.1,
        spark: [6, 8, 5, 9, 7, 11, 8, 14, 10, 16, 12, 9, 13, 11, 15, 12],
      },
      {
        name: 'docs-site', source: 'github', repo: 'unkey/docs-site', domain: 'docs.acme.com',
        message: 'docs: fix broken links in quickstart', sha: 'bb5410f', branch: 'fix/links',
        actor: 'james-r', avatar: 'from-[#f472b6] via-[#a855f7] to-[#6366f1]',
        age: '3d ago', env: 'Production', status: 'failed',
        reqs: '8.2K', errPct: 0,
        spark: [4, 5, 4, 6, 5, 7, 5, 8, 6, 7, 5, 6, 4, 5, 6, 5],
      },
    ];

    const STATUS = {
      ready:    { label: 'Ready',    dot: 'bg-success-9', text: 'text-gray-11', chip: 'bg-success-3 text-success-11' },
      building: { label: 'Building', dot: 'bg-warning-9', text: 'text-warning-11', chip: 'bg-warning-3 text-warning-11' },
      failed:   { label: 'Failed',   dot: 'bg-error-9',   text: 'text-error-11', chip: 'bg-error-3 text-error-11' },
    };

    const sourceIcon = (app, cls) => (app.source === 'github' ? I.github(cls) : I.terminal(cls));
    const dot = (app, extra = '') =>
      `<span class="size-1.5 shrink-0 rounded-full ${STATUS[app.status].dot} ${app.status === 'building' ? 'dot-pulse' : ''} ${extra}"></span>`;
    const stagger = (i) => `style="animation-delay:${i * 25}ms"`;
    const actions = () =>
      `<button class="shrink-0 rounded-md p-1 text-gray-9 hover:bg-grayA-3 hover:text-accent-12">${I.dots('size-4')}</button>`;

    const cardShell = (inner, headerExtra = '') => `
      <div class="rounded-lg border border-grayA-4 bg-white">
        <div class="flex items-center justify-between gap-3 px-4 pt-3 pb-1.5">
          <div class="flex items-center gap-2">
            <span class="text-[13px] font-medium text-accent-12">Apps</span>
            <span class="rounded-full bg-grayA-3 px-1.5 py-0.5 text-[11px] font-medium tabular-nums text-gray-11">${APPS.length}</span>
            ${headerExtra}
          </div>
          <button class="inline-flex h-8 items-center gap-1.5 rounded-lg border border-grayA-4 bg-white px-2.5 text-[13px] font-medium text-accent-12 hover:bg-grayA-3">
            ${I.plus('size-3.5')} Create app
          </button>
        </div>
        ${inner}
      </div>`;

    // ------------------------------------------------------- 1 · Table
    // Axis: column alignment and density. Every field owns a column, so the eye
    // scans down one attribute at a time instead of re-parsing each row.
    const variantTable = () => cardShell(`
      <div class="grid grid-cols-[minmax(0,1fr)_120px_92px_84px_32px] items-center gap-3 border-b border-grayA-4 px-4 pb-2 pt-1 text-[10px] font-medium uppercase tracking-wide text-gray-9">
        <span>App</span>
        <span>Branch</span>
        <span>Status</span>
        <span class="text-right">Updated</span>
        <span></span>
      </div>
      <div class="divide-y divide-grayA-4">
        ${APPS.map((app, i) => `
          <a href="#" class="grid grid-cols-[minmax(0,1fr)_120px_92px_84px_32px] items-center gap-3 px-4 py-2.5 hover:bg-grayA-2 row-in" ${stagger(i)}>
            <span class="flex min-w-0 items-center gap-2.5">
              <span class="shrink-0 text-gray-12">${sourceIcon(app, 'size-4')}</span>
              <span class="shrink-0 text-[13px] font-medium text-accent-12">${app.name}</span>
              <span class="truncate text-[13px] text-gray-9">${app.message}</span>
            </span>
            <span class="flex min-w-0 items-center gap-1.5 text-xs text-gray-11">
              ${I.branch('size-3 shrink-0 text-gray-9')}
              <span class="mono truncate">${app.branch}</span>
            </span>
            <span class="flex items-center gap-1.5 text-xs ${STATUS[app.status].text}">
              ${dot(app)}${STATUS[app.status].label}
            </span>
            <span class="text-right text-xs tabular-nums text-gray-9">${app.age}</span>
            ${actions()}
          </a>`).join('')}
      </div>`);

    // ------------------------------------------------------ 2 · Shipped
    // Axis: hierarchy inversion. The commit is the headline and the app name
    // drops to metadata — the row answers "what shipped" before "what exists".
    const variantShipped = () => cardShell(`
      <div class="divide-y divide-grayA-4">
        ${APPS.map((app, i) => `
          <a href="#" class="flex items-start gap-3 px-4 py-3 hover:bg-grayA-2 row-in" ${stagger(i)}>
            <span class="mt-0.5 flex shrink-0 items-center">${dot(app)}</span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-[13px] font-medium text-accent-12">${app.message}</span>
              <span class="mt-1 flex min-w-0 items-center gap-1.5 text-xs text-gray-9">
                <span class="shrink-0 text-gray-11">${sourceIcon(app, 'size-3 inline-block align-[-1px] mr-1 text-gray-9')}${app.name}</span>
                <span class="text-gray-7">·</span>
                <span class="mono shrink-0">${app.sha}</span>
                <span class="text-gray-7">·</span>
                <span class="mono truncate">${app.branch}</span>
                <span class="text-gray-7">·</span>
                <span class="shrink-0">${app.age} by ${app.actor}</span>
              </span>
            </span>
            <span class="hidden shrink-0 items-center gap-2 sm:flex">
              <span class="rounded-md px-1.5 py-0.5 text-[11px] font-medium ${STATUS[app.status].chip}">${STATUS[app.status].label}</span>
              <span class="text-[11px] text-gray-9">${app.env}</span>
            </span>
            ${actions()}
          </a>`).join('')}
      </div>`);

    // -------------------------------------------------------- 3 · Split
    // Axis: spatial grouping. The app's identity sits on the left; its latest
    // deployment lives in its own inset panel, so "what it is" and "what it's
    // doing" never blur into one line of text.
    const variantSplit = () => cardShell(`
      <div class="divide-y divide-grayA-4">
        ${APPS.map((app, i) => `
          <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-grayA-2 row-in" ${stagger(i)}>
            <span class="flex size-9 shrink-0 items-center justify-center rounded-[10px] bg-gray-3 text-gray-12">
              ${sourceIcon(app, 'size-[18px]')}
            </span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-[13px] font-medium text-accent-12">${app.name}</span>
              <span class="mt-0.5 block truncate text-xs text-gray-9">
                ${app.domain ?? (app.repo ? app.repo : 'Deployed from the CLI')}
              </span>
            </span>
            <span class="hidden min-w-0 max-w-[300px] flex-1 items-center gap-2.5 rounded-lg border border-grayA-4 bg-gray-2 px-2.5 py-2 lg:flex">
              ${dot(app)}
              <span class="min-w-0 flex-1">
                <span class="block truncate text-xs text-gray-11">${app.message}</span>
                <span class="mt-0.5 flex items-center gap-1.5 text-[11px] text-gray-9">
                  <span class="mono">${app.sha}</span>
                  <span class="text-gray-7">·</span>
                  <span class="tabular-nums">${app.age}</span>
                </span>
              </span>
            </span>
            ${actions()}
          </a>`).join('')}
      </div>`);

    // --------------------------------------------------------- 4 · Live
    // Axis: telemetry and state motion. The row carries the app's last 24h so
    // the list answers "is it healthy" without a click; the building row's dot
    // breathes because that state is genuinely in progress.
    const bars = (points, i) => {
      const max = Math.max(...points);
      return `<span class="flex h-7 w-[104px] shrink-0 items-end gap-[2px]">
        ${points.map((p, j) => `
          <span class="flex-1 rounded-[1px] bg-accent-4 bar-grow" style="height:${Math.max(12, (p / max) * 100)}%;animation-delay:${i * 25 + j * 8}ms"></span>`).join('')}
      </span>`;
    };
    const variantLive = () => cardShell(`
      <div class="divide-y divide-grayA-4">
        ${APPS.map((app, i) => `
          <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-grayA-2 row-in" ${stagger(i)}>
            <span class="flex size-9 shrink-0 items-center justify-center rounded-[10px] bg-gray-3 text-gray-12">
              ${sourceIcon(app, 'size-[18px]')}
            </span>
            <span class="min-w-0 flex-1">
              <span class="flex items-center gap-2">
                <span class="shrink-0 text-[13px] font-medium text-accent-12">${app.name}</span>
                <span class="flex shrink-0 items-center gap-1.5 text-xs ${STATUS[app.status].text}">
                  ${dot(app)}${STATUS[app.status].label}
                </span>
              </span>
              <span class="mt-1 block truncate text-xs text-gray-9">${app.message}</span>
            </span>
            ${bars(app.spark, i)}
            <span class="hidden w-[68px] shrink-0 flex-col items-end sm:flex">
              <span class="text-[13px] tabular-nums text-accent-12">${app.reqs}</span>
              <span class="text-[11px] text-gray-9">served</span>
            </span>
            <span class="hidden w-[52px] shrink-0 flex-col items-end sm:flex">
              <span class="text-[13px] tabular-nums ${app.errPct > 1 ? 'text-warning-11' : 'text-accent-12'}">${app.errPct}%</span>
              <span class="text-[11px] text-gray-9">5xx</span>
            </span>
            ${actions()}
          </a>`).join('')}
      </div>`, '<span class="text-xs text-gray-9">· 24h</span>');

    const variants = [variantTable, variantShipped, variantSplit, variantLive];

    // --------------------------------------------------- surrounding context
    document.getElementById('projectNav').innerHTML = [
      ['Overview', I.pulse, true], ['Apps', I.cube, false], ['Keyspaces', I.key, false],
      ['Ratelimits', I.gauge, false], ['Authorization', I.shield, false],
      ['Identities', I.fingerprint, false], ['Logs', I.layers, false],
      ['Requests', I.arrows, false], ['Project Settings', I.cog, false],
    ].map(([label, icon, active]) => `
      <a href="#" class="flex items-center gap-2 rounded-lg px-[10px] h-8 text-[13px] font-medium text-accent-12 ${active ? 'bg-grayA-3' : 'hover:bg-grayA-3'}">
        ${icon(`size-4 shrink-0 ${active ? '' : 'text-gray-9'}`)}<span class="truncate">${label}</span>
      </a>`).join('');

    const STEPS = [
      ['Set up with your agent', 'Copy a prompt · Claude, Cursor, Codex', false],
      ['Deploy an app', '4 apps deployed', true],
      ['Create a keyspace', '2 keyspaces active', true],
      ['Add a ratelimit', '1 namespace active', true],
      ['Add a custom domain', 'Serve on your own hostname', false],
      ['Invite your team', 'Invites sent', true],
    ];
    let stepNo = 0;
    document.getElementById('checklist').innerHTML = `
      <div class="rounded-lg border border-grayA-4 bg-white">
        <div class="px-3.5 pt-3 pb-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[13px] font-medium text-accent-12">Getting started</span>
            <span class="shrink-0 text-xs tabular-nums text-gray-9">4/6</span>
          </div>
          <div class="mt-2.5 h-1.5 overflow-hidden rounded-full bg-gray-3">
            <div class="h-full rounded-full bg-accent-12" style="width:66.6%"></div>
          </div>
        </div>
        <div class="divide-y divide-grayA-4">
          ${STEPS.map(([label, hint, done]) => {
            if (!done) stepNo += 1;
            return `
            <a href="#" class="flex w-full items-center gap-2.5 px-3.5 py-3 hover:bg-grayA-2">
              <span class="flex size-5 shrink-0 items-center justify-center rounded-full ${done ? 'bg-success-3 text-success-11' : 'bg-gray-3 text-[11px] font-medium text-gray-9'}">
                ${done ? I.check('size-3') : stepNo}
              </span>
              <span class="min-w-0 flex-1">
                <span class="block truncate text-[13px] leading-4 ${done ? 'text-gray-9' : 'text-accent-12'}">${label}</span>
                <span class="mt-0.5 block truncate text-xs text-gray-9">${hint}</span>
              </span>
            </a>`;
          }).join('')}
        </div>
      </div>`;

    const railList = (title, rows) => `
      <div class="rounded-lg border border-grayA-4 bg-white">
        <div class="px-3.5 pt-3 pb-1.5"><span class="text-[13px] font-medium text-accent-12">${title}</span></div>
        <div class="divide-y divide-grayA-4">
          ${rows.map(([name, sub]) => `
            <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 hover:bg-grayA-2">
              <span class="min-w-0 flex-1">
                <span class="block truncate text-[13px] leading-4 text-accent-12">${name}</span>
                <span class="mt-0.5 block truncate text-xs text-gray-9">${sub}</span>
              </span>
              <span class="flex h-6 w-20 shrink-0 items-end gap-[2px]">
                ${[28, 34, 30, 38, 33, 42, 36, 45, 39, 48, 41, 44, 38, 46, 42, 40, 36, 44, 39, 43].map((h) => `<span class="flex-1 rounded-[1px] bg-accent-4" style="height:${h * 2}%"></span>`).join('')}
              </span>
            </a>`).join('')}
        </div>
      </div>`;
    document.getElementById('rail').innerHTML =
      railList('Keyspaces', [['production', '2,140 keys'], ['partner-api', '96 keys']]) +
      railList('Ratelimits', [['auth.login', '3.2% blocked']]) + `
      <div class="rounded-lg border border-grayA-4 bg-white">
        <div class="px-3.5 pt-3 pb-1.5"><span class="text-[13px] font-medium text-accent-12">Need help?</span></div>
        <div class="divide-y divide-grayA-4">
          <a href="#" class="flex items-center gap-2.5 px-3.5 py-3 hover:bg-grayA-2">${I.discord('size-3.5 shrink-0 text-gray-9')}<span class="text-[13px] text-gray-11">Ask in Discord</span></a>
          <a href="#" class="flex items-center gap-2.5 px-3.5 py-3 hover:bg-grayA-2">${I.chats('size-3.5 shrink-0 text-gray-9')}<span class="text-[13px] text-gray-11">Get support</span></a>
        </div>
      </div>`;

    // ------------------------------------- picker wiring (verbatim, PICKER.md)
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>

services:
  vitess:
    image: vitess/vttestserver:v24.0.3-mysql80@sha256:230586284ba936139d0f9afb3e7ef8d2494e0fc752cc6ed3f243bcc5082ef485
    command:
      - /vt/bin/vttestserver
      - --port=33574
      - --keyspaces=unkey
      - --num_shards=1
      - --mysql_bind_host=0.0.0.0
      - --vtcombo-bind-host=0.0.0.0
      - --schema_dir=/poc-schema
    ports:
      - "33575"
      - "33577"
    volumes:
      - ../mysql/schema:/poc-schema/unkey:ro
    healthcheck:
      test: [
        "CMD",
        "mysql",
        "--protocol=tcp",
        "-h127.0.0.1",
        "-P33577",
        "-uunkey",
        "-ppassword",
        "unkey",
        "-e",
        "SELECT COUNT(*) FROM workspaces",
      ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:26.2.1.1139@sha256:f57ed23ab5c4ee0e9a05c2e811bb3580ead222cea30421b3e66234c32e272bce
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123"
      - "9000"
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user=default",
          "--password=password",
          "--query=SELECT 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  mysql:
    image: mysql:9.4.0
    command:
      - --max_connections=1000
      - --skip-log-bin
      - --disable-log-bin
      - --innodb-doublewrite=0
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-flush-method=nosync
      - --innodb-buffer-pool-size=512M
      - --innodb-log-buffer-size=1M
      - --performance-schema=OFF
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: unkey
      MYSQL_USER: unkey
      MYSQL_PASSWORD: password
    ports:
      - "3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-h",
        "localhost",
        "-uunkey",
        "-ppassword",
      ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:8.0@sha256:ae471bdc20de180beed36e347d170ec0bdf8faa327959ea1f24692f22b05b955
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxclients
      - "10000"
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  restate:
    image: docker.io/restatedev/restate:1.7.8@sha256:fe23d866cc625a745f73f14e05ee6ca5b26441af3b18df8c54dfda4e1bb1d52d
    environment:
      # Provision a single partition. Restate routes keyed invocations to a
      # partition by hashing the object key, and each partition processor takes
      # leadership independently on cold start. The harness readiness gate probes
      # one fixed key, so with the default 24 partitions it only proves that
      # key's partition is live while a deploy Send keyed by a random
      # deployment_id targets a different, possibly-cold partition and silently
      # queues. One partition makes the readiness probe cover every keyed Send.
      RESTATE_DEFAULT_NUM_PARTITIONS: "1"
      RESTATE_EXPERIMENTAL_ENABLE_VQUEUES: "true"
      RESTATE_EXPERIMENTAL_ENABLE_PROTOCOL_V7: "true"
      # Restate binds the IPv6 wildcard by default and exits when the address
      # family is missing, which is how a CI container without IPv6 gets a
      # Restate that never answers its admin port.
      RESTATE_BIND_ADDRESS: "0.0.0.0:5122"
      RESTATE_INGRESS__BIND_ADDRESS: "0.0.0.0:8080"
      RESTATE_ADMIN__BIND_ADDRESS: "0.0.0.0:9070"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8080"
      - "9070"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9070/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  s3:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: garage-test-access-key
      GARAGE_DEFAULT_SECRET_KEY: garage-test-secret-key
      GARAGE_DEFAULT_BUCKET: vault
    ports:
      - "3902"
    volumes:
      - ./garage.test.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "vault"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  clickhouse:
  mysql:
